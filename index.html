<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SOP Eğitim &amp; Sınav Sistemi</title>
<meta name="theme-color" content="#101316" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SOP Sınav" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#101316;
    --bg-1:#181c20;
    --bg-2:#20252a;
    --bg-3:#282e34;
    --line:#343b42;
    --line-soft:#2a3037;
    --text-0:#eef1f4;
    --text-1:#b8c0c9;
    --text-2:#7c8792;
    --amber:#f5a623;
    --amber-dim:#8a5f16;
    --amber-glow: rgba(245,166,35,0.35);
    --green:#3ecf8e;
    --red:#ff5c5c;
    --blue:#4ea1ff;
    --font-display:'Oswald', 'Arial Narrow', sans-serif;
    --font-body:'Inter', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', 'Consolas', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg-0);color:var(--text-0);font-family:var(--font-body);}
  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(245,166,35,0.06), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(78,161,255,0.05), transparent 40%);
  }
  ::selection{background:var(--amber);color:#1a1200;}
  a{color:inherit;}
  button{font-family:inherit;}

  #app{ min-height:100vh; display:flex; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:230px; flex:0 0 230px; background:var(--bg-1); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:22px 16px; gap:4px;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:26px; padding:0 6px;}
  .brand .mark{
    width:34px;height:34px;border-radius:6px;background:linear-gradient(160deg,var(--amber),#c97e0f);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
    font-weight:700;color:#181200;font-size:16px; flex:0 0 auto;
    box-shadow:0 0 0 1px rgba(0,0,0,0.3), 0 0 18px var(--amber-glow);
  }
  .brand .txt{ line-height:1.15; }
  .brand .txt .l1{font-family:var(--font-display);font-weight:600;font-size:14.5px;letter-spacing:.3px;}
  .brand .txt .l2{font-size:10.5px;color:var(--text-2);letter-spacing:1.2px;text-transform:uppercase;}

  .navgroup-label{ font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--text-2); margin:16px 10px 6px; }
  .navitem{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer;
    color:var(--text-1); font-size:13.5px; font-weight:500; border:1px solid transparent; transition:.15s;
    user-select:none;
  }
  .navitem svg{ width:16px;height:16px;flex:0 0 auto; opacity:.85;}
  .navitem:hover{ background:var(--bg-2); color:var(--text-0); }
  .navitem.active{ background:rgba(245,166,35,0.10); border-color:rgba(245,166,35,0.35); color:var(--amber); }
  .navitem.active svg{ opacity:1; }

  .sidebar-foot{ margin-top:auto; padding:12px 10px; border-top:1px solid var(--line-soft); font-size:10.5px; color:var(--text-2); line-height:1.5;}

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    height:60px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent);
  }
  .topbar h1{ font-family:var(--font-display); font-size:18px; font-weight:600; margin:0; letter-spacing:.3px;}
  .topbar .sub{ font-size:11.5px; color:var(--text-2); margin-top:2px;}
  .content{ flex:1; overflow-y:auto; padding:26px; }

  .pill{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:600; letter-spacing:.6px; text-transform:uppercase;
         padding:4px 10px; border-radius:100px; border:1px solid var(--line); color:var(--text-2);}
  .pill.live{ color:var(--green); border-color:rgba(62,207,142,.35); background:rgba(62,207,142,.08);}
  .pill.closed{ color:var(--text-2); }

  /* ---------- cards / grid ---------- */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .card{
    background:var(--bg-1); border:1px solid var(--line); border-radius:10px; padding:16px;
    display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden;
  }
  .card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--line-soft);}
  .card.tag-amber::before{ background:var(--amber); }
  .card.tag-green::before{ background:var(--green); }
  .card h3{ margin:0; font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:.2px; line-height:1.3;}
  .card p{ margin:0; font-size:12.5px; color:var(--text-1); line-height:1.5; }
  .card .meta{ display:flex; gap:14px; font-size:11px; color:var(--text-2); font-family:var(--font-mono);}
  .card .row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
    border-radius:7px; border:1px solid var(--line); background:var(--bg-2); color:var(--text-0);
    padding:9px 14px; font-size:12.5px; font-weight:600; transition:.15s; letter-spacing:.2px;
  }
  .btn:hover{ background:var(--bg-3); border-color:#454d55; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.primary{ background:linear-gradient(160deg,var(--amber),#c97e0f); border-color:#c97e0f; color:#181200; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.ghost{ background:transparent; }
  .btn.danger{ border-color:rgba(255,92,92,.4); color:var(--red); background:rgba(255,92,92,.06);}
  .btn.sm{ padding:6px 10px; font-size:11.5px; }
  .btn.block{ width:100%; }

  .empty{
    border:1px dashed var(--line); border-radius:10px; padding:40px 20px; text-align:center; color:var(--text-2);
  }
  .empty svg{ width:30px;height:30px; margin-bottom:10px; opacity:.5;}
  .empty .t{ color:var(--text-1); font-weight:600; font-size:13.5px; margin-bottom:4px;}

  input[type=text], input[type=password], textarea, select{
    width:100%; background:var(--bg-0); border:1px solid var(--line); color:var(--text-0);
    padding:10px 12px; border-radius:7px; font-size:13px; font-family:inherit; outline:none;
  }
  input[type=text]:focus, input[type=password]:focus, textarea:focus, select:focus{ border-color:var(--amber); box-shadow:0 0 0 3px rgba(245,166,35,.12); }
  label.field-label{ font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-2); margin-bottom:6px; display:block; font-weight:600;}
  .field{ margin-bottom:16px; }

  .panel{ background:var(--bg-1); border:1px solid var(--line); border-radius:12px; padding:22px; }
  .panel-title{ font-family:var(--font-display); font-size:16px; font-weight:600; margin:0 0 4px; }
  .panel-sub{ font-size:12px; color:var(--text-2); margin:0 0 18px; }

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--bg-3); border:1px solid var(--line);
    padding:12px 16px; border-radius:8px; font-size:12.5px; color:var(--text-0); box-shadow:0 8px 30px rgba(0,0,0,.4);
    z-index:999; max-width:320px;
  }
  .toast.err{ border-color:rgba(255,92,92,.5); color:#ffb3b3; }
  .toast.ok{ border-color:rgba(62,207,142,.5); color:#bdf5da; }

  /* ---------- SOP detail steps ---------- */
  .steplist{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .step{ display:flex; gap:10px; padding:10px 12px; background:var(--bg-0); border:1px solid var(--line-soft); border-radius:8px; }
  .step .no{ font-family:var(--font-mono); color:var(--amber); font-weight:700; font-size:12px; flex:0 0 22px; }
  .step .txt{ font-size:12.5px; color:var(--text-1); line-height:1.5; }
  .step .txt b{ color:var(--text-0); }

  /* ---------- Exam taking ---------- */
  .exam-wrap{ max-width:720px; margin:0 auto; }
  .qcounter{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-2); letter-spacing:1px; margin-bottom:10px; }
  .progressbar{ height:5px; background:var(--bg-2); border-radius:100px; overflow:hidden; margin-bottom:22px; border:1px solid var(--line-soft);}
  .progressbar .fill{ height:100%; background:linear-gradient(90deg,var(--amber),#ffd27a); transition:width .25s; }
  .qcard{ background:var(--bg-1); border:1px solid var(--line); border-radius:12px; padding:22px; }
  .qcard .qtext{ font-size:15.5px; font-weight:600; line-height:1.5; margin-bottom:18px; }
  .opt{
    display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border:1px solid var(--line); border-radius:8px;
    margin-bottom:9px; cursor:pointer; font-size:13px; color:var(--text-1); transition:.12s;
  }
  .opt:hover{ border-color:#454d55; background:var(--bg-2); }
  .opt.selected{ border-color:var(--amber); background:rgba(245,166,35,0.09); color:var(--text-0); }
  .opt .dot{ width:16px;height:16px;border-radius:50%; border:1.5px solid var(--line); flex:0 0 auto; margin-top:1px; position:relative; }
  .opt.selected .dot{ border-color:var(--amber); }
  .opt.selected .dot::after{ content:""; position:absolute; inset:3px; border-radius:50%; background:var(--amber); }

  .exam-nav{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; }

  /* ---------- gauge ---------- */
  .gauge-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:20px 0 6px; }
  .gauge{ width:210px; height:210px; border-radius:50%; position:relative; }
  .gauge .ring{
    position:absolute; inset:0; border-radius:50%;
  }
  .gauge .inner{
    position:absolute; inset:20px; border-radius:50%; background:var(--bg-1); border:1px solid var(--line-soft);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow: inset 0 2px 14px rgba(0,0,0,.5);
  }
  .gauge .needle{
    position:absolute; left:50%; top:50%; width:3px; height:74px; background:var(--text-0);
    transform-origin:50% 100%; border-radius:2px; box-shadow:0 0 6px rgba(255,255,255,.5);
  }
  .gauge .hub{ position:absolute; left:50%; top:50%; width:10px;height:10px; margin:-5px; border-radius:50%; background:var(--text-0); }
  .gauge .pct{ font-family:var(--font-display); font-size:34px; font-weight:700; line-height:1; }
  .gauge .lbl{ font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--text-2); margin-top:6px; }
  .verdict{ font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:.6px; padding:6px 16px; border-radius:100px; }
  .verdict.pass{ background:rgba(62,207,142,.12); color:var(--green); border:1px solid rgba(62,207,142,.4); }
  .verdict.fail{ background:rgba(255,92,92,.12); color:var(--red); border:1px solid rgba(255,92,92,.4); }

  /* ---------- table ---------- */
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-2); padding:9px 10px; border-bottom:1px solid var(--line); }
  td{ padding:10px; border-bottom:1px solid var(--line-soft); color:var(--text-1); }
  tr:hover td{ background:rgba(255,255,255,0.015); }
  td.num{ font-family:var(--font-mono); }
  .score-chip{ font-family:var(--font-mono); font-weight:700; padding:2px 8px; border-radius:5px; font-size:11.5px; }
  .score-chip.good{ background:rgba(62,207,142,.12); color:var(--green); }
  .score-chip.bad{ background:rgba(255,92,92,.12); color:var(--red); }

  .stat-row{ display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .stat{ background:var(--bg-1); border:1px solid var(--line); border-radius:10px; padding:14px 18px; min-width:140px; }
  .stat .v{ font-family:var(--font-display); font-size:24px; font-weight:700; }
  .stat .k{ font-size:10.5px; color:var(--text-2); text-transform:uppercase; letter-spacing:.8px; margin-top:2px;}

  .spinner{ width:16px;height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.25); border-top-color:#181200; animation:spin .7s linear infinite; }
  .spinner.light{ border:2px solid rgba(255,255,255,.15); border-top-color:var(--amber); }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .loading-block{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:60px 20px; color:var(--text-2); }
  .loading-block .needle-spin{ width:60px;height:60px;border-radius:50%; border:3px solid var(--line); border-top-color:var(--amber); animation:spin 1s linear infinite;}

  code.k{ font-family:var(--font-mono); background:var(--bg-0); border:1px solid var(--line-soft); padding:1px 6px; border-radius:4px; font-size:11.5px; color:var(--amber); }

  .backlink{ display:inline-flex; align-items:center; gap:6px; color:var(--text-2); font-size:12px; cursor:pointer; margin-bottom:14px; }
  .backlink:hover{ color:var(--text-0); }

  /* ---------- mobile bottom nav ---------- */
  .bottomnav{
    display:none; position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--bg-1); border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    grid-template-columns:repeat(6,1fr); gap:1px;
  }
  .bottomnav .bnitem{
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px;
    color:var(--text-2); font-size:9.5px; font-weight:600; letter-spacing:.2px; border-radius:8px;
  }
  .bottomnav .bnitem svg{ width:17px;height:17px; }
  .bottomnav .bnitem span{ font-size:8.8px; white-space:nowrap; }
  .bottomnav .bnitem.active{ color:var(--amber); background:rgba(245,166,35,0.08); }

  @media (max-width: 820px){
    .sidebar{ display:none; }
    .content{ padding:14px 14px 76px; }
    .bottomnav{ display:grid; }
    .topbar{ padding:0 14px; height:54px; }
    .topbar h1{ font-size:15.5px; }
    .topbar .sub{ display:none; }
    .topbar .pill{ display:none; }
    .grid{ grid-template-columns:1fr; }
    .stat-row{ gap:8px; }
    .stat{ min-width:0; flex:1 1 100px; padding:10px 12px; }
    .stat .v{ font-size:19px; }
    .gauge{ width:180px; height:180px; }
  }
  @media (max-width: 420px){
    .qcard{ padding:16px; }
    .panel{ padding:16px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   SOP EĞİTİM & SINAV SİSTEMİ
   Tek dosyalık uygulama: SOP kütüphanesi + yerleşik soru havuzundan rastgele
   sınav üretimi (API gerektirmez) + online sınav + sonuç kaydı.
   ========================================================================= */

/* Cihazlar arası ORTAK sonuç kaydı için (opsiyonel):
   Bağımsız barındırmada (GitHub Pages vb.) window.storage çalışmadığından
   sonuçlar varsayılan olarak yalnızca o cihazda (localStorage) tutulur.
   Farklı telefonlardaki sonuçları TEK bir yerde toplamak isterseniz, aşağıya
   bir Google Apps Script Web App URL'si yapıştırın - tüm cihazlar sonucu
   otomatik olarak o Google E-Tablo'ya da gönderir. Boş bırakılırsa bu adım
   sessizce atlanır. (Kurulum talimatı sohbette paylaşıldı.) */
const CONFIG = {
  sheetsWebhookUrl: 'https://script.google.com/macros/s/AKfycbzqPm1B8ey8Nd87Pf21WLBw9MoKYIK7TxuPMWVwe4nk44Go1NTAtiZ_AgCa52nMo-I8Ew/exec',
  // Yönetici şifresi - yalnızca istemci tarafı bir engel (gerçek güvenlik değil, bkz. sohbet).
  // Google Apps Script'teki ADMIN_PASSWORD sabitiyle AYNI olmalı (sunucu tarafı gerçek kontrol orada).
  adminPassword: 'KorozoSOP2026!',
};

function syncDeleteToSheets(id){
  if(!CONFIG.sheetsWebhookUrl) return;
  try{
    fetch(CONFIG.sheetsWebhookUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'delete', id, password: CONFIG.adminPassword }),
    }).catch(()=>{});
  }catch(e){}
}

function syncResultToSheets(result){
  if(!CONFIG.sheetsWebhookUrl) return;
  try{
    fetch(CONFIG.sheetsWebhookUrl, {
      method: 'POST',
      mode: 'no-cors', // Apps Script web app için gerekli; yanıt okunamaz ama gönderim çalışır
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(result),
    }).catch(()=>{ /* sessiz geç - yerel kayıt zaten yapıldı */ });
  }catch(e){ /* sessiz geç */ }
}

function jsonpRequest(url, timeoutMs){
  return new Promise((resolve, reject) => {
    const cbName = '__sopSinavCb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    const script = document.createElement('script');
    let done = false;
    const cleanup = () => { try{ delete window[cbName]; }catch(e){} if(script.parentNode) script.parentNode.removeChild(script); };
    const timer = setTimeout(() => { if(done) return; done=true; cleanup(); reject(new Error('timeout')); }, timeoutMs || 10000);
    window[cbName] = (data) => { if(done) return; done=true; clearTimeout(timer); cleanup(); resolve(data); };
    script.src = url + (url.indexOf('?')>=0 ? '&' : '?') + 'callback=' + cbName;
    script.onerror = () => { if(done) return; done=true; clearTimeout(timer); cleanup(); reject(new Error('script load error')); };
    document.head.appendChild(script);
  });
}

async function fetchCloudResults(){
  if(!CONFIG.sheetsWebhookUrl) return null;
  try{
    // JSONP kullanılır: Apps Script Web App'lerin GET yanıtları cross-origin fetch()
    // ile her zaman güvenilir okunamıyor (CORS); <script> ile yükleme bu sınırı aşar.
    const data = await jsonpRequest(CONFIG.sheetsWebhookUrl, 10000);
    if(!Array.isArray(data)) return null;
    return data.map(r => ({
      id: r.id || ('cloud-'+r.name+'-'+r.submittedAt),
      sopId: r.sopId || '',
      sopTitle: r.sopTitle || '',
      name: r.name || '',
      dept: r.dept || '',
      score: Number(r.score)||0,
      total: Number(r.total)||0,
      pct: Number(r.pct)||0,
      submittedAt: typeof r.submittedAt === 'number' ? r.submittedAt : Date.parse(r.submittedAt) || Date.now(),
    }));
  }catch(e){ return null; }
}

const ICONS = {
  library: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
  generate: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.9 2.9M16.2 16.2l2.9 2.9M2 12h4M18 12h4M4.9 19.1l2.9-2.9M16.2 7.8l2.9-2.9"/><circle cx="12" cy="12" r="3"/></svg>`,
  take: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`,
  results: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`,
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>`,

/* ---------------- Storage helpers ----------------
   claude.ai artifact ortamında window.storage kullanılır (ortak/paylaşılan).
   Bağımsız barındırmada (GitHub Pages vb.) window.storage yoktur; bu durumda
   localStorage'a otomatik düşülür. NOT: localStorage yalnızca o cihaz/tarayıcıya
   özeldir - farklı telefonlar birbirinin verisini göremez. Cihazlar arası ortak
   sonuç takibi için Google Sheets webhook desteği aşağıda ayrıca eklenmiştir. */
const HAS_ARTIFACT_STORAGE = (typeof window.storage !== 'undefined');

async function storGet(key){
  try{
    if(HAS_ARTIFACT_STORAGE){
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : null;
    }else{
      const v = localStorage.getItem('sop-sinav:'+key);
      return v ? JSON.parse(v) : null;
    }
  }catch(e){ return null; }
}
async function storSet(key, val){
  try{
    if(HAS_ARTIFACT_STORAGE){
      await window.storage.set(key, JSON.stringify(val), true);
    }else{
      localStorage.setItem('sop-sinav:'+key, JSON.stringify(val));
    }
    return true;
  }catch(e){ return false; }
}
function uid(n){ n = n || 10; const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }

    // Daha önce kaydedilmiş bir kütüphane varsa, kullanıcının eklediği özel SOP'lar
    // korunur; SOP_SEED'e sonradan eklenen yeni yerleşik SOP'lar da (id eşleşmesiyle)
    // otomatik olarak eklenir - böylece güncellemeler her cihazda görünür.
    const existingIds = new Set(sops.map(s=>s.id));
    const newOnes = SOP_SEED.filter(s=>!existingIds.has(s.id));
    if(newOnes.length){
      sops = sops.concat(newOnes);
      await storSet('sop-library', sops);
    }
  }
  let exams = await storGet('exams'); if(!exams) exams = []; // legacy, kullanılmıyor
  let results = await storGet('results'); if(!results) results = [];

  let personnel = await storGet('personnel');
  if(!personnel || !personnel.length){
    personnel = PERSONNEL_SEED;
    await storSet('personnel', personnel);
  }else{
    const existingPIds = new Set(personnel.map(p=>p.id));
    const newP = PERSONNEL_SEED.filter(p=>!existingPIds.has(p.id));
    if(newP.length){ personnel = personnel.concat(newP); await storSet('personnel', personnel); }
  }
  let sopAssignments = await storGet('sop-assignments'); if(!sopAssignments) sopAssignments = {};
  // Atama şablonu (departman bazlı) versiyonlanır: önceki bir sürümden düşükse, buradaki
  // doğru eşleştirme mevcut atamaların üzerine yazılır. Bu, admin'in bu noktadan SONRA
  // elle yapacağı değişiklikleri etkilemez - yalnızca geçmiş hatalı/varsayılan atamaları düzeltir.
  let seedVersion = await storGet('assignment-seed-version'); if(!seedVersion) seedVersion = 0;
  if(seedVersion < ASSIGNMENT_SEED_VERSION){
    Object.entries(SOP_ASSIGNMENT_SEED).forEach(([sopId, seedAssign]) => {
      sopAssignments[sopId] = seedAssign;
    });
    await storSet('sop-assignments', sopAssignments);
    await storSet('assignment-seed-version', ASSIGNMENT_SEED_VERSION);
  }

  state.sops = sops; state.exams = exams; state.results = results;
  state.personnel = personnel; state.sopAssignments = sopAssignments;
  state.loading = false; state.loaded = true;
  render();
}

/* ---------------- Local question generation (API gerektirmez) ---------------- */
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function pickExamQuestions(sop){
  const bank = QUESTION_BANKS[sop.id];
  if(!bank || bank.length < 5){
    throw new Error('Bu SOP için henüz soru havuzu hazırlanmadı. Sorularınızı ileterek eklememi isteyebilirsiniz.');
  }
  const chosen = shuffleArr(bank).slice(0, Math.min(10, bank.length));
  return chosen.map(item => {
    const optOrder = shuffleArr(item.o.map((text, idx) => ({text, idx})));
    const newCorrect = optOrder.findIndex(o => o.idx === item.c);
    return {
      question: item.q,
      options: optOrder.map(o => o.text),
      correctIndex: newCorrect,
    };
  });
}

        </div>
        <button class="btn primary block" data-begin-quiz>Sınavı Başlat</button>
      </div>
    `;
  }

  if(state.takeStage === 'quiz'){
    const sop = state.sops.find(s=>s.id===state.takeSopId);
    const qs = state.currentQuizQuestions;
    const q = qs[state.currentQ];
    const total = qs.length;
    const answered = state.answers[state.currentQ];
    return `
      <div class="exam-wrap">
        <div class="qcounter">SORU ${state.currentQ+1} / ${total} &middot; ${escapeHtml(sop.title)}</div>
        <div class="progressbar"><div class="fill" style="width:${((state.currentQ)/total)*100}%"></div></div>
        <div class="qcard">
          <div class="qtext">${escapeHtml(q.question)}</div>
          ${q.options.map((opt, i) => `
            <div class="opt ${answered===i?'selected':''}" data-select-opt="${i}">
              <div class="dot"></div><div>${escapeHtml(opt)}</div>
            </div>
          `).join('')}
        </div>
        <div class="exam-nav">
          <button class="btn ghost" data-prev-q ${state.currentQ===0?'disabled':''}>Önceki</button>
          ${state.currentQ < total-1
            ? `<button class="btn primary" data-next-q ${answered===undefined?'disabled':''}>Sonraki Soru</button>`
            : `<button class="btn primary" data-finish-quiz ${answered===undefined?'disabled':''}>Sınavı Bitir</button>`}
        </div>
      </div>
    `;
  }

  if(state.takeStage === 'done'){
    const r = state.lastResult;
    const pct = r.pct;
    const needleDeg = -135 + (pct/100)*270;
    const r1 = 270*0.70, r2 = 270*0.85;
    return `
      <div class="exam-wrap" style="text-align:center;">
        <div class="panel">
          <div class="panel-title">Sınav Tamamlandı</div>

              <div class="needle" style="transform:translate(-50%,-100%) rotate(${needleDeg}deg);"></div>
              <div class="hub"></div>
              <div class="inner">
                <div class="pct">%${pct}</div>
                <div class="lbl">${r.score}/${r.total} DOĞRU</div>
              </div>
            </div>
            <div class="verdict ${pct>=70?'pass':'fail'}">${pct>=70?'BAŞARILI':'BAŞARISIZ'}</div>

            <button class="btn primary" data-back-take-list>SOP Listesine Dön</button>
          </div>
        </div>
      </div>
    `;
  }
  return '';
}

          <label class="field-label">Sorumlu Personel (${state.assignSelectedIds.size} seçili)</label>
          <div style="display:flex; flex-direction:column; gap:7px; max-height:260px; overflow-y:auto; border:1px solid var(--line-soft); border-radius:8px; padding:10px;">

                ${escapeHtml(p.name)} <span style="color:var(--text-2);">— ${escapeHtml(p.title)}</span>
              </label>
            `).join('')}
          </div>
        </div>

    </div>

    ${Object.entries(state.sopAssignments).some(([,a])=>a.personnelIds&&a.personnelIds.length) ? `
      <div class="panel-title" style="margin-bottom:12px;">Mevcut Atamalar</div>
      <div class="grid">
        ${Object.entries(state.sopAssignments).filter(([,a])=>a.personnelIds&&a.personnelIds.length).map(([sopId, a]) => {
          const sop = state.sops.find(s=>s.id===sopId);
          if(!sop) return '';
          return `
          <div class="card tag-amber">
            <h3>${escapeHtml(sop.title)}</h3>
            <div class="meta"><span>${a.personnelIds.length} kişi</span><span>Son tarih: ${a.deadline?new Date(a.deadline).toLocaleDateString('tr-TR'):'—'}</span></div>
            <button class="btn sm ghost" data-view-compliance="${sopId}">Uyumu Gör</button>
          </div>`;
        }).join('')}
      </div>
    ` : ''}
  `;
}

function normalizeName(s){ return (s||'').trim().toLowerCase().replace(/\s+/g,' '); }

function getComplianceRows(){
  const rows = [];
  Object.entries(state.sopAssignments).forEach(([sopId, assign]) => {
    if(!assign || !assign.personnelIds || !assign.personnelIds.length) return;
    const sop = state.sops.find(s=>s.id===sopId);
    if(!sop) return;
    const deadlineTs = assign.deadline ? new Date(assign.deadline+'T23:59:59').getTime() : null;
    assign.personnelIds.forEach(pid => {
      const person = state.personnel.find(p=>p.id===pid);
      if(!person) return;
      const attempts = state.results.filter(r=>r.sopId===sopId && normalizeName(r.name)===normalizeName(person.name));
      attempts.sort((a,b)=>a.submittedAt-b.submittedAt);
      const first = attempts[0];
      let status, deviationDays;
      if(first){
        if(deadlineTs!=null){
          const diffDays = Math.round((deadlineTs - first.submittedAt)/86400000);
          status = diffDays >= 0 ? 'zamaninda' : 'gec';
          deviationDays = diffDays;
        }else{ status = 'tamamlandi'; deviationDays = null; }
      }else{
        if(deadlineTs!=null && Date.now() > deadlineTs){
          status = 'gecikti'; deviationDays = -Math.round((Date.now()-deadlineTs)/86400000);
        }else{ status = 'bekliyor'; deviationDays = null; }
      }
      rows.push({
        sopId, sopTitle: sop.title, personId: pid, personName: person.name, dept: person.dept,
        deadline: assign.deadline, completedAt: first?first.submittedAt:null,
        pct: first?first.pct:null, status, deviationDays
      });
    });
  });
  return rows;
}

function renderCompliance(){
  const rows = getComplianceRows();
  const filtered = state.complianceFilter==='all' ? rows : rows.filter(r=>r.sopId===state.complianceFilter);

  const completed = filtered.filter(r=>r.status!=='bekliyor').length;
  const lateOrOverdue = filtered.filter(r=>r.status==='gec'||r.status==='gecikti').length;
  const pending = filtered.filter(r=>r.status==='bekliyor').length;

  const statusMeta = {
    zamaninda: {label:'Zamanında Tamamladı', color:'var(--green)'},
    gec: {label:'Geç Tamamladı', color:'var(--red)'},
    tamamlandi: {label:'Tamamlandı', color:'var(--green)'},
    gecikti: {label:'Gecikmede', color:'var(--red)'},
    bekliyor: {label:'Bekliyor', color:'var(--text-2)'},
  };
  const maxDays = Math.max(1, ...filtered.map(r=>Math.abs(r.deviationDays||0)), 1);

  return `
    <div class="stat-row">
      <div class="stat"><div class="v">${filtered.length}</div><div class="k">Toplam Atama</div></div>
      <div class="stat"><div class="v" style="color:var(--green);">${completed}</div><div class="k">Tamamlayan</div></div>
      <div class="stat"><div class="v" style="color:var(--red);">${lateOrOverdue}</div><div class="k">Geç / Gecikmede</div></div>
      <div class="stat"><div class="v" style="color:var(--text-2);">${pending}</div><div class="k">Bekliyor</div></div>
    </div>

    <div style="margin-bottom:16px;">
      <select id="compliance-filter" style="max-width:320px;">
        <option value="all" ${state.complianceFilter==='all'?'selected':''}>Tüm SOP'lar</option>
        ${state.sops.filter(s=>state.sopAssignments[s.id]&&state.sopAssignments[s.id].personnelIds&&state.sopAssignments[s.id].personnelIds.length).map(s=>`<option value="${s.id}" ${state.complianceFilter===s.id?'selected':''}>${escapeHtml(s.title)}</option>`).join('')}
      </select>
    </div>

    ${filtered.length===0 ? `<div class="empty">${ICONS.target}<div class="t">Henüz atama yok</div>"Personel" sekmesinden bir SOP'a personel atayarak başlayın.</div>` : `
    <div class="panel" style="padding:18px;">
      <div style="display:flex; flex-direction:column; gap:14px;">
        ${filtered.slice().sort((a,b)=>(a.deviationDays==null?999:a.deviationDays)-(b.deviationDays==null?999:b.deviationDays)).map(r => {
          const meta = statusMeta[r.status];
          const barPct = r.deviationDays==null ? 0 : Math.min(100, Math.abs(r.deviationDays)/maxDays*100);
          return `
          <div>
            <div style="display:flex; justify-content:space-between; gap:10px; font-size:12px; margin-bottom:4px;">
              <span><b>${escapeHtml(r.personName)}</b> <span style="color:var(--text-2);">— ${escapeHtml(r.sopTitle)}</span></span>
              <span style="color:${meta.color}; font-weight:600; white-space:nowrap;">${meta.label}${r.deviationDays!=null?` (${r.deviationDays>=0?'+':''}${r.deviationDays} gün)`:''}</span>
            </div>
            <div style="height:8px; background:var(--bg-0); border-radius:100px; overflow:hidden; border:1px solid var(--line-soft);">
              <div style="height:100%; width:${barPct}%; background:${meta.color}; border-radius:100px;"></div>
            </div>
            <div style="font-size:10.5px; color:var(--text-2); margin-top:3px;">
              Son tarih: ${r.deadline?new Date(r.deadline).toLocaleDateString('tr-TR'):'—'}
              ${r.completedAt?` &middot; Tamamlama: ${new Date(r.completedAt).toLocaleDateString('tr-TR')} (%${r.pct})`:''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`}
  `;
}

/* ---------------- utils ---------------- */
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

async function autoSyncCloudResults(){
  state.cloudSyncing = true; render();
  const cloud = await fetchCloudResults();
  state.cloudSyncing = false;
  if(cloud !== null){
    const localIds = new Set(state.results.map(r=>r.id));
    let added = 0;
    cloud.forEach(r => { if(!localIds.has(r.id)){ state.results.push(r); added++; } });
    if(added>0){
      state.results.sort((a,b)=>a.submittedAt-b.submittedAt);
      await storSet('results', state.results);
    }
  }
  render();
  return cloud;
}

/* ---------------- Events ---------------- */
function bindEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = () => {
      state.view = el.getAttribute('data-nav'); state.openSopId=null; render();
      if(state.view==='results' && CONFIG.sheetsWebhookUrl && !state.cloudSyncing){
        autoSyncCloudResults();
      }
    };
  });

  // library
  const toggleAdd = document.querySelector('[data-toggle-add]');
  if(toggleAdd) toggleAdd.onclick = () => { state.showAddForm = !state.showAddForm; render(); };
  const cancelAdd = document.querySelector('[data-cancel-add]');
  if(cancelAdd) cancelAdd.onclick = () => { state.showAddForm=false; render(); };
  const saveSop = document.querySelector('[data-save-sop]');
  if(saveSop) saveSop.onclick = async () => {
    const title = document.getElementById('new-sop-title').value.trim();
    const cat = document.getElementById('new-sop-cat').value.trim();
    const content = document.getElementById('new-sop-content').value.trim();
    if(!title || !content){ showToast('Başlık ve içerik zorunlu.', 'err'); return; }
    const sop = { id: 'sop-'+uid(8), title, category: cat||'Genel', content };
    state.sops.push(sop);
    await storSet('sop-library', state.sops);
    state.showAddForm=false; state.newSop={title:'',category:'',content:''};
    showToast('SOP eklendi.');
  };
  document.querySelectorAll('[data-open-sop]').forEach(el=>{
    el.onclick = () => { state.openSopId = el.getAttribute('data-open-sop'); render(); };
  });
  const backLib = document.querySelector('[data-back-library]');
  if(backLib) backLib.onclick = () => { state.openSopId=null; render(); };
  document.querySelectorAll('[data-goto-generate]').forEach(el=>{
    el.onclick = () => { state.genSopId = el.getAttribute('data-goto-generate'); state.view='generate'; state.openSopId=null; render(); };
  });

  // generate (admin önizleme - doğrudan take akışına yönlendirir)
  const genSelect = document.getElementById('gen-sop-select');
  if(genSelect) genSelect.onchange = (e) => { state.genSopId = e.target.value || null; render(); };
  const genStart = document.querySelector('[data-gen-start]');
  if(genStart) genStart.onclick = () => {
    const sop = state.sops.find(s=>s.id===state.genSopId);
    if(!sop) return;
    if(!QUESTION_BANKS[sop.id] || QUESTION_BANKS[sop.id].length < 5){
      state.genError = 'Bu SOP için henüz soru havuzu hazırlanmadı.'; render(); return;
    }
    state.takeSopId = sop.id; state.takerName=''; state.takerDept='';
    state.view='take'; state.takeStage='name';
    render();
  };

  // take flow
  document.querySelectorAll('[data-start-exam]').forEach(el=>{
    el.onclick = () => {
      state.takeSopId = el.getAttribute('data-start-exam');
      state.takerName=''; state.takerDept='';
      state.takeStage='name'; render();
    };
  });
  const backTakeList = document.querySelector('[data-back-take-list]');
  if(backTakeList) backTakeList.onclick = () => {
    state.takeStage='list'; state.takeSopId=null; state.answers=[]; state.currentQ=0; state.takerName=''; state.takerDept=''; state.currentQuizQuestions=[];
    render();
  };
  const beginQuiz = document.querySelector('[data-begin-quiz]');
  if(beginQuiz) beginQuiz.onclick = () => {
    const name = document.getElementById('taker-name').value.trim();
    const dept = document.getElementById('taker-dept').value.trim();
    if(!name){ showToast('Lütfen ad soyad girin.', 'err'); return; }
    const sop = state.sops.find(s=>s.id===state.takeSopId);
    let questions;
    try{ questions = pickExamQuestions(sop); }
    catch(err){ showToast(err.message, 'err'); return; }
    state.takerName = name; state.takerDept = dept;
    state.currentQuizQuestions = questions;
    state.answers = []; state.currentQ = 0;
    state.takeStage='quiz'; render();
  };
  document.querySelectorAll('[data-select-opt]').forEach(el=>{
    el.onclick = () => {
      state.answers[state.currentQ] = parseInt(el.getAttribute('data-select-opt'),10);
      render();
    };
  });
  const prevQ = document.querySelector('[data-prev-q]');
  if(prevQ) prevQ.onclick = () => { if(state.currentQ>0){ state.currentQ--; render(); } };
  const nextQ = document.querySelector('[data-next-q]');
  if(nextQ) nextQ.onclick = () => { state.currentQ++; render(); };
  const finishQuiz = document.querySelector('[data-finish-quiz]');
  if(finishQuiz) finishQuiz.onclick = async () => {
    const sop = state.sops.find(s=>s.id===state.takeSopId);
    const qs = state.currentQuizQuestions;
    let score = 0;
    qs.forEach((q,i)=>{ if(state.answers[i]===q.correctIndex) score++; });
    const total = qs.length;
    const pct = Math.round((score/total)*100);
    const result = {
      id:'res-'+uid(10), sopId: sop.id, sopTitle: sop.title,
      name: state.takerName, dept: state.takerDept,
      score, total, pct, answers: state.answers.slice(),
      submittedAt: Date.now()
    };
    state.results.push(result);
    await storSet('results', state.results);
    syncResultToSheets(result); // yapılandırılmışsa Google E-Tablo'ya da gönderir (fire-and-forget)
    state.lastResult = result;
    state.takeStage='done';
    render();
  };

  // results
  const resFilter = document.getElementById('results-filter');
  if(resFilter) resFilter.onchange = (e) => { state.resultsFilter = e.target.value; render(); };
  const refreshCloud = document.querySelector('[data-refresh-cloud]');
  if(refreshCloud) refreshCloud.onclick = async () => {
    const before = state.results.length;
    const cloud = await autoSyncCloudResults();
    if(cloud === null){
      showToast('Bulut sonuçları alınamadı. Google E-Tablo\'yu doğrudan açabilirsiniz.', 'err');
    }else{
      const added = state.results.length - before;
      showToast(added>0 ? `${added} yeni sonuç eklendi.` : 'Yeni sonuç yok, liste güncel.');
    }
  };
  const exportCsv = document.querySelector('[data-export-csv]');
  if(exportCsv) exportCsv.onclick = () => {
    const filtered = state.resultsFilter==='all' ? state.results : state.results.filter(r=>r.sopId===state.resultsFilter);
    let csv = 'Ad Soyad,Departman,SOP,Skor,Yuzde,Tarih\n';
    filtered.forEach(r=>{
      csv += `"${(r.name||'').replace(/"/g,'""')}","${(r.dept||'').replace(/"/g,'""')}","${r.sopTitle.replace(/"/g,'""')}",${r.score}/${r.total},${r.pct}%,"${new Date(r.submittedAt).toLocaleString('tr-TR')}"\n`;
    });
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'sop-sinav-sonuclari.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  // admin: giriş/çıkış
  const adminLoginOpen = document.querySelector('[data-admin-login-open]');
  if(adminLoginOpen) adminLoginOpen.onclick = (e) => { e.preventDefault(); state.showAdminLogin=true; state.adminLoginError=null; render(); };
  const adminLoginCancel = document.querySelector('[data-admin-login-cancel]');
  if(adminLoginCancel) adminLoginCancel.onclick = () => { state.showAdminLogin=false; render(); };
  const adminModalBackdrop = document.querySelector('[data-admin-modal-backdrop]');
  if(adminModalBackdrop) adminModalBackdrop.onclick = () => { state.showAdminLogin=false; render(); };
  const adminLoginSubmit = document.querySelector('[data-admin-login-submit]');
  const doAdminLogin = () => {
    const pw = document.getElementById('admin-password-input').value;
    if(pw === CONFIG.adminPassword){
      state.isAdmin = true; state.showAdminLogin=false; state.adminLoginError=null;
      try{ sessionStorage.setItem('sop-sinav-admin','1'); }catch(e){}
      showToast('Yönetici girişi yapıldı.');
    }else{
      state.adminLoginError = 'Şifre yanlış.';
    }
    render();
  };
  if(adminLoginSubmit) adminLoginSubmit.onclick = doAdminLogin;
  const adminPwInput = document.getElementById('admin-password-input');
  if(adminPwInput) adminPwInput.onkeydown = (e) => { if(e.key==='Enter') doAdminLogin(); };
  const adminLogout = document.querySelector('[data-admin-logout]');
  if(adminLogout) adminLogout.onclick = (e) => {
    e.preventDefault();
    state.isAdmin = false;
    try{ sessionStorage.removeItem('sop-sinav-admin'); }catch(err){}
    render();
  };

  // admin: sonuç silme
  document.querySelectorAll('[data-delete-result]').forEach(el=>{
    el.onclick = async () => {
      const id = el.getAttribute('data-delete-result');
      const r = state.results.find(x=>x.id===id);
      if(!r) return;
      if(!confirm(`${r.name} - ${r.sopTitle} sonucunu silmek istediğinize emin misiniz?`)) return;
      state.results = state.results.filter(x=>x.id!==id);
      await storSet('results', state.results);
      syncDeleteToSheets(id);
      showToast('Sonuç silindi.');
      render();
    };
  });

  // personnel
  const toggleAddP = document.querySelector('[data-toggle-add-personnel]');
  if(toggleAddP) toggleAddP.onclick = () => { state.showAddPersonnel = !state.showAddPersonnel; render(); };
  const cancelAddP = document.querySelector('[data-cancel-add-personnel]');
  if(cancelAddP) cancelAddP.onclick = () => { state.showAddPersonnel=false; render(); };
  const savePersonnel = document.querySelector('[data-save-personnel]');
  if(savePersonnel) savePersonnel.onclick = async () => {
    const id = document.getElementById('new-p-id').value.trim();
    const name = document.getElementById('new-p-name').value.trim();
    const dept = document.getElementById('new-p-dept').value.trim();
    const title = document.getElementById('new-p-title').value.trim();
    if(!id || !name){ showToast('Sicil no ve ad soyad zorunlu.', 'err'); return; }
    if(state.personnel.some(p=>p.id===id)){ showToast('Bu sicil no zaten kayıtlı.', 'err'); return; }
    state.personnel.push({id, name, dept, title});
    await storSet('personnel', state.personnel);
    state.showAddPersonnel=false; state.newPersonnel={id:'',name:'',dept:'',title:''};
    showToast('Personel eklendi.');
    render();
  };
  document.querySelectorAll('[data-delete-personnel]').forEach(el=>{
    el.onclick = async () => {
      const id = el.getAttribute('data-delete-personnel');
      const p = state.personnel.find(x=>x.id===id);
      if(!p) return;
      if(!confirm(`${p.name} personelini silmek istediğinize emin misiniz?`)) return;
      state.personnel = state.personnel.filter(x=>x.id!==id);
      await storSet('personnel', state.personnel);
      // atamalardan da temizle
      Object.values(state.sopAssignments).forEach(a=>{ if(a.personnelIds) a.personnelIds = a.personnelIds.filter(pid=>pid!==id); });
      await storSet('sop-assignments', state.sopAssignments);
      showToast('Personel silindi.');
      render();
    };
  });

  // SOP ataması
  const assignSopSelect = document.getElementById('assign-sop-select');
  if(assignSopSelect) assignSopSelect.onchange = (e) => {
    const sopId = e.target.value || null;
    state.assignSopId = sopId;
    const existing = sopId ? state.sopAssignments[sopId] : null;
    state.assignDeadlineDraft = existing && existing.deadline ? existing.deadline : '';
    state.assignSelectedIds = new Set(existing && existing.personnelIds ? existing.personnelIds : []);
    render();
  };
  const assignDeadlineInput = document.getElementById('assign-deadline-input');
  if(assignDeadlineInput) assignDeadlineInput.onchange = (e) => { state.assignDeadlineDraft = e.target.value; };
  document.querySelectorAll('[data-assign-check]').forEach(el=>{
    el.onchange = (e) => {
      const pid = el.getAttribute('data-assign-check');
      if(e.target.checked) state.assignSelectedIds.add(pid); else state.assignSelectedIds.delete(pid);
      render();
    };
  });
  const saveAssignment = document.querySelector('[data-save-assignment]');
  if(saveAssignment) saveAssignment.onclick = async () => {
    if(!state.assignSopId) return;
    const deadlineVal = document.getElementById('assign-deadline-input') ? document.getElementById('assign-deadline-input').value : state.assignDeadlineDraft;
    state.sopAssignments[state.assignSopId] = {
      deadline: deadlineVal || null,
      personnelIds: Array.from(state.assignSelectedIds),
    };
    await storSet('sop-assignments', state.sopAssignments);
    showToast('Atama kaydedildi.');
    render();
  };
  document.querySelectorAll('[data-view-compliance]').forEach(el=>{
    el.onclick = () => {
      state.complianceFilter = el.getAttribute('data-view-compliance');
      state.view = 'compliance'; render();
    };
  });

  // uyum takibi
  const complianceFilter = document.getElementById('compliance-filter');
  if(complianceFilter) complianceFilter.onchange = (e) => { state.complianceFilter = e.target.value; render(); };
}

boot();
</script>
