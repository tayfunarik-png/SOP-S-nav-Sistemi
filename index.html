Adımlar: 1) İlk olarak sol üstte kırmızı ile belirtilmiş sekmeye giriş yapınız. Ekrana gelen klavye ile şifre girişini yapınız. (Şifre ''para4711'') (Dikkat: İşleme başlamadan önce kapının kapalı olduğundan emin olunuz.) 2) Giriş yaptıktan sonra açılan pencerede ''47 Test Kumanda'' bölümüne tıklayınız. 3) MDO Parametre/tahrik tuşuna basınız. Bu tuşa basınca otomatik kalibrasyon yapacaktır. (Dikkat: Secme olanak sayfasında olduğunuzdan emin olunuz.(Fotoğrafta kırmızı çerçeve ile belirtilmiştir.)) 4) Drives, stretching gap 1 to reference point yazan satırda sarı ile belirtilmiş yere tıklayınız açılan pencerede '1' değerini giriniz ardından 'OK' tuşuna basınız. (Dikkat: İşlemin gerçekleştirilmesi için belirli bir süre bekleyiniz.) 5) Kalibrasyon tamamlandıktan sonra servis ekranından çıkış yapılarak makine normal moda alınır ve kısa bir deneme çalıştırması ile GAP değerinin doğru uygulandığı kontrol edilir. (Dikkat: Servis modundan çıkılmadan makineye normal üretim başlatılmamalıdır.)` },

  { id:"EB2SOP3", title:"EXTRUDER SEPET GENİŞLİĞİ KALİBRASYONU TALİMATI", category:"Elektrik Bakım",
    content:`KAPSAM: Extruder sepet genişliği kalibrasyonu talimatını içerir.
Adımlar: 1) Para4711 şifresini girerek servis sayfasını açınız. (Dikkat: Sepet kalibrasyonu için makine duruyor ve balonun olmaması gerekir.) 2) Servis page 47 test control sayfasını açınız. (Dikkat: Sepet kalibrasyonu minimum ( en az ) ve maksimum ( en çok ) değerlerinin doğru konumlarda kalibrasyon ekranında girilmesi,çok önemlidir.) 3) Calibrating cages control seçiniz. 4) "Auswahl nach Testbilder" (test görüntüsü seçimi) Görüntü değişikliğini uygulayın. 37 numaralı test görüntüsünde "Mutlak değer kodlayıcı kafes genişliği YENİ" seçeneğini seçin. 5) Yakma işlemine başlayın. 6) Kafesi tamamen kapatın, minimum kafes genişliğini (mm dfl) / (0,01 inç dfl) girin. 7) "Mutlak değer kodlayıcısını yak" tamamlandığında yakma prosedürü tamamlanır` },

  { id:"EB2SOP4", title:"VİSTAFLEX ROBOT MANUEL KULLANIMI TALİMATI", category:"Elektrik Bakım",
    content:`KAPSAM: Vistaflex robot manuel kullanımı talimatını kapsar.
Adımlar: 1) Robot kol manuel kullanım için makina elektrik panosu icerisinde yer alan resimdeki gibi 3 adet anahtarlı kumanda butonu “OTO” konumundan “MAN “ konumuna çevrilir. (Dikkat: Kaçak varsa dokunulmaktan kaçınılmalı.. Voltajı gelen akım yüksekse temas edilmemeli.. ELEKTRİK PERSONELİ HARİCİ DOKUNMAMALI..) 2) Makina ana elektrik panosu içersinde bulunan manuel kontrol kumanda kolu ve kayış sıkışıklık giderme aparatı alınır. (Dikkat: Aparatla doğru kullanım yapılmalı. Boş sebeplerle kullanılmamalı.) 3) Manuel kontrol kumanda kolu arka veya ön hangi robot kol için kullanılacak ise ona ait kumanda soketine bağlantısı yapılır. (Dikkat: Soket'in çalışır olduğu kontrol edilmeli. Risk varsa o iş risksiz bir şekilde yapılmalı.) 4) Kumanda kolu soket bağlantısından sonra aktif olabilmesi için makina üzerindeki resimde görülen butona basılması gerekir. (Dikkat: Acele edip yanlış butona basılmaması. Tek seferde 1'den fazla tuşa basılması. Herangi bir yanlış basma durumunda acil stop butonuna basılması.) 5) Manuel kontrol kumanda kolu aktif edildikten sonra, acil stop butonu kontrolü yapılarak eğer normal ise robot kol istenilen konuma kumanda kolu üzerindeki joystik buton yardımı ile getirilir ,eğer üzerinde anilox varsa güvenli bir yere getirilerek kumanda kolu üzerindeki kelepçe kontrol butonları anilox bıraktırılır. (Dikkat: Resim ile gösterilen imleç dogru yöne cevrilmeli. Acil durumda stop butonuna basılmalı) 6) Silindir bırakıldıktan sonra ,kayış sıkışıklık kontrolü ilgili aparat kayış üzerine monte edilerek kontrol edilir. (Dikkat: Ekipmansız dokunulmamalı. Kayışın durur pozisyonda olması gerekir..) 7) Eğer kayışta sıkışııklık var ise , resimde görüldügü gibi darbeli olarak sol yöne doğru hamle ile kayış sıkışıklığı giderilir. (Dikkat: Çıplak elle dokunulmamalı..) 8) Kayış sıkışıklığı giderildi ise robot kol hem yatay hemde dikey yönde çaprazlık kontrolü yapılır. (Dikkat: Doğru konumda değilse düzeltilmeli.) 9) Çaprazlık kontrolünde sonra makina kontrol ekranından konum kalibrasyonu için şifre girilir.( Sifre : Wuh ) (Dikkat: Servis parolası çok denenmemeli. Bilmeyen kişi kalibrasyon yapmamalı.) 10) Ön robot kol için "700" veya arka robot kol için "710" nolu robot kol hareket kontrol sayfasına gidilir. (Dikkat: Girilmesi gereken kodun kontrol edilmesi.) 11) Robot kol pozisyonunu otomatik olarak "home"(başlangıç) pozisyonuna getirmek için ,manuel olarak "+"imleci robot kol hareket mavi kılavuz çizgisi üzerinde herhangi bir noktaya ayarlanır. (Dikkat: İşlem yaparken dikkat edilmeli. Ezbere kontrol iş yapılmamalı, yapılıcaksada kontrol ederek uygun adımlarla yapılmalı.) 12) Pozisyon talimatlar doğrultusunda ayarlandiktan sonra ana elektrik panosunda başlangıçta "Man " konuma getirilmiş olan anahtarlı butonlar tekrar eski konumu olan "oto" konuma getirilir ve manuel kontrol kumanda kolu soket yerinden sökülür.Robot kol operatör tarafından başlangıç konumuna yönlendirilir ,robotun kolun hareketi takip edilir. Robot kol sorunsuz bir şekilde başlangıç konumuna geldi ise, operatör tarafından herhangi bir üniteye anilox yüklemesi yaptırılarak test edilir. (Dikkat: Yetkili harici dokunulmamalı. Anahtar unutulmamalı eski haline getirilmeli.) 13) GEREKLİ EL ALETLERİ (Dikkat: GEREKLİ YARDIMCI EKİPMANLAR) 14) (EK SAYFALARDAKİ BÖLÜME AİT NUMARALAR YAZILMALIDIR) (Dikkat: (EK SAYFALARDAKİ BÖLÜME AİT NUMARALAR YAZILMALIDIR)) 15) HAZIRLAYAN (Dikkat: KONTROL EDEN) 16) Mehmet Akif UZUN (BÖLÜM MÜHENDİSİ / ŞEFİ) (Dikkat: (İSGÇ))` },

  { id:"EB3SOP1", title:"BECKHOFF EL5101 MODÜLÜ DEĞİŞTİRME TALİMATI", category:"Elektrik Bakım",
    content:`KAPSAM: Beckhoff EL5101 modülü değiştirme talimatını içerir.
Adımlar: 1) Beckhoff terminali fotoğraftaki şekilde sıralanmıştır arızalı ünitenin terminali değiştirileceği zaman fotoğraf dikkate alınmalıdır. (Dikkat: Kablo etiketleri yanlış olabilir önemli olan modülün sırasıdır. Etiketlerin yanlış olma ihtimali de mutlaka göz önünde bulundurulmalıdır. Hatalı olduğu tespit edilen etiket olduğunda mutlaka yöneticiye bilgi verilip düzeltilmelidir.) 2) Öncelikle en baştaki EtherCAT modülü çıkarılmalıdır. (Dikkat: Diğer modüllerin sökülebilmesi için gereklidir.) 3) Modüllerin her birisi 2 parça halindedir. Panodan sökülürken beraber sökülmelidir.(Bakım kolaylığı açısından 2 katmandan oluşur Elektronik devre kartı ve haberleşme kısmı olarak.) 4) Fotoğrafta sarı ile işaretlenmiş modül üzerindeki turuncu pimler çekilerek pano kanalından çıkarılmalıdır. (Dikkat: Pimi çekerken çok zorlamayınız.) 5) Fotoğrafta belirtilen sıraya göre geri takılmalıdır. (Dikkat: Modüllerin tam olarak kanala oturduğundan ve modüllerin birbirine geçtiğinden emin olunuz.) 6) Pano ile işiniz bittikten sonra pano içerisinde bırakılan veya düşmüş kablo, klips gibi parçaların temizleyin ve kapatınız.` },

  { id:"EB3SOP10", title:"POMPA BAKIM SÜRESİ SIFIRLAMA TALİMATI", category:"Elektrik Bakım",
    content:`KAPSAM: Elpa boya ünitesi pompa bakım süresi sıfırlama işlemlerini içerir.
Adımlar: 1) Makine ekranı üzerindeki adımlar; İlk olarak Maintenance sekmesine giriniz ardından Configuration sekmesine giriniz.(1 ve 2 olarak belirtilmiştir.) (Dikkat: Doğru sekmeye girdiğinizden emin olunuz.) 2) Açılan login penceresinde user ve password girişini yaptıktan sonra OK tuşuna basınız. (Dikkat: Doğru user password girdiğinizden emin olunuz.) 3) Giriş yaptıktan sonra configuration menu açılacak açılan menu üzerinden pumps configuration'a tıklayınız. (Dikkat: Doğru sekmeye girdiğinizden emin olunuz.) 4) Açılan menüde alt tarafta sarıyla işaretlenmiş olan her bir sekmeye sırasıyla girip her bir sekmede pump reset tuşuna basınız. (B1,B1-R,B2,B2-R,B3,B3-R,B4,B4-R) 5) Son olarak yapılan en son yaptığımız resetleme işlemini her bir sekmeye tekrardan girerek yaptığınız işlemi teyit ediniz. (B1,B1-R,B2,B2-R,B3,B3-R,B4,B4-R) (Dikkat: İşlem bittikten sonra çıkış yaptığınızdan emin olunuz.)` },

  { id:"EB3SOP11", title:"SIEMENS SITRANS SIFIR AYARI", category:"Elektrik Bakım",
    content:`KAPSAM: Acil Durumlarda, Bayram Tatillerinde, Makinelerin Kapanışında Bakım ve Teknik operasyonlar Bölümünde Alınması Gerek Önmeleri Kapsar
Adımlar: 1) Coriolis veya Kütlesel debimetrelerde akış yokken bile sensörler doğal titreşim, elektronik sürüklenme, sıcaklık etkisi veya mekanik gerilmeler nedeniyle küçük bir yalancı ölçüm sinyali üretir. Sıfır ayarı ile bu offset(dara) kaldırılır, böylece cihaz “akış=0” durumunu doğru algılar. Bu nedenle periyodik olarak yapılması yanında ölçümdeki hata şüphesi anında da sıfır ayarının yapılması son derece önemlidir. (Dikkat: Özellikle küçük debilerde çok ciddi sapmalara yol açar.) 2) Sıfır ayarı için sistemde bir solvent talebinin olmadığından ve mutlaka akışın durdurulduğundan emin olunması gerekiyor. Bu sebeple debimetre öncesi ve sonrasındaki küresel vanaların kapalı konuma getirilmesi ve sıfır ayarına vanalar kapatıldıktan bir 10 sn sonra başlanması gerekir. (Dikkat: Vanaların tam kapatılması gerekiyor. Aksi halde sızan miktarı da dara kabul edip, o noktadan sonra ölçüm yapacaktır.) 3) Öncelikle cihaz ekran altındaki 6 tuştan sağ üsttekine basılarak Massflow ekranından Zero Adjust ekranına gelinir 4) Daha sonra sağ alttaki butona basılarak Zero Adjust ayarı başlatılır ve yüzdesel olarak sürecin ilerlediği görülür. 5) İşlem tamamlanınca ekranda "fihished" ifadesi görülecek ve ayarlama sonlanacaktır. 6) Bunun akabinde üst orta tuşa basarak tekrar Massflow ekranına gelinir ve daha önce kapatılmış 2 vana açılır. 7) HAZIRLAYAN (Dikkat: KONTROL EDEN) 8) Mustafa CEYLAN (BÖLÜM MÜHENDİSİ / ŞEFİ) (Dikkat: (İSGÇ))` },

  { id:"EB3SOP12", title:"TAKOMETRE KULLANIM SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Bu prosedürün amacı, dönen motor, mil, fan ve benzeri ekipmanların devir sayısını RPM (dev/dk) cinsinden güvenli ve doğru şekilde ölçmek.
Adımlar: 1) Ölçülecek makinenin ve dönen parçanın güvenli durumda olduğunu kontrol edin. (Dikkat: Ölçüm sırasında dönen parçalara elinizi ve kıyafetinizi yaklaştırmayın.) 2) Makine duruyorken mil veya dönen yüzeyin temiz bir bölümüne küçük bir parça reflektif bant yapıştırın. (Dikkat: Reflektif bandı makine çalışırken yapıştırmayın.) 3) Makineyi çalıştırın ve güvenli mesafeye geçin.Takometreyi açarak ölçüm birimini RPM konumuna getirin. (Dikkat: Lazer ışığını göze doğrultmayın. Koruyucu muhafazaları ölçüm için sökmeyin.) 4) Lazer ışığını reflektif bandın üzerine doğrultun.Ölçüm düğmesine basılı tutun. (Dikkat: Temaslı ölçümde gevşek kıyafet, kolye, saat veya bileklik kullanmayın.) 5) Ekrandaki değer sabitlendiğinde motor devrini okuyun ve kaydedin. 6) Ölçüm tamamlandıktan sonra cihazı kapatın ve çantasına yerleştirin. 7) Temaslı Takometre Kullanımı Cihaza uygun temas ucunu takın. Takometreyi Contact RPM ölçüm moduna alın. Temas ucunu dönen milin merkezine dikkatlice yaklaştırın. Cihazı mil üzerine aşırı kuvvet uygulamadan sabit tutun. Ekrandaki değer sabitlendiğinde ölçümü kaydedin. Ölçüm sonrasında cihazı dönen parçadan yavaşça uzaklaştırın.` },

  { id:"EB3SOP13", title:"LEHİM MAKİNASI KULLANIMI SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Bu prosedürün amacı, güvenli bir şekilde lehim makinası kullanılmasını sağlamaktır.
Adımlar: 1) Cihazı Hazırlama Havya istasyonunu aç Sıcaklığı ayarla (≈ 320–350°C) Ucu temizle (sünger/tel ile) Uca ince lehim sür (kalaylama / tinning) (Dikkat: Havalandırma veya duman emici (fume extractor) kullan Koruyucu gözlük tak Yanıcı maddeleri uzaklaştır Lehim ucu çok sıcak (300–400°C) → temas etme İş bitince cihazı kapatmayı unutma) 2) Lehimleme İşlemi Havya ucunu pad + bacak üzerine değdir 1–2 sn ısıt Lehim telini temas noktasına ver (ucu değil, parçayı erit) Yeterli lehim gelince çek Havya ucunu kaldır Doğru lehim: parlak, konik ve düzgün yüzeyli 3) Hatalı Lehim Örnekleri Soğuk lehim (mat, çatlak) Fazla lehim (topaklanma) Lehim köprüsü (kısa devre) 4) Kontrol ve Temizlik Görsel kontrol (büyüteç ile) Kısa devre var mı kontrol et Flux kalıntılarını temizle (IPA alkol) 5) İşlem tamamlandıktan sonra havya istasyonunu kapatın, ucu soğumaya bırakın ve cihazı standına yerleştirin. (Dikkat: Sıcak uç ile herhangi bir yüzeye veya kabloya temas ettirilmemelidir.)` },

  { id:"EB3SOP14", title:"3 FAZLI MOTOR DÖNÜŞ YÖNÜ DEĞİŞTİRME SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Bu prosedürün amacı, Üç fazlı motorun dönüş yönünü güvenli şekilde değiştirmek.
Adımlar: 1) Motoru durdurun. Motorun bağlı olduğu ana şalteri kapatın. (Dikkat: Enerji kesilmeden bağlantılara müdahale edilmemelidir.) 2) Enerjiyi kilitleyin ve “Çalışma Var” etiketi asın. Gerilim kontrol cihazıyla enerji olmadığını doğrulayın. (Dikkat: Motor tamamen durmadan işlem yapılmamalıdır.) 3) Motor klemens kutusunu veya besleme bağlantı noktasını açın. Üç faz kablosundan herhangi iki fazın yerini değiştirin. Örnek: L1 ile L2’yi değiştirin. (Dikkat: Topraklama bağlantısı değiştirilmemelidir. Yıldız-üçgen köprü bağlantılarına müdahale edilmemelidir.) 4) Bağlantı vidalarını sıkın ve gevşek bağlantı bırakmayın. Klemens kutusu kapağını kapatın. (Dikkat: Deneme sırasında dönen parçalardan uzak durulmalıdır.) 5) Çalışma alanını kontrol ederek kilit ve etiketi kaldırın. Enerjiyi verin ve motoru kısa süreli çalıştırın. Dönüş yönünü kontrol edin. Dönüş yönü doğruysa motoru normal çalışmaya alın. 6) Motoru birkaç dakika çalıştırarak titreşim, ısınma ve anormal ses olup olmadığını kontrol edin, yapılan işlemi kayıt altına alın. (Dikkat: Anormal durum tespit edilirse motor derhal durdurulup ilgili amire bilgi verilmelidir.)` },

  { id:"EB3SOP15", title:"MULTİMETRE KULLANIMI SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Bu prosedürün amacı, güvenli bir şekilde multimetre kullanılmasını sağlamaktır.
Adımlar: 1) Güvenlik Önlemleri Ölçüm öncesi cihazın sağlamlığını kontrol et Prob kablolarında çatlak/kırık olmamalı Ölçüm aralığını doğru seç (yanlış kademe cihazı yakabilir) Enerjili devrelerde dikkatli çalış 2) Multimetreyi Tanıma COM → Siyah prob (ortak uç) V/Ω → Voltaj, direnç ölçümü mA/A → Akım ölçümü Döner anahtar → Ölçüm türü seçimi 3) Voltaj Ölçümü (AC/DC) Siyah prob → COM Kırmızı prob → V girişine Kademe → V (AC veya DC seç) Probları paralel bağla (yük üzerine) Değeri ekrandan oku 4) Akım Ölçümü Kırmızı probu mA/A girişine tak Devreyi aç ve multimetreyi seri bağla Kademe → A veya mA seç Ölçümü yap (Dikkat: Paralel bağlarsan kısa devre yaparsın!) 5) Direnç (Ohm) Ölçümü Devre enerjisiz olmalı Kademe → Ω Probları elemanın uçlarına değdir Değeri oku 6) Süreklilik (Buzzer) Testi Kademe → 🔔 (buzzer) Ses varsa → bağlantı var Ses yoksa → kopukluk var 7) Ölçüm tamamlandıktan sonra döner anahtarı OFF veya en yüksek voltaj kademesine alın, probları çıkarın ve cihazı kapatın. (Dikkat: Cihaz açık/yanlış kademede bırakılırsa bir sonraki kullanımda yanlış ölçüm veya hasar riski oluşur.)` },

  { id:"EB3SOP16", title:"PENS AMPERMETRE KULLANIMI TALİMATI", category:"Elektrik Bakım",
    content:`KAPSAM: Bu prosedürün amacı, pens ampermetre (clamp meter) ile elektrik devrelerinde temassız akım ölçümünün güvenli ve doğru şekilde yapılmasını sağlamaktır.
Adımlar: 1) Ölçüm öncesi pens ampermetrenin gövde ve kablolarında hasar olmadığını kontrol edin. Ölçüm aralığını (AC/DC Akım) doğru seçin. (Dikkat: Hasarlı cihaz ile ölçüm yapılmamalıdır. Uygun KKD (izole eldiven, gözlük) kullanılmalıdır.) 2) Ölçülecek tek bir iletkeni (faz kablosunu) belirleyin. (Dikkat: Birden fazla iletken (örn. 2 veya 3 faz birlikte) pense içine alınırsa ölçüm hatalı olur, kesinlikle yapılmamalıdır.) 3) Pensi açarak sadece ilgili iletkenin çevresine yerleştirin ve pensi tam kapatın. (Dikkat: Pens tam kapanmazsa ölçüm hassasiyeti bozulur.) 4) Ekrandaki akım değerinin sabitlenmesini bekleyip değeri okuyun ve kaydedin. 5) Gerekirse Hold (tutma) fonksiyonunu kullanarak ölçümü sabitleyin. 6) Ölçüm tamamlandıktan sonra pensi iletkenden çıkarın ve cihazı kapatın. (Dikkat: Enerjili devrelerden pensi çıkarırken temas riskine dikkat edin.)` },

  { id:"EB3SOP17", title:"AKÜ DEĞİŞİMİ SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Bu prosedürün amacı, güvenli bir şekilde akü değişimi yapılmasını sağlamaktır.
Adımlar: 1) Önce eksi (-) kutup başını sök Sonra artı (+) kutbu sök Sabitleme aparatlarını çıkar Aküyü dikkatlice kaldır Kritik: İlk eksi sökülmezse kısa devre riski vardır (Dikkat: Makine/araç kapalı olmalı İzole eldiven ve gözlük kullan Kıvılcım riskine dikkat et Ortamı havalandır) 2) Yeni aküyü yerleştir Sabitle Önce artı (+) bağla Sonra eksi (-) bağla Kutup başlarını sık 3) Voltaj kontrolü (~12.6V) Sistem çalışıyor mu kontrol et Gevşeklik / ısınma var mı bak 4) Eski Akü Yönetimi Yetkili geri dönüşüme ver Çöpe atma (kurşun-asit içerir) 5) Sistemi normal yükte çalıştırarak akü bağlantılarının sağlam olduğunu ve sistemde arıza/uyarı ışığı olmadığını doğrulayın. (Dikkat: Kutup başları gevşek bırakılırsa kıvılcım ve bağlantı kaybı riski oluşur.)` },

  { id:"EB3SOP18", title:"ELEKTRİK PANO-DOLAP AÇMA-KAPAMA GÜVENLİK KURALLARI SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Çorlu fabrikası teknik bakım biriminde enerjili veya enerjisiz elektrik pano/dolaplarının açılması, içinde inceleme/ölçüm/müdahale yapılması ve kapatılması sırasında uyulması gereken güvenlik kurallarını kapsar.
Adımlar: 1) Pano üzerinde yapılacak işin enerjili mi (live) yoksa enerjisiz mi (de-energized) yapılacağı belirlenir. (Dikkat: Mümkün olan her durumda enerjisiz çalışma tercih edilmelidir; enerjili çalışma yalnızca kaçınılmaz olduğunda ve yetkilendirilmiş kişilerce yapılmalıdır.) 2) Enerjisiz çalışma yapılacaksa, LOTO - Elektrik SOP'una göre panonun beslemesi kesilir, kilitlenir, etiketlenir ve gerilim ölçer ile enerjisiz olduğu teyit edilir. 3) Pano kapağı/kapısı açılmadan önce pano üzerindeki uyarı etiketleri (voltaj seviyesi, arc flash uyarısı) okunur ve dikkate alınır. 4) Pano açılırken, panonun önünde/çevresinde yalıtkan zemin paspası kullanılır (özellikle yüksek gerilim panolarında). 5) Enerjili çalışma kaçınılmazsa (örn. canlı ölçüm), uygun arc flash koruyucu KKD (yüz siperi, yanmaz iş elbisesi, yalıtkan eldiven) giyilir ve yalnızca yetkilendirilmiş elektrik personeli tarafından yapılır. (Dikkat: Enerjili çalışma için ayrıca yazılı "Enerjili Çalışma İzni" alınmalıdır; tek başına enerjili çalışma yapılmamalı, ikinci bir kişi (gözcü) bulunmalıdır.) 6) Pano içinde çalışma/inceleme yapılırken, yalnızca izole edilmiş/yalıtkanlı el aletleri kullanılır; iki elin de canlı parçalara temas etmemesine dikkat edilir. 7) İşlem tamamlandıktan sonra pano içi kontrol edilir; unutulan alet, malzeme veya yabancı cisim olmadığından emin olunur. 8) Pano kapağı/kapısı kapatılır, varsa kilit/vida ile sabitlenir. 9) Enerji, LOTO prosedürüne uygun şekilde (kilit/etiket çıkarma dahil) geri verilir; pano üzerindeki gösterge lambaları/ölçüm cihazları ile normal çalıştığı teyit edilir. (Dikkat: Enerji verilirken pano kapağı mümkünse kapalı tutulmalı veya güvenli mesafeden yapılmalıdır (olası arc flash riskine karşı).)` },

  { id:"EB3SOP19", title:"ELEKTRİKLİ EL ALETİ KULLANIM ÖNCESİ GÜVENLİK KONTROLÜ SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Matkap, taşlama, vidalama gibi elektrikli el aletlerinin kullanım öncesi güvenlik kontrolü işlemlerini kapsar.
Adımlar: 1) Alet gövdesi çatlak/kırık yönünden kontrol edilir. 2) Kablo ve fiş hasar (yalıtım soyulması, ezilme) yönünden kontrol edilir. (Dikkat: Hasarlı kablo elektrik çarpması riski taşır.) 3) Topraklama hattının (varsa) sağlam olduğu kontrol edilir. 4) Koruma siperi/muhafazası (taşlama, testere vb.) yerinde ve sağlam olduğu kontrol edilir. 5) Aletin çalıştırma/durdurma anahtarı test edilir. 6) Kullanılacak aksesuar (uç, disk) aletle uyumlu ve hasarsız olduğu kontrol edilir. (Dikkat: Uyumsuz/hasarlı aksesuar fırlama riski taşır.) 7) Kaçak akım rölesi (RCD) korumalı priz kullanılır, özellikle nemli ortamlarda. 8) Hasarlı alet tespit edilirse derhal kullanım dışı bırakılıp etiketlenir, kullanılmaz. 9) Kullanım sonrası alet kapatılır, kablosu düzenli sarılır, uygun yerde saklanır.` },

  { id:"EB3SOP2", title:"460001 ÇAP KALİBRASYONU TALİMATI", category:"Elektrik Bakım",
    content:`KAPSAM: Laminasyon 1 numara çap kalibrasyonu talimatını içerir.
Adımlar: 1) Ana menüdeki "ŞİFRE" butonuna basarak şifre girişini yapınız.(Şifre : 555) Giriş yaptıktan sonra NM servis (sarı çerçevede belirtilmiştir.) giriş yapınız (Dikkat: Belirtilen tuşlarda sembollerin üzerine tıklayınız.) 2) "DIAMETRI ALLA MESSA IN TIRO" Tıklayınız. 3) Makineye START verilir ardından bobin çapları ölçülerek (Resimde belirtilmiştir) uygun yerlere (Makine üzerinde belirtilmiştir hangisinin A-B olduğu) değerler girilerek kalibrasyon tamamlanır.` },

  { id:"EB3SOP22", title:"KABLO ÇEKİMİ VE KABLO KANALI DÖŞEME SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Yeni elektrik kablosu çekimi ve kablo kanalı/tavası döşeme işlemlerini kapsar.
Adımlar: 1) Güzergah proje/ihtiyaca göre belirlenir, mevcut tesisatlarla çakışma kontrol edilir. 2) Kablo kanalı/tava güzergaha uygun kesilir ve sabitlenir. 3) Kablo çekimi öncesi kablo tipi/kesiti yük hesabına uygun seçilir. (Dikkat: Yetersiz kesit aşırı ısınma/yangın riski taşır.) 4) Kablo çekimi yapılır, gerekiyorsa kayganlaştırıcı kullanılır, aşırı çekme kuvveti uygulanmaz. 5) Kablo büküm yarıçapı üretici toleransına uygun olmalıdır. (Dikkat: Aşırı büküm iç iletkende hasara yol açar.) 6) Kablo kanal içinde düzenli dizilir, etiketlenir. 7) Kablo uçları ilgili panoya/klemense bağlanır (LOTO-Elektrik SOP'una göre enerjisiz ortamda). 8) İzolasyon direnci (megger) testi yapılır. 9) Enerji verilir, fonksiyon testi yapılır. 10) Uygulama kayıt formuna işlenir.` },

  { id:"EB3SOP23", title:"LAMBA-AMPUL DEĞİŞİMİ SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Aydınlatma armatürlerindeki lamba/ampullerin güvenli şekilde değiştirilmesi işlemlerini kapsar.
Adımlar: 1) İlgili aydınlatma devresi mümkünse LOTO-Elektrik SOP'una göre enerjisiz hale getirilir. 2) Yükseklik gerekiyorsa Yüksekte Çalışma SOP'una uygun ekipman (merdiven/platform) kullanılır. 3) Armatür kapağı açılır, eski lamba çıkarılır. (Dikkat: Sıcak lamba direkt elle tutulmamalı, soğuması beklenmelidir.) 4) Yeni lambanın tip/güç/duy uyumu eskisiyle karşılaştırılır. 5) Yeni lamba takılır, armatür kapağı kapatılır. 6) Enerji verilir, lambanın çalıştığı teyit edilir. 7) Eski lamba (özellikle cıva içeren tipler) uygun atık prosedürüne göre bertaraf edilir. 8) İşlem kayıt formuna işlenir.` },

  { id:"EB3SOP24", title:"HONEYWELL OPTIMA PLUS LEL SENSÖRÜ KALİBRASYON SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Çorlu fabrikası Windmöller baskı makinelerinde bulunan Honeywell Searchpoint Optima Plus LEL (infrared alevlenebilir gaz) sensörlerinin periyodik sıfır (zero) ve span kalibrasyonu için Bakım ekibi tarafından yapılacak işlemleri içerir.
Adımlar: 1) Kalibrasyona başlamadan önce sensörün en az 1 saat süreyle enerjili (ısınmış) durumda olduğundan emin olunur. (Dikkat: Çok yüksek/düşük atmosfer basıncı, aşırı nem veya yüksek hava akış hızı olan koşullarda kalibrasyon yapılmamalıdır.) 2) İlgili Windmöller baskı makinesi pano/PLC ekranından sensör "Bakımda / Maintenance" moduna alınarak 4-20mA çıkışı inhibe edilir (alarm ve tripler devre dışı bırakılır). (Dikkat: Sensör bakım moduna alınmadan işlem yapılırsa yanlış alarm/trip oluşabilir. Vardiya sorumlusuna mutlaka bilgi verilmelidir.) 3) 13 mm (1/2") açık ağızlı anahtar ile standart hava koruma başlığı (weather protection) sökülür; yerine kalibrasyon kapağı (Calibration Cap) tam oturacak şekilde takılır. 4) SHC-1 el terminali sensöre bağlanır; menüden Calibrate > CalSensor seçilir. 5) Sensör civarında sıfır gaz (temiz hava) bulunduğu teyit edilir; gerekiyorsa 1-1,5 l/dk debide sıfır gazı uygulanır. Ekranda "Zero Calibrated" mesajı görülene kadar beklenir. (Dikkat: Sıfır kalibrasyonu tamamlanmadan span kalibrasyonuna geçilmemelidir.) 6) Span kalibrasyonuna devam etmek için onaylanır. Sertifikalı %50 LEL metan/propan kalibrasyon gazı 1-1,5 l/dk debisinde uygulanır; ekranda "Span Calibrated" mesajı görülene kadar beklenir. (Dikkat: Span kalibrasyonu yapılmayacaksa işlem bu noktada mutlaka menüden çıkılarak sonlandırılmalıdır; aksi halde sensör zarar görebilir.) 7) Kalibrasyon gazı kesilir, kalibrasyon kapağı sökülerek standart hava koruma başlığı yeniden takılır ve sıkılır. 8) Sensör "Normal" moda alınarak 4-20mA çıkışının inhibisyonu kaldırılır; pano üzerinden gaz okuma değerinin 0 (sıfır) LEL'e döndüğü teyit edilir. 9) Pano üzerinden A1/A2 alarm eşik testi simüle edilerek Windmöller makinesi güvenlik sisteminin (uyarı, trip) doğru tepki verdiği kontrol edilir. (Dikkat: Alarm testi sırasında makine operatörüne ve vardiya sorumlusuna bilgi verilmelidir.) 10) Kalibrasyon tarihi, kullanılan gaz sertifika bilgileri ve sonuçlar kalibrasyon kayıt defterine/formuna işlenir.` },

  { id:"EB3SOP25", title:"ELEKTRİKLİ İŞLERDE ENERJİ KESME VE KİLİTLEME-ETİKETLEME (LOTO) SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Çorlu fabrikası teknik bakım biriminde elektrikli ekipman/pano üzerinde yapılacak bakım, onarım veya arıza giderme çalışmaları öncesinde enerjinin güvenli şekilde kesilmesi, kilitlenmesi (lockout) ve etiketlenmesi (tagout) işlemlerini kapsar.
Adımlar: 1) Çalışma yapılacak ekipman/devre belirlenir; tek hat şeması (varsa) incelenerek besleme kaynağı(ları) tespit edilir. (Dikkat: Birden fazla besleme kaynağı olabilir (ana şebeke + jeneratör + UPS vb.); tüm kaynaklar tespit edilmelidir.) 2) İlgili vardiya amiri/proses sorumlusuna bilgi verilir, ekipmanın durdurulması için gerekli koordinasyon sağlanır. 3) Ekipman normal işletim prosedürüne göre durdurulur (varsa yumuşak durdurma/kapanma sırası izlenir). 4) Enerji kesme noktasındaki (şalter, kesici, ayırıcı) anahtar "OFF/KAPALI" konumuna alınır. (Dikkat: Yük altında ayırıcı açılmamalıdır; önce yük kesici/şalter ile yük kesilmeli, sonra ayırıcı açılmalıdır.) 5) Kesici/şalter üzerine kişisel kilit (padlock) takılır ve üzerine ad-soyad, tarih, iş açıklaması bilgilerini içeren "ÇALIŞILIYOR - AÇMAYINIZ" etiketi asılır. (Dikkat: Birden fazla kişi aynı devrede çalışıyorsa, her kişi kendi kilidini takmalıdır (multi-lock hasp kullanılır).) 6) Gerilim ölçer (voltmetre/test cihazı) ile devrenin gerçekten enerjisiz olduğu faz-faz ve faz-nötr arasında test edilir. (Dikkat: Test cihazının kendisi önce bilinen enerjili bir kaynakta test edilerek çalıştığı doğrulanmalıdır (test-before-test).) 7) Depolanmış enerji varsa (kapasitör, yaylı mekanizma, basınçlı hava vb.) boşaltılır/deşarj edilir. (Dikkat: Yüksek gerilim kapasitörleri özel deşarj çubuğu ile deşarj edilmeden dokunulmamalıdır.) 8) Çalışma tamamlanır; alan/ekipman kontrol edilerek üzerinde alet, malzeme bırakılmadığından emin olunur. 9) Kilit ve etiket, yalnızca onu takan kişi tarafından çıkarılır; ekipman enerjilendirilmeden önce tüm personelin alandan uzaklaştığı teyit edilir. (Dikkat: Kilidi takan kişi uygun değilse (izinli, işten ayrılmış vb.) kilidi çıkarma yalnızca belgelenmiş bir prosedürle (yönetici onayı) yapılabilir.) 10) Enerji verilmeden önce tüm koruma ekipmanlarının (siperlik, kapak vb.) yerine takıldığı kontrol edilir; enerji verilir ve ekipmanın normal çalıştığı teyit edilir.` },

  { id:"EB3SOP26", title:"PANO İÇİ KART DEĞİŞTİRME SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Elektrik/otomasyon panolarındaki arızalı kontrol kartlarının (PLC modülü, sürücü kartı vb.) değiştirilmesi işlemlerini kapsar.
Adımlar: 1) Pano LOTO-Elektrik SOP'una göre enerjisiz hale getirilir. (Dikkat: Mümkün olan her durumda enerjisiz çalışma tercih edilmelidir.) 2) Statik elektrik önleyici (ESD) bileklik takılır ve topraklanır. (Dikkat: Elektronik kartlar statik elektriğe (ESD) karşı hassastır.) 3) Arızalı kartın konumu, üzerindeki DIP switch/jumper ayarları ve bağlantı sırası fotoğraflanır/not edilir. 4) Kart üzerindeki konnektörler/kablolar dikkatlice sökülür. 5) Arızalı kart yuvasından çıkarılır. 6) Yeni kartın model/versiyon numarası eskisiyle karşılaştırılır. (Dikkat: Uyumsuz versiyon sistem hatasına yol açabilir.) 7) Yeni kart üzerinde eski karttaki DIP switch/jumper ayarları aynen uygulanır. 8) Yeni kart yuvasına takılır, konnektörler bağlanır. 9) Enerji verilir, kartın durum LED'leri ve haberleşmesi kontrol edilir. 10) Sistem fonksiyon testi yapılır, sonuçlar kayıt formuna işlenir.` },

  { id:"EB3SOP27", title:"PRİZ-ANAHTAR-AYDINLATMA ARMATÜRÜ MONTAJ-DEĞİŞİMİ SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Priz, anahtar ve aydınlatma armatürlerinin montaj/değişim işlemlerini kapsar.
Adımlar: 1) İlgili devre LOTO-Elektrik SOP'una göre enerjisiz hale getirilir. 2) Eski priz/anahtar/armatür sökülür, kablo bağlantıları not edilir. 3) Yeni ekipmanın voltaj/akım değerleri devre ile uyumlu olduğu kontrol edilir. 4) Kablo bağlantıları (faz, nötr, toprak) doğru şekilde yapılır. (Dikkat: Toprak bağlantısının atlanması ciddi güvenlik riski oluşturur.) 5) Ekipman kutusuna/yüzeye sabitlenir. 6) Bağlantılar gerilim ölçerle enerji verilmeden önce görsel kontrol edilir. 7) Enerji verilir, ekipmanın (priz/anahtar/lamba) doğru çalıştığı test edilir. 8) Kapak/pano düzeni toparlanır. 9) İşlem kayıt formuna işlenir.` },

  { id:"EB3SOP28", title:"TOPRAKLAMA SİSTEMİ PERİYODİK DİRENÇ ÖLÇÜMÜ SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Fabrika topraklama sisteminin periyodik direnç ölçümü ve kontrolü işlemlerini kapsar.
Adımlar: 1) Ölçüm yapılacak topraklama noktaları (pano, ekipman, paratoner vb.) belirlenir. 2) Topraklama megeri (earth tester) ile ölçüm yapılır. 3) Ölçüm sonuçları ilgili standarda (yönetmelik limitine) göre değerlendirilir. (Dikkat: Yüksek direnç değeri elektrik çarpması/arıza riskini artırır.) 4) Bağlantı noktalarının korozyon/gevşeklik yönünden görsel kontrolü yapılır. 5) Topraklama iletkeni süreklilik testi (varsa) yapılır. 6) Referans değerin üzerinde direnç tespit edilirse topraklama elektrotu/bağlantısı iyileştirilir. 7) Ölçüm sonuçları (nokta, tarih, değer) kayıt formuna işlenir. 8) Anormallikte bakım/iyileştirme talebi açılır.` },

  { id:"EB3SOP29", title:"SİGORTA DEĞİŞTİRME SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Elektrik pano/devrelerindeki atmış sigortaların (fuse) güvenli şekilde tespit ve değişim işlemlerini kapsar.
Adımlar: 1) Sigortanın bulunduğu devre mümkünse LOTO-Elektrik SOP'una göre enerjisiz hale getirilir. 2) Enerjisiz yapılamıyorsa uygun arc flash KKD ile ve yalnızca yetkili personelce yapılır. (Dikkat: Elektrik Pano Açma-Kapama SOP'undaki enerjili çalışma kuralları geçerlidir.) 3) Sigortanın atma nedeni araştırılır. (Dikkat: Neden giderilmeden sigorta değiştirilirse tekrar atabilir veya daha büyük hasara yol açabilir.) 4) Uygun izoleli sigorta çekme pensesi ile atmış sigorta çıkarılır. 5) Yeni sigortanın amper/tip değerinin eskisiyle birebir aynı olduğu kontrol edilir. (Dikkat: Yanlış amperajda sigorta yangın riski oluşturur.) 6) Yeni sigorta yuvasına takılır. 7) Enerji verilir, devrenin normal çalıştığı teyit edilir. 8) Sigorta değişimi ve atma nedeni kayıt formuna işlenir.` },

  { id:"EB3SOP3", title:"430004 CERUTTİ VİSKOZİTE EKRANI ADRESLEME SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Cerutti viskozite adresleme SOP içerir.
Adımlar: 1) Güç tuşuna basınız ve ekranın açılmasını bekleyiniz. 2) Ekran açıldıktan sonra 2 kere esc tuşuna basınız. 3) 2 kere esc tuşuna bastıktan sonra 'Main Menu ekranı açılacak burdan conf menüsüne geliniz ve ok tuşuna basınız. 4) Açılan settings ekranında I harfine (commuunication setup) geliniz ve ok basınız. 5) Açılan Adress menüsünde addr kısmına gelip ok basınız ve + - tuşlarıyla istediğiniz adresi giriniz ardından ok tuşuna basınız. (Ünite numarasını adres numarası olarak giriniz. ) 6) Adresleme tamamlandıktan sonra ekranı kapatıp yeniden açarak girilen adresin doğru kaydedildiğini kontrol edin. (Dikkat: Adres kontrolü yapılmadan işlemin tamamlandığı varsayılmamalıdır.)` },

  { id:"EB3SOP30", title:"SICAKLIK SENSÖRÜ DEĞİŞİMİ SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Proses hatlarındaki sıcaklık sensörlerinin (PT100, termokupl vb.) arıza nedeniyle değiştirilmesi işlemlerini kapsar.
Adımlar: 1) İlgili proses/ekipman mümkünse durdurulur veya sensör devresi LOTO-Elektrik SOP'una göre enerjisiz hale getirilir. 2) Sensörün bağlı olduğu hatta basınç/sıcaklık varsa, hat güvenli hale getirilir (boşaltılır/soğutulur). (Dikkat: Basınçlı/sıcak hatta sensör sökmek yanık/yaralanma riski taşır.) 3) Sensör kabloları klemens numarası not edilerek sökülür. 4) Sensör, hat üzerindeki yuvasından (termowell) sökülür. 5) Yeni sensörün tip/aralık (range) değeri eskisiyle karşılaştırılır. (Dikkat: Yanlış sensör hatalı okuma veya proses riskine yol açar.) 6) Yeni sensör yuvasına takılır, sızdırmazlık kontrol edilir. 7) Kablo bağlantıları klemens sırasına göre yeniden yapılır. 8) Enerji/proses devreye alınır, sensör okuması referans değerle karşılaştırılarak doğrulanır. 9) Sonuçlar kayıt formuna işlenir.` },

  { id:"EB3SOP31", title:"SIVI AKIŞKANLI HATLARDA BASINÇ SENSÖRÜ DEĞİŞİMİ SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Sıvı akışkanlı (su, yağ vb.) proses hatlarındaki basınç sensörlerinin (transmitter) değiştirilmesi işlemlerini kapsar.
Adımlar: 1) Sensör devresi mümkünse LOTO-Elektrik SOP'una göre enerjisiz hale getirilir. 2) Sensörün bağlı olduğu hat izolasyon vanası kapatılır. (Dikkat: Hat basınçlı kalırsa sökümde sıvı fışkırması riski oluşur.) 3) Sensör ile vana arasındaki tahliye/drenaj vanasından kalıntı basınç boşaltılır, manometreden sıfır teyit edilir. 4) Elektrik kabloları klemens numarası not edilerek sökülür. 5) Sensör hattaki bağlantısından (vidalı/flanşlı) sökülür. (Dikkat: Sızan sıvı için uygun toplama kabı hazır bulundurulmalıdır.) 6) Yeni sensörün basınç aralığı (range) ve bağlantı tipi eskisiyle karşılaştırılır. 7) Yeni sensör hatta takılır, sızdırmazlık (conta/teflon bant) sağlanır. 8) Kablo bağlantıları yapılır. 9) İzolasyon vanası kademeli olarak açılır, sızıntı kontrol edilir. (Dikkat: Ani açma su darbesi (water hammer) riski oluşturabilir.) 10) Enerji verilir, okuma referans değerle karşılaştırılır, sonuçlar kayıt formuna işlenir.` },

  { id:"EB3SOP4", title:"EK SENSÖRLERİN DEVREYE ALINMASI TALİMATI", category:"Elektrik Bakım",
    content:`KAPSAM: Ek sensörlerin devreye alınması talimatını içerir.
Adımlar: 1) Filmi sensörün içerisine rahatça geçecek şekilde yerleştirin. 2) Yeşil ve sarı ledler aynı anda yanıp sönene kadar Teach (Öğretme )butonuna basılı tutun. (2-7sn) 3) Teach butonunu serbest bırakın ledler daha hızlı yanıp sönecektir. Öğretme süresi 6 sn dir. 4) Makine dönmüyorsa da gergide olmalı, dönüyorsa hızı max:50m/dk olmalı.Öğretme sırasında ek sensörün içinden geçmelidir. 5) Öğretme süresi dolduktan sonra sensör işlemi otomatik olarak bitirir ve yeşil led yanar. Eğer öğretme işlemi hatalı ise kırmızı led ( Warn lambası) yanar. Bu durumda öğretme işlemi tekrar yapılmalıdır. 6) Aynı malzemede bobin geçişleri sırasında tekrar öğretme yapmaya gerek yoktur. Farklı bir malzeme (İş değişimi) ile çalışmaya geçilecekse öğretme işlemi tekrar yapılmalıdır.` },

  { id:"EB3SOP5", title:"EXTRUDER EKRAN KALİBRASYONU", category:"Elektrik Bakım",
    content:`KAPSAM: Extruder ekran kalibrasyonu talimatını içerir.
Adımlar: 1) OCS ekranından menüye giriniz. 2) Açılan sayfadan servis şifresini giriniz. (Şifre ''4711'') 3) Şifreyi girdikten sonra ayarlar butonu çıkacak ekranda ayarlara giriş yapınız. 4) Tam ekran/pencere geçişine tıklayınız. 5) Masaüstünde ''Touch.bat'' yazan programı açınız. 6) Kalibrasyon ekranında belirtilen süre içerisinde ekranda belirtilen kırmızı dairelerin ortalarına tıklayınız. (Dikkat: Kalibrasyonu yaparken parmağınızın ucunu kullanın tırnağınızı kullanmayınız.) 7) Ayarlar sekmesini açarak Tam ekran/pencere geçişine tekrardan tıklayarak programı eski haline getirip kalibrasyonu test ediniz.` },

  { id:"EB3SOP6", title:"KABLO SAĞLAMLIK KONTROLÜ SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Kablo sağlamlık kontrolü talimatı içerir.
Adımlar: 1) Gözle Kontrol -Kablonun dış kılıfında kesik, ezilme, soyulma var mı kontrol edilir. Kablo tavalarında veya makine üzerinde keskin kenara sürtme olup olmadığına bakılır. Kablo fazla geriliyor, bükülüyor veya çalışma sırasında sürtünüyorsa tespit edilir. Konnektörlerde kırık pin, gevşeklik veya oksidasyon kontrol edilir. (Dikkat: Enerji tamamen kesilmeden kablo testi yapılmaz. Pano içinde çalışma için yetki alınır. İzolasyon testi sırasında ekipmanın diğer uçları boşta ve bağlantısız olmalıdır.) 2) Süreklilik Testi (Continuity Test) Enerji kesildikten sonra multimetre ile: Multimetre süreklilik moduna alınır. Kablonun iki ucundaki aynı renkteki iletkenlere prob temas ettirilir. Multimetre bip sesi veriyorsa kablo süreklidir. Sinyal yoksa: kablo içinde kopukluk olabilir → kablo değişir. (Dikkat: Çok damarlı kablolarda her damar ayrı ayrı ölçülmelidir.) 3) İzolasyon Testi (Megger ile) Kablo tamamen sistemden ayrılır. Megger 500V/1000V test moduna alınır. Örneğin faz – toprak arasında ölçüm yapılır. Kabul değeri genelde > 1 MΩ olmalıdır (makine üreticisine göre değişebilir). Değer düşükse → kablo izolasyonu zayıf veya hasarlı → Değişim gerekir. 4) Konnektör / Soket Kontrolü Pinlerde eğilme, oksit, gevşeme var mı incelenir. Kablo uçlarındaki sıkmalar kontrol edilir. M12 / M8 konnektörlerde O-ring contaların eksiksiz olduğundan emin olunur. 5) Test sonuçlarını kayıt altına alın; ölçüm değerleri kabul sınırlarının dışındaysa kabloyu değiştirin ve bilgiyi ilgili amire iletin.` },

  { id:"EB3SOP7", title:"KONTRAST SENSÖRÜ KALİBRASYON TALİMATI", category:"Elektrik Bakım",
    content:`KAPSAM: Kontrast sensörü kalibrasyon talimatını içerir.
Adımlar: 1) Sensörün doğru açıda olduğuna dikkat ediniz. 2) Sensörün + / - tuşlarına basarak Ech menüsüne geliniz ve set tuşuna basınız. 3) 2P menüsüne geliniz ardından yine set deyiniz. 4) Cihazın siyah register noktalarını gördüğünden emin olunuz ardından set tuşuna basınız. 5) Cihazın siyah register noktalarını görmediğinden emin olunuz ardından set tuşuna basınız. 6) Makineye start verip denemesini yapınız. 7) Deneme baskısında register/kontrast hatası olmadığı teyit edildikten sonra makineyi normal üretime alın.` },

  { id:"EB3SOP8", title:"KUNDİG KALINLIK KONTROL CİHAZI TEMİZLİK TALİMATI SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Kundig kalınlık kontrol cihazı temizlik talimatı SOP
Adımlar: 1) Temiz bir bez üzerine birkaç fıs yağ çözücü sıkılarak bez nemlendirilir. Kalınlık ölçer üzerinde bulunan, resimde gösterilen 2 adet sensör yağ çözücü sıktığımız bez ile silinerek temizlenir. 2) Yağ çözücü sıktığımız bez ile resimde gösterilen kalınlık ölçer kafası silinerek temizlenir. Temizlik esnasında kalınlık ölçer kafası içe doğru çok baskı uygulanmadan hafifçe silinir. (Dikkat: Kalınlık ölçer kafasının temizliği yapılırken basınçlı havanın açık olması gerekmektedir. Aksi taktirde kafa üzerinde bulunan deliklerden sensör içerisine kir ve toz girişi olur.) 3) Yağ çözücü sıktığımız bez ile resimde gösterilen kalınlık ölçerin üzerinde hareket ettiği rayın üst ve alt yüzeyi iyice temizlenir. (Dikkat: Temizlik yapıldıktan sonra bu ray üzerine yağ vs. ürünler sürülmez. Yağ ray üzerinde kayganlık oluşturarak tekerleklerin dönme hareketi yerine kaymasına sebep olur ve tekerlekler deforme olur.) 4) Temizlik işlemi tamamlandıktan sonra basınçlı hava ile kalınlık ölçer üzerindeki toz ve kalıntılar temizlenir. (Dikkat: Basınçlı hava kullanılırken göz koruyucu takılmalıdır.) 5) Cihaz çalıştırılarak ölçüm değerlerinin normal aralıkta olduğu kontrol edilir.` },

  { id:"EB3SOP9", title:"MAKİNE İNTERNET BAĞLANTISI AÇMA TALİMATI", category:"Elektrik Bakım",
    content:`KAPSAM: Makine internet bağlantısı açma talimatını içerir.
Adımlar: 1) Ortak ağda bulunan dosyadan çorlu bakım klasörünün içerindeki ''ASB OTOMASTON IPLERİ'' Adlı Excel dosyası açılıp internet erişimi talep edilen makinenin ipsi bulunur. (Dikkat: Extruder servis bağlantısı için ISP ve Servis için tanımlanan 2 ipde bağlantı açılması gerekmektedir.) 2) ITSM portalına giriş yapılır. Bilgi teknolojileri genel yardım seçilir. 3) Yetki,Erişim talepleri seçilir. 4) Fotoğrafta belirtildiği şekilde talep oluşturulur ve gönderilir. 5) Talep IT tarafından onaylandıktan sonra ilgili makine üzerinden internet/servis bağlantısının çalıştığı test edilerek doğrulanır. (Dikkat: Bağlantı testi tamamlanmadan işlemin bittiği varsayılmamalıdır.)` },

  { id:"MB3SOP1", title:"DİKEY (RADYAL) SABİT MATKAP KULLANIMI TALİMATI", category:"Mekanik Bakım",
    content:`KAPSAM: Dikey (radyal) sabit matkap kullanımı talimatını kapsar.
Adımlar: 1) İlk önce radyal matkabın aparatlarının ne ise yaradığını öğrenelim. (SOP sonunda fotoğrafta belirtilmiştir.) (Dikkat: Ekipmansız kullanılmamalı. Matkap ucu takıldığı zaman kontrol edilmeli. Yanlış kullanım yapılıyosa önlenmeli. Parçanın sabit olduğundan emin olunmalı.) 2) Çalısmaya başlamadan önce, yapılacak iş hakkında düşünülerek,hangi malzemelere matkap ucu,havşa açma ucu vb.) ihtiyacımız olduğu tespit edilir. Ekipman üstü ve çevresi kontrol edilir.Ekipman üzerinde ,yapacağımız iş ile ilgili kullanılmayacak olan malzeme var ise bu malzemeler ortamdan uzaklaştırılır. Ayrıca ekipman üzerinde ve çevresinde metal çapağı vb. gibi malzemeler özellikle temizlenmelidir.Bu temizlik esnasında eldiven kullanılmalıdır. (Dikkat: Takılacak uçta bir kırık vb. varsa kullanılmamalı. Ekipmanlarda yırtık varsa yada bolsa değiştirilmeli takılabilir.) 3) Ekipmanın besleme enerjisi fişi ve kablosu,göz koruma kapağı ,kayış kapak sivici,start-stop butonu vb... emniyet sistemleri kontrolü yapılır. Ekipman dikey seviye ayarını kendimize ve yapacağımız ise göre ekipmanı çalıstırmadan ,baskı kolu yardımı ile kontrol edilir,gerekli ise seviye ayarı yapılır (Dikkat: Eğer bir kırık bozuk varsa kontrol edilip düzeltilir.) 4) Matkap mandreni gevşetilir.Üzerinde işimize uygun olmayan delik açma malzemesi var ise çıkarılır. İşimizde kullanacağımız malzemeye uygun matkap ucu mandrene yerleştirilerek,mandren sağlam bir şekilde özel anahtarı ile sıkılır.Çalışma esnasında gevşeme olmaması için bu çok önemlidir. İşlem yapılacak olan malzeme ekipman üzerindeki mengeneye sabitlenir. Mengene hizalaması baskı kolu yardımı ile mandren aşağı yönde yavaşça indirilerek yapılır. Mengene hizalamasından emin isek mengene sabitlenir. (Dikkat: Dogru kullanımı bilmeden kullanım yapmayınız.) 5) Tüm ayarları tamamladıktan sonra ,işlem yapılacak parça ve mengene sağlam bir şekilde sabitlemesi yapıldığından emin isek matkap koruma camı kapatılır. Kendi güvenliğimiz için mutlaka koruma gözlüklerimizi giymemiz gerekir (Dikkat: Parçada eğik krırık varsa dikkat edilmeli.) 6) Matkap fişi besleme prizine bağlı değil ise bağlanır. Matkap start-stop butonu kapağı açılır. Matkap start butonuna ( Üzerinde I yazan ) basılır. Matkap ,üzerindeki sabitlenmiş parça üzerine matkap baskı kolu yavaşça indirilerek ,daha önceden markaladığımız noktaya çok yavaş bir şekilde birkaç defa yumuşak darbeler ile matkap ucu dokundurulur.Ve kol bırakılarak mandrenin yukarı hareket etmesi sağlanır. Bu defa matkap baskı kolu yardımı ile mandren aşagı yönde tekrar hareket ettirilir,daha önceden belirginleştirdiğimiz nokta üzerinde delme işlemi çok aşırı baskı uygulamadan gerçekleştirilir.Bu şlem esnasında gerekli ise matkap durdurularak kayış gergi ayarı yapılmalıdır. Delme işlemi gerçekleşir gerçekleşmez mandren yukarı yönde hareket ettirili (Dikkat: Eğer fişte veya prizde herangi bir kaçak varsa kullamım yapılmaz) 7) Delme işlemi tamamlandıktan sonra matkap start-stop butonundan durdurulur, fişi prizden çekilir, parça mengeneden çıkarılır ve çalışma alanı metal talaşlarından temizlenir. (Dikkat: Matkap tamamen durmadan parça mengeneden çıkarılmamalıdır.) 8) Matkap ile çalışan hiçbir çalısma arkadaşımıza el şakası vb.. şakalar yapmak. Matkap ile çalışırken bol kıyafetler giymek.Matkap ile çalışmalarda ,matkabın tshirtümüzü veya pantolon paçamızı sararak bize zarar verebileceğini asla unutmamalıyız. Matkap ile çalışmalarda , işlem yapılacak olan parçayı el ile tutma veya gevşek sabitleme., Ekipmanların üzerindeki koruyucu donanınmları çıkarmak veya kullanmamak. Gerekli olan tüm kişisel koruyucu ekipmanlarını giymemek (Dikkat: İş yapılan bir ortamda muhabete dalıp iş yapılmaması gerekir.)` },

  { id:"MB3SOP10", title:"BASINÇLI HAVA HATTI SIZINTI TESPİTİ VE ONARIMI SOP", category:"Mekanik Bakım",
    content:`KAPSAM: Fabrika genelindeki basınçlı hava dağıtım hatlarında sızıntı tespiti ve onarımı işlemlerini kapsar.
Adımlar: 1) Sızıntı şüphesi olan bölge/hat belirlenir, saha gözlemi (ses, hava akımı hissi) yapılır. 2) Ultrasonik sızıntı dedektörü (varsa) ile hat taranarak sızıntı noktası tespit edilir. 3) Tespit edilen sızıntı noktası işaretlenir. 4) Onarım gerektiren hat bölümü LOTO/izolasyon prosedürüne göre devre dışı bırakılır, basıncı tahliye edilir. 5) Sızıntı kaynağı (rakor, contasız bağlantı, çatlak boru vb.) belirlenir. 6) Arızalı parça/bağlantı sökülür, yenisiyle değiştirilir veya sızdırmazlık (teflon bant/conta) yenilenir. 7) Bağlantı uygun tork ile sıkılır. 8) Hat kademeli olarak devreye alınır, sabunlu su testi ile sızıntı kalmadığı teyit edilir. 9) Onarım kayıt formuna işlenir.` },

  { id:"MB3SOP11", title:"DEMİR-KAYNAK ATÖLYESİ GENEL ÇALIŞMA VE EKİPMAN GÜVENLİK TALİMATI", category:"Mekanik Bakım",
    content:`KAPSAM: Demir/kaynak atölyesinde genel çalışma düzeni ve ekipman güvenlik kurallarını kapsar.
Adımlar: 1) Atölyeye giriş öncesi uygun KKD (kaynak maskesi, önlük, eldiven, çelik burunlu ayakkabı) giyilir. 2) Kaynak makinesi/kesme ekipmanı kullanım öncesi kablo/hortum hasarı yönünden kontrol edilir. 3) Çalışma alanı çevresindeki yanıcı malzemeler uzaklaştırılır. (Dikkat: Bkz. Sıcak Çalışma İzni SOP.) 4) Havalandırma sistemi (duman aspiratörü) çalışır durumda olduğu kontrol edilir. 5) Oksi-gaz tüpleri dik konumda, sabitlenmiş ve geri tepme valfli olduğu kontrol edilir. 6) Taşlama/kesme işlemlerinde koruyucu siperlik/gözlük kullanılır, sıçrama alanı çevresi kontrol edilir. 7) El aletleri (örs, mengene, pres vb.) kullanım öncesi hasar yönünden kontrol edilir. 8) İş bitiminde ekipmanlar kapatılır, tüpler vanalarından kapatılır, alan temizlenir. 9) Atölye çıkışında yangın riski (kor, sıcak parça) son kez kontrol edilir.` },

  { id:"MB3SOP12", title:"KAPLİN DEĞİŞİMİ SOP", category:"Mekanik Bakım",
    content:`KAPSAM: Motor-ekipman arasındaki kaplin (coupling) bağlantı elemanının değiştirilmesi işlemlerini kapsar.
Adımlar: 1) Ekipman LOTO-Elektrik ve LOTO-Mekanik SOP'una göre enerjisiz hale getirilir. 2) Kaplin koruma muhafazası sökülür. 3) Eski kaplin elemanı (lastik/elastomer parça veya disk) sökülür. 4) Mil yüzeyleri ve kaplin göbekleri hasar/aşınma yönünden kontrol edilir. 5) Yeni kaplin elemanının tip/ölçüsü eskisiyle karşılaştırılır. 6) Yeni kaplin takılır. 7) Hizalama (alignment) kontrol edilir/yapılır. (Dikkat: Kaplin değişimi sonrası hizalama hatası titreşime yol açar.) 8) Koruma muhafazası takılır. 9) LOTO kaldırılır, çalıştırılır, titreşim/ses kontrol edilir. 10) Sonuçlar kayıt formuna işlenir.` },

  { id:"MB3SOP13", title:"HİDROLİK ÜNİTE BAKIMI VE YAĞ ANALİZİ SOP", category:"Mekanik Bakım",
    content:`KAPSAM: Hidrolik güç ünitelerinin periyodik bakımı ve yağ analizi işlemlerini kapsar.
Adımlar: 1) Ünite LOTO-Elektrik SOP'una göre enerjisiz hale getirilir (müdahale gerektiren bakımlarda). 2) Yağ seviyesi göstergeden kontrol edilir, gerekiyorsa tamamlanır. 3) Yağ filtresi kirlilik göstergesi kontrol edilir, gerekiyorsa değiştirilir. 4) Yağ sıcaklığı çalışma aralığında olduğu kontrol edilir. (Dikkat: Aşırı sıcaklık yağ bozulmasını hızlandırır.) 5) Numune alınarak periyodik yağ analizi (parçacık sayımı, viskozite) yaptırılır. (Dikkat: Erken arıza tespiti sağlar.) 6) Hortum/boru bağlantılarında sızıntı kontrol edilir. 7) Basınç ayarları (relief valve) referans değerde olduğu kontrol edilir. 8) Pompa/motor titreşim ve sesi kontrol edilir. 9) Sonuçlar kayıt formuna işlenir, anormallikte bakım talebi açılır.` },

  { id:"MB3SOP14", title:"MEKANİK EKİPMANDA BAKIM ÖNCESİ ENERJİ İZOLASYONU (LOTO) SOP", category:"Mekanik Bakım",
    content:`KAPSAM: Çorlu fabrikası teknik bakım biriminde dönen/hareketli mekanik ekipmanlar (motor, pompa, konveyör, redüktör vb.) üzerinde yapılacak bakım/onarım çalışmaları öncesinde tüm enerji formlarının (elektrik, basınçlı hava, hidrolik, mekanik/yay, kinetik/potansiyel) izole edilmesi işlemlerini kapsar.
Adımlar: 1) Ekipman üzerindeki tüm enerji kaynakları tespit edilir: elektrik beslemesi, basınçlı hava/hidrolik hat, yaylı/ağırlık kaynaklı potansiyel enerji, dönen kütlelerin kinetik enerjisi. 2) Ekipman normal durdurma prosedürüne göre durdurulur; hareketli parçaların tamamen durduğu gözle/kulakla teyit edilir. 3) Elektrik beslemesi kesilir, kilitlenir ve etiketlenir (LOTO - Elektrik SOP'una göre). 4) Basınçlı hava/hidrolik besleme vanaları kapatılır, kilitlenir; hat üzerindeki basınç tahliye (bleed) vanası açılarak sistemdeki artık basınç boşaltılır. (Dikkat: Basınç göstergesinin (manometre) sıfırı gösterdiği teyit edilmeden hatta müdahale edilmemelidir.) 5) Yerçekimi/yay etkisiyle hareket edebilecek parçalar (askıda yük, gergin yay, kaldırılmış tabla vb.) mekanik destek (blok, pim, emniyet çubuğu) ile sabitlenir. (Dikkat: Sadece hidrolik/pnömatik silindire güvenilmemeli, mekanik emniyet desteği mutlaka kullanılmalıdır.) 6) Dönen kütleler (volan, rulo vb.) varsa, tamamen durduğu ve serbest dönmeyeceği teyit edilir; gerekiyorsa mekanik fren/blokaj uygulanır. 7) Tüm izolasyon noktaları kişisel kilit ve etiketle işaretlenir (multi-lock hasp ile, birden fazla kişi/enerji kaynağı varsa). 8) Sıfır enerji durumu (try-out) test edilir: ekipmanın çalıştırma butonuna basılarak hareket etmediği, basınçlı hatta kalıntı basınç olmadığı doğrulanır. (Dikkat: Try-out testi sırasında ekipmanın tehlike bölgesinde kimse bulunmamalıdır.) 9) Bakım/onarım çalışması gerçekleştirilir. 10) Çalışma tamamlandıktan sonra alan temizlenir, tüm koruyucu kapak/siperlikler yerine takılır, mekanik destekler (blok, pim) çıkarılır. 11) Kilit ve etiketler yalnızca takan kişi tarafından çıkarılır; tüm personelin güvenli mesafede olduğu teyit edildikten sonra enerji sırasıyla (mekanik → basınçlı hava/hidrolik → elektrik) geri verilir.` },

  { id:"MB3SOP15", title:"MOTOR DEĞİŞTİRME (GENEL) SOP", category:"Mekanik Bakım",
    content:`KAPSAM: Fabrika genelinde pompa, fan, konveyör vb. ekipmanları tahrik eden elektrik motorlarının arıza/bakım nedeniyle sökülüp yenisiyle değiştirilmesi işlemlerini kapsar.
Adımlar: 1) Motor LOTO-Elektrik SOP'una göre enerjisi kesilir, kilitlenir, gerilim ölçerle enerjisiz olduğu teyit edilir. 2) Motora bağlı mekanik bağlantılar (kaplin, kayış-kasnak, redüktör) LOTO-Mekanik SOP'una göre izole edilir. 3) Motor bağlantı kabloları klemens numaraları not edilerek sökülür. (Dikkat: Kablo dizilimi fotoğraflanmalı; yanlış bağlantı motorun ters yönde çalışmasına yol açabilir.) 4) Motor sabitleme cıvataları sökülür, motor uygun kaldırma ekipmanıyla yerinden alınır. (Dikkat: Motor ağırlığına uygun kaldırma ekipmanı seçilmelidir (bkz. Kaldırma Ekipmanları SOP).) 5) Yeni motorun etiket bilgileri (güç, devir, gerilim, akım) eskisiyle karşılaştırılır. (Dikkat: Uyumsuz motor takılması ekipmana ciddi hasar verebilir.) 6) Yeni motor yerine yerleştirilir, hizalama (alignment) yapılır. (Dikkat: Hizalama hatası titreşim ve erken arızaya yol açar.) 7) Elektrik bağlantıları önceden not edilen klemens sırasına göre yeniden yapılır. 8) Mekanik bağlantılar (kaplin/kayış) takılır, gerekli boşluk/gerginlik ayarları yapılır. 9) LOTO kaldırılır, motor kısa süreli (bump test) çalıştırılarak dönüş yönü kontrol edilir. (Dikkat: Ters yönde çalışma bağlı ekipmana zarar verebilir.) 10) Motor tam yükte çalıştırılır; akım, titreşim ve sıcaklık değerleri kontrol edilip kayıt formuna işlenir.` },

  { id:"MB3SOP16", title:"MOTOR KAYIŞ DEĞİŞİMİ SOP", category:"Mekanik Bakım",
    content:`KAPSAM: Kayış-kasnak tahrikli ekipmanlarda (fan, pompa vb.) aşınmış/kopmuş kayışların değiştirilmesi işlemlerini kapsar.
Adımlar: 1) Ekipman LOTO-Elektrik ve LOTO-Mekanik SOP'una göre enerjisiz hale getirilir. 2) Kayış koruma muhafazası (guard) sökülür. 3) Kayış gerginlik ayar mekanizması gevşetilir. 4) Eski kayış kasnaklardan çıkarılır. (Dikkat: Kayışı zorlayarak/aletle kaldırıp çıkarmak kayışa veya kasnağa zarar verebilir; gerginlik ayarından gevşetilerek çıkarılmalıdır.) 5) Kasnaklar aşınma/hizalama yönünden kontrol edilir. (Dikkat: Kasnak hizasızlığı kayışın erken aşınmasına yol açar.) 6) Yeni kayışın tip/ölçü değeri eskisiyle karşılaştırılır. 7) Yeni kayış kasnaklara takılır, gerginlik üretici talimatına göre ayarlanır. (Dikkat: Aşırı gergin kayış rulman yükünü artırır, gevşek kayış kaymaya sebep olur.) 8) Koruma muhafazası yerine takılır. 9) LOTO kaldırılır, ekipman çalıştırılır; kayış hizası/sesi/titreşimi kontrol edilir. 10) Sonuçlar kayıt formuna işlenir.` },

  { id:"MB3SOP17", title:"PİSTON DEĞİŞİMİ SOP", category:"Mekanik Bakım",
    content:`KAPSAM: Kompresör, pompa veya hidrolik/pnömatik silindirlerdeki pistonların arıza nedeniyle değiştirilmesi işlemlerini kapsar.
Adımlar: 1) Ekipman LOTO-Elektrik ve LOTO-Mekanik SOP'una göre enerjisiz/basınçsız hale getirilir. 2) Hidrolik/pnömatik sistemse hat basıncı tahliye edilir, manometreden sıfır teyit edilir. 3) Piston erişimi için gerekli kapak/gövde parçaları sökülür. 4) Eski piston, silindir/krank mekanizmasından sökülür. (Dikkat: Piston kolu/pim bağlantıları dikkatli sökülmeli, zorlama parçalara zarar verebilir.) 5) Silindir iç yüzeyi aşınma/çizik yönünden kontrol edilir. 6) Yeni pistonun ölçü/tip uyumu eskisiyle karşılaştırılır. 7) Piston segmanları (varsa) doğru yönde ve sırada takılır. (Dikkat: Ters takılan segman yağ kaçağı/performans kaybına yol açar.) 8) Yeni piston silindire/mekanizmaya monte edilir, gerekli tork değerleriyle sabitlenir. 9) Kapak/gövde parçaları yerine takılır, sızdırmazlık kontrol edilir. 10) Sistem kademeli olarak devreye alınır, çalışma basıncı/performansı kontrol edilir, sonuçlar kayıt formuna işlenir.` },

  { id:"MB3SOP18", title:"PNÖMATİK VALF-SİLİNDİR BAKIMI SOP", category:"Mekanik Bakım",
    content:`KAPSAM: Pnömatik valf ve silindirlerin periyodik bakımı işlemlerini kapsar.
Adımlar: 1) Sistem LOTO-Mekanik SOP'una göre basınçsız hale getirilir, hat tahliye edilir. 2) Valf/silindir gövdesi hasar yönünden kontrol edilir. 3) Bağlantı noktalarında sızıntı (sabunlu su testi ile) kontrol edilir. 4) Silindir keçeleri aşınma yönünden kontrol edilir, gerekiyorsa değiştirilir. 5) Yağlayıcı (lubrikatör, varsa) yağ seviyesi kontrol edilir. 6) Filtre-regülatör ünitesi kontrol edilir, kondens tahliye edilir. 7) Valf elektrik/pilot bağlantıları (solenoid valfler için) kontrol edilir. 8) Sistem devreye alınır, valf/silindir fonksiyon testi yapılır. 9) Sonuçlar kayıt formuna işlenir.` },

  { id:"MB3SOP19", title:"POMPA DEĞİŞİMİ SOP", category:"Mekanik Bakım",
    content:`KAPSAM: Proses/yardımcı sistemlerdeki arızalı pompaların komple değiştirilmesi işlemlerini kapsar.
Adımlar: 1) Pompa LOTO-Elektrik ve LOTO-Mekanik SOP'una göre enerjisiz hale getirilir. 2) Emme ve basma hattı vanaları kapatılır, hat boşaltılır. (Dikkat: Hat boşaltılmadan pompa sökümü sıvı akmasına yol açar.) 3) Pompa elektrik bağlantıları klemens numarası not edilerek sökülür. 4) Pompa-motor kaplin bağlantısı ve mesnet cıvataları sökülür. 5) Eski pompa uygun kaldırma ekipmanıyla yerinden alınır. 6) Yeni pompanın debi/basma yüksekliği (H-Q eğrisi) ve bağlantı ölçüleri eskisiyle karşılaştırılır. (Dikkat: Uyumsuz pompa proses performansını olumsuz etkiler.) 7) Yeni pompa yerine yerleştirilir, hizalama (alignment) yapılır. 8) Emme/basma hattı bağlantıları yapılır, contalar yenilenir. 9) Elektrik bağlantıları yapılır, dönüş yönü kısa süreli çalıştırılarak (bump test) kontrol edilir. 10) Vanalar kademeli açılır, pompa devreye alınır; debi/basınç/titreşim kontrol edilir, sonuçlar kayıt formuna işlenir.` },

  { id:"MB3SOP2", title:"PRESÖR KENAR TEMİZLİĞİ SOP", category:"Mekanik Bakım",
    content:`KAPSAM: Presör kenar temizliği SOP
Adımlar: 1) Üretimden gelen paletler torna atölyesi kapısına bırakılır. 2) Start butonuna basılır. 3) Start verildikten sonra spota hareket verilerek grasörün sağ ve sol kater ile gerekli işlemleri yapılır. 4) Presör kenarları kater ile istenilen ölçüde traşlanır ve yüzey kontrol edilir. (Dikkat: Kesme sırasında talaşlardan korunmak için siperlik/gözlük kullanılmalıdır.) 5) İşlem tamamlandıktan sonra presör vinç yardımıyla tezgahtan alınıp transpalet ile ilgili alana taşınır, torna tezgahı ve çalışma alanı temizlenir.` },

  { id:"MB3SOP20", title:"REDÜKTÖR (DİŞLİ KUTUSU) YAĞ DEĞİŞİMİ-BAKIMI SOP", category:"Mekanik Bakım",
    content:`KAPSAM: Redüktörlerin periyodik yağ değişimi ve bakımı işlemlerini kapsar.
Adımlar: 1) Redüktör LOTO-Elektrik ve LOTO-Mekanik SOP'una göre enerjisiz hale getirilir. 2) Redüktör gövdesi sızıntı/hasar yönünden kontrol edilir. 3) Eski yağ boşaltma tapasından tamamen boşaltılır. (Dikkat: Redüktör hafif ısınmışken yağ daha akışkan olur, boşaltma kolaylaşır.) 4) Boşaltılan yağ görsel olarak (renk, metal parçacık) incelenir. (Dikkat: Metal parçacık iç aşınma göstergesidir.) 5) Redüktör iç kısmı gerekiyorsa temizlenir. 6) Yeni yağ üretici talimatına uygun tip ve miktarda doldurulur. 7) Yağ seviyesi gösterge/tapa seviyesinden teyit edilir. 8) LOTO kaldırılır, redüktör çalıştırılır, sızıntı/ses/titreşim kontrol edilir. 9) Eski yağ uygun atık prosedürüne göre bertaraf edilir. 10) Sonuçlar kayıt formuna işlenir.` },

  { id:"MB3SOP21", title:"RULMAN DEĞİŞTİRME SOP", category:"Mekanik Bakım",
    content:`KAPSAM: Motor, pompa, fan gibi dönen ekipmanlardaki rulmanların (bearing) periyodik bakım veya arıza nedeniyle değiştirilmesi işlemlerini kapsar.
Adımlar: 1) Ekipman LOTO-Elektrik ve LOTO-Mekanik SOP'una göre enerjisiz hale getirilir. 2) Rulman değişecek ekipman sökülür, mil ve gövde temizlenir. 3) Eski rulman uygun çekme aparatı (bearing puller) ile sökülür. (Dikkat: Çekiçle vurarak sökme mil/gövdeye zarar verebilir.) 4) Mil ve yatak yuvası aşınma/çizik yönünden kontrol edilir. 5) Yeni rulmanın tip/ölçü değeri eskisiyle karşılaştırılır. (Dikkat: Yanlış rulman kullanımı erken arızaya yol açar.) 6) Rulman takılmadan önce temizliği yapılır, gerekiyorsa ısıtılarak montaj kolaylaştırılır. (Dikkat: Soğuk halde zorlayarak/darbeyle takma rulmana zarar verir.) 7) Rulman mile/yatağa monte edilir, gerekli tolerans/boşluk kontrol edilir. 8) Gres/yağlama üretici talimatına göre yapılır. (Dikkat: Aşırı veya yetersiz yağlama erken arızaya sebep olur.) 9) Ekipman toparlanır, LOTO kaldırılır, çalıştırılır. 10) İlk çalıştırmada titreşim/ses/sıcaklık izlenir, sonuçlar kayıt formuna işlenir.` },

  { id:"MB3SOP3", title:"RULMAN DEĞİŞİMİ TALİMATI SOP", category:"Mekanik Bakım",
    content:`KAPSAM: Rulman değişimi talimatını içerir.
Adımlar: 1) Değişimi yapılacak rulmanı çıkarmaya başlamadan önce İSG nin uygun gördüğü kesilmeye dayanıklı eldivenini giy. ve iş güvenliği gözlüğünü tak. (Dikkat: Bu operasyon sırasında kesilmeye dayanıklı eldiven giyilmediğinde yaşanacak iş kazalarında yaralanma ve uzuv kaybına sebebiyet verebilir. Gözlük takılmadığında göze çapak veya toz kaçıp görme kaybı yaşanabilir.) 2) Değişimi yapılacak rulmana uygun ölçüdeki çektirme, merkezli olarak takılır (Dikkat: Çektirme merkezli takılmazsa çektirme işlemine başladığında, çektirme ayağının kayması durumunda el yaralanmalarına neden olabilir.) 3) Çektirme setinde bulunan koruyucu kılıf, çıkarılacak rulman üzerine uygun şekilde sarılır. (Dikkat: Bu koruyucu kılıf takılmadığı durumlarda, çektirmeye uygulanan fazla basınçtan dolayı, rulmanın patlamasına neden olarak ciddi iş kazalarına(el, kol, yüz yaralanmalarına) neden olabilir.) 4) Kullandığımız çektirme hidrolik ise kontrollü bir şekilde basınç verilmeli, kullandığımız çektirme mekanik ise uygun anahtar ile kontrollü bir şekilde sıkma yönünde çevrilir. (Dikkat: Çektirmeye uygulanan basınçtan emin olmalıyız, yüksek basınçlar rulman ve çektirme kırılmalarına neden olarak, parça fırlamalarından dolayı yaralanmalara neden olabilir.) 5) Uyguladığımız basınç rulmanı çıkartmaya yetmiyorsa, rulmana ısıl işlem uygulanmalıdır. (Dikkat: Isıtma işlemini uygularken ısıya dayanıklı eldiven kullanılmalı, kullanılmadığı durumlarda el yanıklarına neden olabilir.) 6) . Çektirme kullanılamayacak durumlarda, rulmana yumuşak dolgu malzemesi ile vurularak çıkartma işlemi yapılır.(Alüminyum veya pirinç mil) (Dikkat: Rulmana sert malzeme ile direkt vurulmaz.(Çekiç, keski, zımba vb. sert malzemeler) Bu sert malzemeler ile birbirine veya rulmana vurma sonucunda kopacak olan parçacıklar el ve yüze saplanma riski oluşturur. Bu durumlarda ciddi iş kazası riski vardır.) 7) Rulmanın takılacağı mil veya yatak uygun zımpara ile temizlenir. (Dikkat: Zımpara ile temizlik yaparken, mil veya yatağın ölçü toleransını bozmamaya dikkat edilir.) 8) Takılacak rulman indüksiyon ile rulmanın bilgi formunda yazılan özelliklere göre ısıtılır. (Dikkat: İndüksiyon ile ısıtma esnasında ısıya dayanıklı eldiven giyilmelidir.) 9) Isınan rulman hızlı bir şekilde ısıya dayanıklı eldiven giyilerek, milin veya yatağın üzerine takılır. (Dikkat: Rulmanı tutma esnasında ısıya dayanıklı eldiven giyilmesi gereklidir, giyilmediği durumda ciddi el yanıklarına yok açabilir.) 10) ısıtılarak rahat bir şekilde takılamayan rulman, plastik rulman çakma seti veya yumuşak dolgu malzemesi ile vurularak takılır. (Dikkat: Plastik rulman çakma setinden rulman ölçüsüne uygun aparat seçilir. Yumuşak dolgu malzemesi kullanılacak durumlarda mutlaka alüminyum veya pirinç olmasına dikkat edilir.)` },

  { id:"MB3SOP4", title:"VİSKOZİTE TEMİZLİK VE BAKIMI TALİMATI", category:"Mekanik Bakım",
    content:`KAPSAM: Viskozite temizlik ve bakım talimatını içerir.
Adımlar: 1) Viskozite kontrol panelinde o - ve o + butonlarına basılarak hortum ve ölçüm tüpüne temiz solvent basılarak hattın temizliğini yapınız. (Dikkat: Hatta kaçak var/yok kontrolü yapılmalıdır. Ekipmansız müdahele etmeyiniz.) 2) Ölçüm misketinin cam tüp içerisinde hareket ettiği gözlemleyiniz. (Dikkat: Misket hareket etmiyosa değiştiriniz.) 3) Tıkanıklık var ise bağlantılar ve valfler sökülerek temizleyin ve toplayınız. (Dikkat: Bu işlem sırasında mutlaka eldiven ve gözlük takınız.) 4) Başlatma butonunu seçiniz. (Dikkat: Doğru butona basınız.) 5) Ölçüm değeri ekranda gözlemleyiniz. (Dikkat: Ölçüm degeri yanlışsa kontrol edilip tamir edilmesi gerekmektedir.) 6) İşlem tamamlandıktan sonra kullanılan solvent ve bez atıklarını uygun atık kutusuna atınız, ekipmanları temizleyip yerine kaldırınız. (Dikkat: Solvent buharına maruz kalmamak için ortamı havalandırınız.)` },

  { id:"MB3SOP5", title:"ZIMPARA TAŞ MOTORU KULLANIMI SOP", category:"Mekanik Bakım",
    content:`KAPSAM: Zımpara taş motoru kullanımı talimatı kapsar.
Adımlar: 1) Çalısmaya başlamadan önce, hangi tip zımpara veya kesme tipi taş motoru ile çalışılıcak ise o taş motorunun göz ile sağlamlık ve genel kontrolünü yapınız. (Dikkat: ENERJİ BESLEME KABLOSU SAĞLAMLIĞI KORUYUCU KAPAK SAĞLAMLIĞI ÇALISTIRMA BUTONLARI SAĞLAMLIĞI VAR İSE AYDINLATMA SİSTEMLERİ SAĞLAMLIĞI ACİL DURDURMA EKİPMANLARI SAĞLAMLIĞI) 2) Koruyucu ekipmanlarınızı takınız. (Dikkat: KORUYUCU GÖZLÜK KORUYUCU UYGUN ELDİVEN YANGIN TÜPÜ YANGIN BATTANİYESİ KULAK KORUYUCU İŞ AYAKKABISI) 3) Eğer sabit zımpara taş makinası ile çalışılacak ise , yapılacak işe uygun taş takılı olduğundan emin olunmalı.Üzerinde hazır durumda takılı taş var ise durumları kontol edilmeli. Eğer seyyar zımpara taş makinası ile çalışılacak ise , yapılacak işe uygun taş montajı yapılmalı ve taşın gevşek olmadığından emin olunmalı. Tüm kişisel koruyucu donanımlar işe başlamadan önce giyilmiş olmalı ,özellikle koruyucu gözlüğün görüşünü bozan kirlilik olmamalı Çalışma ortamı kontrol edilerek ,yanıcı ,parlayıcı ve patlayıcı maddeler ortamdan uzaklaştırılmalı.Eğer gerekli ise yangın tüpü ve yangın battaniyesi hazırlanmalı ve ikinci bir kişiden yardım alınmalı (Dikkat: zımpara kontrol edilmeli.. bilmeyen şahısın elinden alınıp bilen kişi tarafından öğretilmeli.. Yangın oluşan ortamdan uzak durulmalı... üzerindeki taşın kontrol edilmeli.. kırık varsa imha edilmeli..) 4) Tüm önlemlerin alındığından emin isek ,hangi ekipmanı kullanıcaksak o ekipmana enerji verilerek çalıştırılır Yapılacak işin türüne göre , taşlama veya kesme dikkatli bir şekilde yapılır. Sabit zımpara taşında ,çok ufak parçalar kesinlikle el ile veya pense vb.. ekipmanlar ile tutularak işlem yapılmamalıdır. Ancak uygun ekipman ve aparat yardımı ile parça sabitlenerek işlem yapılmalıdır. Seyyar zımpara taşı ile çalışmalarda ,iş parçaları mutlaka sabitlenmeli ,taş motoru iki elle tutulmalıdır (Dikkat: Spiral kullanırken dikkat edilmeli ACELE EDİLMEMELİ.. Spiralden çıkan kıvılcımdan uzak durulmalı tahriş edebilir..) 5) Eğer sabit taş ile çalısıldı ise,çalışma tamamlandıktan sonra , işlem yapılan parça uygun güvenli bir alana bırakılır ve ekipmanın anahtarı yardımı ile enerjisi kesilir. İşlem gören parçanın sıcak olacağı unutulmamalıdır. Eğer seyyar taş ile çalısıldı ise,çalışma tamamlandıktan sonra hemen açma -kapama anahtarından enerjisi kesilmeli ,taş tamamen durmadan ekipman bırakılmamalıdır. Çalışma ortamı temizlenerek bir sonraki çalışma için hazır durumda bırakılmalıdır (Dikkat: Spiral kullanırken durmadan elle temas edilmemeli Baret takılmalı spiral kırılıp parçaları kafana saplanabilir)` },

  { id:"MB3SOP6", title:"410005-411001 SARICI BIÇAK DEĞİŞİMİ SOP", category:"Mekanik Bakım",
    content:`KAPSAM: 410005/411001 sarıcı bıçak değişimi talimatını içerir.
Adımlar: 1) Sarıcı bıçak değişimi öncesinde panellerin üzerinden enerjiyi ve havayı kapat. Enerji kapatıldığında mavi ışık yanarak havanında kapandığını gösterir ve işleme başlanabilir. (Dikkat: Başlamadan önce sarıcılarda kimsenin olmadığından emin ol. Enerjiyi kapatmadan işleme başlama. Enerji varken işlem yaparsan sarıcı tertibatı tetiklenerek ağır yaralanmalara sebep olur.) 2) Ek güvenlik önlemi olarak sarıcı acil stop halatınıda çekerek 2. güvenlik önlemini al. (Dikkat: Güvenlik halatı yeniden kurulmadan makine enerjisi açılamaz.) 3) Bıçak mekanizması önünde bulunan 3 adet 3 numara alyan ile açılan cıvata sökülerek bıçak yerinden çıkarılır ve değiştirilir. (Dikkat: Değişim sırasında kesilmez eldivenini giy.) 4) İşlem tamamlandığında sırayla önce acil stop teli kurulur, sonra sarıcı enerjisi açılı ve artdından hava düğmesine basarak sisteme hava verilir. 5) Yeni bıçağın sabitleme cıvatalarının tork değerine göre sıkıldığını ve gevşek bağlantı olmadığını kontrol edin. (Dikkat: Gevşek bırakılan cıvata, çalışma sırasında bıçağın yerinden çıkmasına ve ciddi yaralanmaya sebep olabilir.)` },

  { id:"MB3SOP7", title:"410001_VSK BIÇAK POZİSYONU TALİMATI", category:"Mekanik Bakım",
    content:`KAPSAM: 4101_VSK bıçak pozisyonu talimatını içerir.
Adımlar: 1) Panelden şifreyi girerek servisi aktif et. ''Para4711''. (Dikkat: Şifre yalnızca yetkili bakım personeli tarafından girilmelidir.) 2) Sayfa 83 git. 3) Kontrol voltajı aç. 4) Sarıcı Tamburu bıçak yukarı (saat 12) gelecek şekilde çevir. 5) Sarıcı Stop butonuna basılı tut ve sayfa 80de ok tuşları ile aşağı inerek “VSK drum Present”i 1 yap ve Entere bas. Enkoder pozisyonu kayıt edilmiş olacak. 6) Kayıt tamamlandıktan sonra kontrol voltajını kapatın ve paneli/servisi normal çalışma moduna alın. (Dikkat: İşlem sonunda servis modunun kapatıldığından emin olunmalıdır, aksi halde makine normal modda çalışmaz.)` },

  { id:"MB3SOP8", title:"HİDROLİK HORTUM-BORU DEĞİŞİMİ SOP", category:"Mekanik Bakım",
    content:`KAPSAM: Hidrolik sistemlerdeki aşınmış/hasarlı hortum ve boruların değiştirilmesi işlemlerini kapsar.
Adımlar: 1) Sistem LOTO-Mekanik SOP'una göre basınçsız hale getirilir; akümülatör (varsa) boşaltılır. 2) Sistem basıncının gerçekten sıfır olduğu manometreden teyit edilir. (Dikkat: Basınçlı hidrolik hortumun sökülmesi ciddi yaralanmaya yol açabilir.) 3) Hasarlı hortum/boru üzerindeki bağlantılar (fitting) sökülür. 4) Sızan yağ için uygun toplama kabı kullanılır, döküntü temizlenir. 5) Yeni hortumun basınç sınıfı ve ölçüsü eskisiyle karşılaştırılır. 6) Yeni hortum/boru bağlanır, bağlantılar uygun tork ile sıkılır. 7) Sistem kademeli olarak basınçlandırılır, düşük basınçta sızıntı kontrolü yapılır. 8) Tam çalışma basıncında fonksiyon testi yapılır. 9) Eski hortum/yağ atıkları uygun şekilde bertaraf edilir. 10) Sonuçlar kayıt formuna işlenir.` },

  { id:"MB3SOP9", title:"HİDROLİK SİLİNDİR BAKIMI SOP", category:"Mekanik Bakım",
    content:`KAPSAM: Hidrolik silindirlerin periyodik bakımı ve sızdırmazlık kontrolü işlemlerini kapsar.
Adımlar: 1) Sistem LOTO-Mekanik SOP'una göre basınçsız hale getirilir. 2) Silindir gövdesi ve mil yüzeyi hasar/çizik yönünden kontrol edilir. (Dikkat: Çizik mil yüzeyi sızıntıya yol açar.) 3) Silindir bağlantı noktalarında sızıntı kontrol edilir. 4) Keçe/conta (seal) aşınması kontrol edilir, gerekiyorsa değiştirilir. 5) Silindir sökülecekse mekanik destek (askı/blok) ile sabitlenir. (Dikkat: Kontrolsüz düşme riski taşır.) 6) Keçe değişimi üretici talimatına uygun sırayla yapılır. 7) Silindir yeniden monte edilir, bağlantılar sıkılır. 8) Sistem kademeli basınçlandırılır, sızıntı ve hareket testi yapılır. 9) Sonuçlar kayıt formuna işlenir.` },

  { id:"EMB3SOP1", title:"450017 (EBEAM) SELOFAN TESTİ SOP", category:"Elektrik & Mekanik Bakım",
    content:`KAPSAM: 450017 Selofan testi SOP içerir.
Adımlar: 1) Gerekli Ekipmanlar: •Karton şablonlar (2 adet gereklidir, aşağıya bakınız) •Renkli selofan (Şekil 2) ESI parça no: 990120 •Makas •Maskeleme bandı 2) 1. Pencere açıklığının uzunluğunu dikkatlice bir mezura ile ölçün. Bu işlemi yaparken folyoyu delme ihtimaline karşı çok dikkatli olun. Pencere açıklığınız şu ölçülerden biri olacaktır: o 71 inç (180 cm) o 60 inç (152 cm) o 54 inç (137 cm) o 48 inç (122 cm) o 42 inç (107 cm) o 36 inç (91 cm) 3) 2.Açıklığın genişliğini ölçün. Çoğu durumda pencere açıklığının genişliği 3 inç (7,6 cm) olacaktır. 4) 3.Daha önce ölçtüğünüz boyutlara göre birkaç karton parçası kesin ve bunları maskeleme bandı ile birbirine yapıştırın.Bu, daha sağlam bir şablon elde etmek için yapılır. İki (2) şablon oluşturacak kadar karton kesin. (Bkz. Şekil 1) 5) 4.Karton parçalarını üst üste koyarak her bir şablonun kalınlığını yaklaşık 3/8 inç (9 mm) yapın. 6) 5.Maskeleme bandı kullanarak karton parçalarını birbirine bantlayın ve iki ayrı şablonu tamamlayın. (Bkz. Şekil 1)` },

  { id:"EMB3SOP10", title:"KAÇIŞ YOLU VE ACİL ÇIKIŞ KAPILARI KONTROLÜ SOP", category:"Elektrik & Mekanik Bakım",
    content:`KAPSAM: Fabrika kaçış yolları ve acil çıkış kapılarının periyodik kontrolü işlemlerini kapsar.
Adımlar: 1) Kaçış yolları güzergahı boyunca engel (malzeme, palet vb.) bulunmadığı kontrol edilir. (Dikkat: Engel tahliye sırasında ciddi risk oluşturur.) 2) Acil çıkış kapılarının kilitli olmadığı, panik bar/itmeli açma mekanizmasının çalıştığı kontrol edilir. 3) Kaçış yolu aydınlatması (acil aydınlatma armatürleri) çalışır durumda olduğu kontrol edilir. 4) Yönlendirme levhaları (yeşil kaçış işaretleri) görünür ve okunaklı olduğu kontrol edilir. 5) Acil çıkış kapılarının dışarıya doğru açıldığı kontrol edilir. 6) Toplanma alanı işaretlemesi ve erişim yolu kontrol edilir. 7) Tespit edilen engel/arıza derhal giderilir veya bakım talebi açılır. 8) Kontrol sonuçları kayıt formuna işlenir.` },

  { id:"EMB3SOP11", title:"SICAK ÇALIŞMA (KAYNAK-KESME-TAŞLAMA) İZİN PROSEDÜRÜ VE YANGIN ÖNLEMLERİ SOP", category:"Elektrik & Mekanik Bakım",
    content:`KAPSAM: Çorlu fabrikası teknik bakım biriminde kaynak, kesme, taşlama, lehim gibi kıvılcım/alev/yüksek ısı üreten "sıcak çalışma" faaliyetleri öncesinde alınması gereken izin ve yangın önleme tedbirlerini kapsar.
Adımlar: 1) Sıcak çalışma yapılacak alan ve iş tanımı belirlenir; "Sıcak Çalışma İzin Formu" ilgili amir/İSG sorumlusu tarafından doldurulup onaylanır. (Dikkat: Yanıcı/patlayıcı ortam (solvent, gaz, toz) riski olan alanlarda (örn. solvent recovery, baskı/laminasyon hatları) izin öncesi gaz ölçümü yapılmalıdır.) 2) Çalışma alanının 10 metre yarıçapındaki çevresinde bulunan tüm yanıcı/parlayıcı malzemeler (kağıt, karton, solvent, yağ, plastik film vb.) uzaklaştırılır veya yanmaz örtü ile kapatılır. 3) Çalışma alanının altında/yanında başka katlar veya bölümler varsa, kıvılcım sıçraması ihtimaline karşı o bölgeler de kontrol edilir ve gerekirse yanmaz perde/örtü ile korunur. 4) Uygun yangın söndürme cihazı (en az 1 adet, ilgili sınıfa uygun) çalışma alanında hazır bulundurulur. 5) Ortam gaz ölçümü yapılır (özellikle kapalı alan veya yanıcı buhar riski olan bölgelerde); patlayıcı ortam (LEL) sınırının altında olduğu teyit edilir. (Dikkat: Gaz ölçümü sonucu %10 LEL üzerindeyse çalışmaya kesinlikle başlanmamalıdır.) 6) Sıcak çalışma ekipmanı (kaynak makinesi, oksi-gaz tüpleri, taşlama motoru) güvenlik kontrolünden geçirilir (kablo/hortum hasarı, geri tepme valfi, topraklama vb.). 7) Çalışma sırasında bir gözcü (yangın gözcüsü) görevlendirilir; gözcü çalışma boyunca ve iş bitiminden sonra en az 30 dakika alanda kalarak yangın riskini izler. (Dikkat: Gözcü, sıcak çalışmayı yapan kişiden farklı biri olmalı ve başka bir işle görevlendirilmemelidir.) 8) Sıcak çalışma gerçekleştirilir; çalışma sırasında periyodik olarak çevredeki yanıcı malzemeler ve kıvılcım sıçrama alanı kontrol edilir. 9) İş bitiminde ekipman kapatılır, tüpler (kullanıldıysa) vanalarından kapatılır; çalışma alanı ve çevresi tekrar kontrol edilir. 10) Gözcü, iş bitiminden sonra en az 30 dakika boyunca alanı gözlemleyerek gizli yanma/kor kalmadığını teyit eder; izin formu kapatılır.` },

  { id:"EMB3SOP2", title:"ARIZA TABLETİ KULLANIM TALİMATI", category:"Elektrik & Mekanik Bakım",
    content:`KAPSAM: Arıza tableti kullanım talimatını kapsar.
Adımlar: 1) Sap ikonuna basılır.Teslim alınacak arızanın üzerine tıklanır. (Dikkat: Doğru arızaya girdiğinden emin olun..) 2) Teyit tipi seç seçilir. (Dikkat: doğru teyit seçmek) 3) İşi üstlendim seçilir boş kutu okeylenir. (Dikkat: doğru teyit verdiğini kontrol etmek.) 4) Teyit ver seçilir. 5) İşe başladım seçilir boş kutu okeylenir 6) Barkot yazısının yanındaki simgeye tıklanır ve barkot okutulur.Kameraya barkotu tutarak barkot okutulup teyit ver seçilir. 7) Kapatılacak arıza seçilir. Teyit tipi seç butonuna tıklanır 8) pozitif kapatma seçeneğine tıklanır. Teyit ver seçilir 9) Makine bölgesi seçilir. 10) Teyit metni'nin yanına müdahele yazılır,kaydet butonuna basılır.` },

  { id:"EMB3SOP3", title:"KUMPAS KULLANIMI SOP", category:"Elektrik & Mekanik Bakım",
    content:`KAPSAM: Kumpas kullanımı talimatı SOP içerir.
Adımlar: 1) Kumpasın gövdesini ve çenelerini kontrol et → Eğilme, kir, yağ olmamalı. Çeneleri tamamen kapat → Aralık varsa kumpas ayarsız olabilir. Dijital kumpas ise “ZERO” tuşuna bas → 0.00 mm olmalı. Mekanik/verniyer kumpas ise sıfır çizgilerinin aynı hizada olduğundan emin ol. 2) Dış Çap Ölçümü (Parça Dışından) Dış çeneleri aç. Ölçülecek parçayı çeneler arasına yerleştir. Çeneleri yavaşça kapat → Parçayı sıkmadan temas ettir. Dijital ekran değerini veya verniyer çizgilerini oku. Aynı ölçümü 2–3 kez tekrar et → Fark varsa ortalama alın. 3) İç Çap Ölçümü (Delik İçinden), İç çeneleri deliğe yerleştir. Çeneleri yavaşça aç → İç yüzeylere dayanmalı. Kumpası delik içinde hafif döndür → En büyük değeri bul. Dijital/verniyer değeri oku. 4) Derinlik Ölçümü Kumpası yüzeye dik şekilde konumlandır. Derinlik çubuğunu deliğe indir. Tabanın yüzeye tam oturduğundan emin ol. Ekrandaki/verniyer çizgisindeki değeri oku. 5) Adım (Basamak) Ölçümü Kumpasın arka tarafındaki adım ölçme yüzeyi kullanılır. Kumpası iki basamak arasına yerleştir. Kaydırarak temas ettir ve değeri oku. 6) Ölçüm Kuralları Kumpası dik tut, açı ile ölçüm yapılmaz. Çenelerde çapak, yağ, kir varsa → ölçüm hatalı çıkar. Parça sıcaksa (fırından, sürtünmeden, yeni üretim) → Metal genleşir, ölçüm sapar. Aynı noktayı en az 2–3 kez ölçerek doğrulama yap. Kumpası saklarken çeneleri kapalı bırak, darbe alacak şekilde bırakma.` },

  { id:"EMB3SOP4", title:"NOVAFLEX VE MİRAFLEX YANAŞMA KALİBRASYONU TALİMATI", category:"Elektrik & Mekanik Bakım",
    content:`KAPSAM: Novaflex ve miraflex yanaşma kalibrasyonu talimatını içerir.
Adımlar: 1) Ana sayfada ilgili ünite format silindir değeri değiştirilir.Ana sayfada ilgili ünite sıfır sürüş (deck out) pozisyonuna alınır.350. sayfaya gidilir.Deck no kutusuna Kalibrasyonu yapılacak ünite numarası girilir 2) Format ve Aniloks için değerleri bu sayfadaki kutulara yaz.Eğer kalibrasyon için kalibrasyon burcu kullanılacaksa bu değerler novoflex için Format silindir değeri: 96,481 Anilox değeri: 78,037 Miraflex için: Format silindir değeri: 96,481 Anilox değeri: 68,495 3) Bu değerlerin hesaplanması: Novoflex için 108,342 (Format silindir çapı)/2 + 42.31(kalibrasyon burcu çapı) = 96.481 156,074 (Anilox şaftının çapı)/2 =78,037 4) Miraflex için 108,342 (Format silindir çapı)/2 + 42.31 (kalibrasyon burcu çapı) = 96,481 136,990 (Anilox şaftının çapı)/2 =68,495 (Dikkat: Eğer kalibrasyon burcu yerine başka bir burç kullanılacaksa formülde bu burcun çapı yerine yazılır ve değerler yeniden hesaplanır.) 5) Plate cylinder tuşuna bas ve çıkan ekranda ok tuşuna bas. 6) Calibration mode tuşuna bas ve çıkan ekranda ok tuşuna bas. Ünite rengi önce pembe sonra sarı olacak. Sarı olduktan sonra kalibrasyona hazır demektir. 7) Kalibrasyon burcu, format silindir ile tambur arasına hem sağ tarafta hem sol tarafta elle tatlı sıkı girene kadar ünite ayarı yapılır. (830013 için bu ayardan sonra paralel modda makro açık değilken 6 kere üniteyi ileri verilir) 8) Deck out tuşuna bas (alarm çalacaktır.)(Ünite yeşil olacaktır.) 9) Anilox roll tuşuna bas ve çıkan ekranda ok tuşuna bas. 10) Calibtation mode tuşuna bas ve çıkan ekranda ok tuşuna bas. Ünite rengi önce pembe sonra sarı olacak. Sarı olduktan sonra kalibrasyona hazır demektir. 11) Kalibrasyon burcu, aniloks ile format silindir arasına hem sağ tarafta hem sol tarafta elle tatlı sıkı girene kadar ünite ayarı yapılır. (830013 için bu ayardan sonra paralel modda makro açık değilken 6 kere üniteyi ileri verilir) 12) Deck out tuşuna bas (alarm çalacaktır.) Ünite yeşil olacaktır. Kalibrasyon işlemi tamamlanmıştır.` },

  { id:"EMB3SOP5", title:"YÜKSEKTE ÇALIŞMA GÜVENLİK TALİMATI SOP", category:"Elektrik & Mekanik Bakım",
    content:`KAPSAM: Çorlu fabrikası teknik bakım biriminde zeminden yüksekte yapılan her çalışma (platform, iskele, merdiven, çatı vb.) yüksekte çalışma olarak nitelendirilir; bu çalışmalar öncesinde alınması gereken güvenlik tedbirlerini kapsar.
