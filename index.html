Adımlar: 1) Yükseklikte çalışma planlanır; düşme riskinin ortadan kaldırılıp kaldırılamayacağı (örn. yerden yapılabilecek alternatif yöntem) değerlendirilir. (Dikkat: Mümkünse yükseklikte çalışma ihtiyacını ortadan kaldıran yöntemler (uzatmalı ekipman, yerden erişim vb.) önceliklendirilmelidir.) 2) Kullanılacak ekipman (iskele, seyyar platform, merdiven, yaşam hattı) belirlenir; periyodik muayene/kontrol etiketinin güncel olduğu kontrol edilir. (Dikkat: Muayene süresi geçmiş veya hasarlı iskele/platform/merdiven kullanılmamalıdır.) 3) Çalışma alanının altı ve çevresi bariyer/şerit ile çevrilir; altından geçiş engellenir. 4) İskele/platform kurulumu, yetkili ve eğitimli personel tarafından yapılır; kurulum sonrası stabilite, korkuluk, toe-board (eteklik) kontrolü yapılır. 5) Düşmeyi önleyici sistem (korkuluk) yoksa, düşmeyi durduran sistem (tam vücut emniyet kemeri + enerji sönümleyici halat + sabit ankraj noktası) kullanılır. (Dikkat: Emniyet kemeri kancası, sadece üretici tarafından onaylanmış sağlam bir ankraj noktasına bağlanmalıdır; korkuluğa veya boru hattına bağlamak uygun değildir.) 6) Merdiven kullanılıyorsa, merdiven sağlam bir zemine, uygun açıyla (yatay:dikey ≈ 1:4) yerleştirilir ve üst noktadan sabitlenir. (Dikkat: Merdiven üzerinde iki elin de serbest olmasını gerektiren ağır iş yapılmamalı, alet çantası/kemer kullanılmalıdır.) 7) Rüzgar hızı, yağış gibi hava koşulları kontrol edilir; olumsuz hava koşullarında çalışma ertelenir. 8) Yüksekte çalışma tek başına yapılmaz; aşağıda bir gözcü/yardımcı personel bulundurulur ve iletişim (telsiz/görsel) sağlanır. (Dikkat: Yalnız başına yüksekte çalışma kesinlikle yasaktır.) 9) Çalışma sırasında alet/malzeme düşmesini önlemek için alet kayışı/torbası kullanılır; aşağıda çalışan/geçen personel olmadığı teyit edilir. 10) Çalışma tamamlanır; ekipman (iskele, platform) sökülür veya güvenli konuma alınır, bariyerler kaldırılır.` },

  { id:"EMB3SOP6", title:"430003 YAN REGİSTER KALİBRASYON SOP", category:"Elektrik & Mekanik Bakım",
    content:`KAPSAM: 430003 yan register kalibrasyon talimatını içerir.
Adımlar: 1) Yansıtıcı aynaların, her baskı ünitesinde (PU) traversin son konumundan en az 10 cm uzakta yerleştirildiğinden emin olun. 2) “Servis menüsü” sayfasını açın ve W&H servis şifresini girin: 05481-14-2649 3) “571 Tracking” sayfasını açın ve ilgili PU’yu seçin; travers yolunun serbest olduğundan emin olun. 4) Otomatik referanslama modunu başlatmak için yeşil renkle vurgulanmış olan “Referencing” tuşuna basın. 5) Hareket sırasında, mevcut travers konumu “status.s” satırında gözlemlenebilir. 6) Referanslama sırasında, pozitif ve negatif travers limitlerine yaklaşılır. Sonrasında travers, yaklaşık +/-20 artımlık toleransla “Merkez” konumunda durur. 7) PU için travers referanslaması tamamlanmıştır.` },

  { id:"EMB3SOP7", title:"EMNİYET KEMERİ VE DÜŞME ÖNLEME EKİPMANLARI PERİYODİK MUAYENE SOP", category:"Elektrik & Mekanik Bakım",
    content:`KAPSAM: Tam vücut emniyet kemeri, halat, karabina gibi düşme önleme ekipmanlarının periyodik muayenesi işlemlerini kapsar.
Adımlar: 1) Ekipman kullanım öncesi ve periyodik olarak (üretici talimatına göre, genelde yılda bir) muayene edilir. 2) Kemer kayışlarında kesik, aşınma, kimyasal hasar, UV bozulması yönünden kontrol edilir. 3) Dikişlerde sökülme/kopma olup olmadığı kontrol edilir. 4) Metal parçalar (toka, D-halka, karabina) korozyon/deformasyon yönünden kontrol edilir. 5) Enerji sönümleyici (shock absorber) etiketinin okunaklı ve aktive olmamış olduğu kontrol edilir. 6) Halat/yaşam hattı aşınma ve hasar yönünden kontrol edilir. 7) Hasarlı/şüpheli bulunan ekipman derhal kullanım dışı bırakılıp imha edilir. (Dikkat: Hasarlı ekipmanla çalışma ciddi düşme riski taşır.) 8) Muayene sonuçları (ekipman no, tarih, sonuç) kayıt formuna işlenir, bir sonraki muayene tarihi takvime eklenir.` },

  { id:"EMB3SOP8", title:"KAPALI ALANDA ÇALIŞMA İZİN VE GÜVENLİK PROSEDÜRÜ SOP", category:"Elektrik & Mekanik Bakım",
    content:`KAPSAM: Çorlu fabrikası teknik bakım biriminde tank, silo, kuyu, kanal, kapalı tesisat vb. kapalı/sınırlı alanlarda (confined space) yapılacak çalışmalar öncesinde alınması gereken izin ve güvenlik tedbirlerini kapsar.
Adımlar: 1) Kapalı alan çalışması planlanır; "Kapalı Alanda Çalışma İzin Formu" ilgili amir/İSG sorumlusu tarafından doldurulup onaylanır. (Dikkat: Kapalı alan; sınırlı giriş-çıkışı olan, sürekli insan bulunması için tasarlanmamış ve tehlikeli atmosfer oluşabilecek her türlü alanı (tank, silo, kanal, çukur vb.) kapsar.) 2) Kapalı alanla bağlantılı tüm enerji kaynakları (elektrik, mekanik, boru hatları) LOTO prosedürüne göre izole edilir. (Dikkat: Kapalı alana sıvı/gaz/toz girişini sağlayan tüm hatlar (besleme, tahliye) kör tapa (blind) ile ayrılmalı; sadece vana kapatmak yeterli değildir.) 3) Alan içindeki artık malzeme/madde boşaltılır, gerekiyorsa temizlenir ve havalandırılır. 4) Giriş öncesi ortam atmosfer testi yapılır: Oksijen (%19,5-23,5 aralığında), yanıcı gaz (LEL), toksik gaz (H2S, CO vb.) seviyeleri ölçülür. (Dikkat: Oksijen seviyesi %19,5'in altındaysa veya LEL %10'un üzerindeyse girişe kesinlikle izin verilmemelidir.) 5) Sürekli mekanik havalandırma sağlanır (gerekiyorsa); çalışma boyunca atmosfer sürekli/periyodik olarak izlenir. 6) Alan dışında bir gözcü (attendant) görevlendirilir; gözcü, çalışma boyunca alanı terk etmez ve içeridekilerle sürekli iletişim halinde kalır. (Dikkat: Gözcü, acil durumda içeri girmeden önce kurtarma ekibini çağırmalıdır; kendisi asla tek başına içeri girmemelidir.) 7) Kurtarma ekipmanı (emniyet kemeri/tripod-vinç sistemi, iletişim cihazı) hazır bulundurulur. 8) Çalışanlar uygun KKD ile (gerekiyorsa solunum cihazı) alana giriş yapar; giriş-çıkış saatleri izin formuna kaydedilir. 9) Çalışma tamamlanır, tüm personel ve ekipmanın alandan çıktığı teyit edilir; alan güvenli hale getirilir (kapaklar kapatılır, uyarı işaretleri kaldırılır). 10) İzolasyonlar (LOTO, kör tapa) kaldırılır, ekipman normale döndürülür; izin formu kapatılır.` },

  { id:"EMB3SOP9", title:"KALDIRMA EKİPMANLARI GÜVENLİ KULLANIM KONTROLÜ SOP", category:"Elektrik & Mekanik Bakım",
    content:`KAPSAM: Çorlu fabrikası teknik bakım biriminde vinç, forklift, zincirli kaldıraç, sapan, kancalı kaldırma ekipmanları gibi kaldırma araçlarının kullanım öncesi güvenlik kontrolünü kapsar.
Adımlar: 1) Kullanılacak kaldırma ekipmanı (vinç, forklift, zincirli kaldıraç, sapan vb.) belirlenir; kaldırılacak yükün ağırlığı ve boyutları tespit edilir. (Dikkat: Ekipmanın kapasitesi (SWL - Safe Working Load), kaldırılacak yükün ağırlığından fazla olmalıdır; kapasiteyi aşan yük kesinlikle kaldırılmamalıdır.) 2) Ekipmanın periyodik muayene/kontrol etiketinin güncel olduğu kontrol edilir. (Dikkat: Muayene süresi geçmiş ekipman kullanılmamalıdır; yasal periyodik kontrol (yılda en az 1 kez) zorunludur.) 3) Görsel kontrol yapılır: halat/zincirlerde kopma, aşınma, deformasyon; kancada çatlak, açılma; sapanlarda yıpranma olup olmadığı incelenir. (Dikkat: Hasarlı/aşınmış ekipman derhal hizmet dışı bırakılmalı ve etiketlenmelidir ("Kullanıma Uygun Değildir").) 4) Kaldırma alanının altı ve çevresi bariyer/şerit ile çevrilir; yük altında/geçiş güzergahında kimsenin bulunmadığı teyit edilir. 5) Yük, sapan/kanca ile dengeli şekilde bağlanır; ağırlık merkezi kontrol edilir. (Dikkat: Yük çapraz veya dengesiz bağlanmamalı, kaldırma sırasında kayma/devrilme riski değerlendirilmelidir.) 6) Kaldırma işlemi yavaş ve kontrollü şekilde başlatılır; yük yerden birkaç santim kaldırılarak dengesi test edilir (test kaldırması). (Dikkat: Dengesizlik/anormal ses tespit edilirse yük derhal indirilmeli, kaldırma durdurulmalıdır.) 7) Yük, güvenli hızda ve belirlenen güzergahtan taşınır; operatör görüş alanı kısıtlıysa bir yönlendirici (signalman) görevlendirilir. 8) Yük hedef noktaya indirilir, sapan/kanca yükten dikkatlice çıkarılır. 9) İşlem sonrası ekipman güvenli konumuna alınır (park/asma), varsa enerjisi kesilir.` },

    {q:"YT1SOP37 prosedüründe 15. adımda ne yapılır?", o:["Otomatik transfer switch (ATS) fonksiyonu (varsa) şebeke kesintisi simülasyonu ile test edilir.", "Jeneratöre start verilip 15 dakika boşta çalıştırılır; çalışma sırasında yağ basıncı, su sıcaklığı, gerilim (V) ve frekans (Hz) göstergeleri ile panel…", "Hava filtresi kirlilik göstergesi (varsa) kontrol edilir.", "Çalışma saati sayacı (hour meter) okunarak kayıt formuna işlenir."], c:0},
    {q:"YT1SOP37 prosedüründe 13. adımda ne yapılır?", o:["Çalıştırma işlemi bitince AUTO moda alınır.", "Etraf tekrar kontrol edilip kaçak kontrolü yapılır; jeneratör odası havalandırma menfezlerinin açık, yangın söndürücünün yerinde ve dolu olduğu teyit edilir.", "Radyatör temizliği ve V kayışı gerginliği/çatlak durumu kontrol edilir.", "Rezistans ısıtmaları kontrol edilir."], c:1},

    {q:"YT1SOP37 prosedüründe 17. adımda ne yapılır?", o:["Yakıt filtresi/su ayırıcısından periyodik su tahliyesi yapılır (aylık bakım planında belirtilen haftalarda).", "Etraf tekrar kontrol edilip kaçak kontrolü yapılır; jeneratör odası havalandırma menfezlerinin açık, yangın söndürücünün yerinde ve dolu olduğu teyit edilir.", "Test süresi boyunca egzoz/gürültü seviyesi ve sızıntı kontrolü yapılır.", "Yağ seviyesi çubuktan (dipstick) kontrol edilir; seviye MIN-MAX aralığının altındaysa tamamlanır."], c:2},
    {q:"YT1SOP37 SOP'unun kapsamı nedir?", o:["Su yumuşatma (softener) sisteminin periyodik bakımı ve rejenerasyon işlemlerini kapsar.", "Teknik Bakım personelinin yardımcı tesislerde yüksekte yapılacak çalışmalarını içerir.", "Kompresör, pompa veya hidrolik/pnömatik silindirlerdeki pistonların arıza nedeniyle değiştirilmesi işlemlerini kapsar.", "Dizel jeneratörün ihtiyaç anında sorunsuz çalışabilmesi için haftalık rutin çalıştırma kontrolünü ve periyodik yük/ATS testini kapsar. Jeneratör, jeneratör…"], c:3},

  "MB3SOP14": [
    {q:"MB3SOP14 SOP'unun kapsamı nedir?", o:["Bu prosedürün amacı, pens ampermetre (clamp meter) ile elektrik devrelerinde temassız akım ölçümünün güvenli ve doğru şekilde yapılmasını sağlamaktır.", "Fabrika kaçış yolları ve acil çıkış kapılarının periyodik kontrolü işlemlerini kapsar.", "Soğutma kulesinin periyodik bakım ve kontrolünü kapsar.", "Çorlu fabrikası teknik bakım biriminde dönen/hareketli mekanik ekipmanlar (motor, pompa, konveyör, redüktör vb.) üzerinde yapılacak bakım/onarım çalışmaları…"], c:3},
    {q:"MB3SOP14 prosedüründe 9. adımda ne yapılır?", o:["Çalışma tamamlandıktan sonra alan temizlenir, tüm koruyucu kapak/siperlikler yerine takılır, mekanik destekler (blok, pim) çıkarılır.", "Ekipman üzerindeki tüm enerji kaynakları tespit edilir: elektrik beslemesi, basınçlı hava/hidrolik hat, yaylı/ağırlık kaynaklı potansiyel enerji, dönen…", "Bakım/onarım çalışması gerçekleştirilir.", "Basınçlı hava/hidrolik besleme vanaları kapatılır, kilitlenir; hat üzerindeki basınç tahliye (bleed) vanası açılarak sistemdeki artık basınç boşaltılır."], c:2},
    {q:"MB3SOP14 prosedüründe 11. adımda ne yapılır?", o:["Dönen kütleler (volan, rulo vb.) varsa, tamamen durduğu ve serbest dönmeyeceği teyit edilir; gerekiyorsa mekanik fren/blokaj uygulanır.", "Çalışma tamamlandıktan sonra alan temizlenir, tüm koruyucu kapak/siperlikler yerine takılır, mekanik destekler (blok, pim) çıkarılır.", "Kilit ve etiketler yalnızca takan kişi tarafından çıkarılır; tüm personelin güvenli mesafede olduğu teyit edildikten sonra enerji sırasıyla (mekanik → basınçlı…", "Yerçekimi/yay etkisiyle hareket edebilecek parçalar (askıda yük, gergin yay, kaldırılmış tabla vb.) mekanik destek (blok, pim, emniyet çubuğu) ile sabitlenir."], c:2},
    {q:"MB3SOP14 - 4. adımla ilgili nelere dikkat edilmelidir?", o:["Şifre yalnızca yetkili bakım personeli tarafından girilmelidir.", "Başlamadan önce sarıcılarda kimsenin olmadığından emin ol. Enerjiyi kapatmadan işleme başlama. Enerji varken işlem yaparsan sarıcı tertibatı tetiklenerek ağır…", "Basınç göstergesinin (manometre) sıfırı gösterdiği teyit edilmeden hatta müdahale edilmemelidir.", "Kontrolsüz düşme riski taşır."], c:2},
    {q:"MB3SOP14 prosedüründe 4. adımda ne yapılır?", o:["Ekipman normal durdurma prosedürüne göre durdurulur; hareketli parçaların tamamen durduğu gözle/kulakla teyit edilir.", "Basınçlı hava/hidrolik besleme vanaları kapatılır, kilitlenir; hat üzerindeki basınç tahliye (bleed) vanası açılarak sistemdeki artık basınç boşaltılır.", "Yerçekimi/yay etkisiyle hareket edebilecek parçalar (askıda yük, gergin yay, kaldırılmış tabla vb.) mekanik destek (blok, pim, emniyet çubuğu) ile sabitlenir.", "Dönen kütleler (volan, rulo vb.) varsa, tamamen durduğu ve serbest dönmeyeceği teyit edilir; gerekiyorsa mekanik fren/blokaj uygulanır."], c:1},
    {q:"\"MEKANİK EKİPMANDA BAKIM ÖNCESİ ENERJİ İZOLASYONU (LOTO) SOP\" prosedürünün doküman kodu nedir?", o:["MB3SOP14", "MB3SOP21", "MB3SOP20", "MB3SOP15"], c:0},
    {q:"MB3SOP14 prosedüründe 6. adımda ne yapılır?", o:["Sıfır enerji durumu (try-out) test edilir: ekipmanın çalıştırma butonuna basılarak hareket etmediği, basınçlı hatta kalıntı basınç olmadığı doğrulanır.", "Elektrik beslemesi kesilir, kilitlenir ve etiketlenir (LOTO - Elektrik SOP'una göre).", "Yerçekimi/yay etkisiyle hareket edebilecek parçalar (askıda yük, gergin yay, kaldırılmış tabla vb.) mekanik destek (blok, pim, emniyet çubuğu) ile sabitlenir.", "Dönen kütleler (volan, rulo vb.) varsa, tamamen durduğu ve serbest dönmeyeceği teyit edilir; gerekiyorsa mekanik fren/blokaj uygulanır."], c:3},
    {q:"MB3SOP14 prosedüründe 1. adımda ne yapılır?", o:["Yerçekimi/yay etkisiyle hareket edebilecek parçalar (askıda yük, gergin yay, kaldırılmış tabla vb.) mekanik destek (blok, pim, emniyet çubuğu) ile sabitlenir.", "Çalışma tamamlandıktan sonra alan temizlenir, tüm koruyucu kapak/siperlikler yerine takılır, mekanik destekler (blok, pim) çıkarılır.", "Kilit ve etiketler yalnızca takan kişi tarafından çıkarılır; tüm personelin güvenli mesafede olduğu teyit edildikten sonra enerji sırasıyla (mekanik → basınçlı…", "Ekipman üzerindeki tüm enerji kaynakları tespit edilir: elektrik beslemesi, basınçlı hava/hidrolik hat, yaylı/ağırlık kaynaklı potansiyel enerji, dönen…"], c:3},

    {q:"MB3SOP3 prosedüründe 3. adımda ne yapılır?", o:["Isınan rulman hızlı bir şekilde ısıya dayanıklı eldiven giyilerek, milin veya yatağın üzerine takılır.", "Değişimi yapılacak rulmanı çıkarmaya başlamadan önce İSG nin uygun gördüğü kesilmeye dayanıklı eldivenini giy. ve iş güvenliği gözlüğünü tak.", "Çektirme setinde bulunan koruyucu kılıf, çıkarılacak rulman üzerine uygun şekilde sarılır.", "ısıtılarak rahat bir şekilde takılamayan rulman, plastik rulman çakma seti veya yumuşak dolgu malzemesi ile vurularak takılır."], c:2},

    {q:"EMB3SOP4 prosedüründe 7. adımda ne yapılır?", o:["Format ve Aniloks için değerleri bu sayfadaki kutulara yaz.Eğer kalibrasyon için kalibrasyon burcu kullanılacaksa bu değerler novoflex için Format silindir…", "Miraflex için 108,342 (Format silindir çapı)/2 + 42.31 (kalibrasyon burcu çapı) = 96,481 136,990 (Anilox şaftının çapı)/2 =68,495", "Kalibrasyon burcu, format silindir ile tambur arasına hem sağ tarafta hem sol tarafta elle tatlı sıkı girene kadar ünite ayarı yapılır. (830013 için bu ayardan…", "Calibration mode tuşuna bas ve çıkan ekranda ok tuşuna bas. Ünite rengi önce pembe sonra sarı olacak. Sarı olduktan sonra kalibrasyona hazır demektir."], c:2},

    {q:"EMB3SOP4 - 4. adımla ilgili nelere dikkat edilmelidir?", o:["Kapalı alana sıvı/gaz/toz girişini sağlayan tüm hatlar (besleme, tahliye) kör tapa (blind) ile ayrılmalı; sadece vana kapatmak yeterli değildir.", "Yük çapraz veya dengesiz bağlanmamalı, kaldırma sırasında kayma/devrilme riski değerlendirilmelidir.", "Kapalı alan; sınırlı giriş-çıkışı olan, sürekli insan bulunması için tasarlanmamış ve tehlikeli atmosfer oluşabilecek her türlü alanı (tank, silo, kanal, çukur…", "Eğer kalibrasyon burcu yerine başka bir burç kullanılacaksa formülde bu burcun çapı yerine yazılır ve değerler yeniden hesaplanır."], c:3},

  "EMB3SOP5": [

    {q:"EMB3SOP5 - 6. adımla ilgili nelere dikkat edilmelidir?", o:["Merdiven üzerinde iki elin de serbest olmasını gerektiren ağır iş yapılmamalı, alet çantası/kemer kullanılmalıdır.", "Ekipmanın kapasitesi (SWL - Safe Working Load), kaldırılacak yükün ağırlığından fazla olmalıdır; kapasiteyi aşan yük kesinlikle kaldırılmamalıdır.", "Eğer kalibrasyon burcu yerine başka bir burç kullanılacaksa formülde bu burcun çapı yerine yazılır ve değerler yeniden hesaplanır.", "Muayene süresi geçmiş ekipman kullanılmamalıdır; yasal periyodik kontrol (yılda en az 1 kez) zorunludur."], c:0},
    {q:"EMB3SOP5 prosedüründe 2. adımda ne yapılır?", o:["Çalışma tamamlanır; ekipman (iskele, platform) sökülür veya güvenli konuma alınır, bariyerler kaldırılır.", "Merdiven kullanılıyorsa, merdiven sağlam bir zemine, uygun açıyla (yatay:dikey ≈ 1:4) yerleştirilir ve üst noktadan sabitlenir.", "Çalışma alanının altı ve çevresi bariyer/şerit ile çevrilir; altından geçiş engellenir.", "Kullanılacak ekipman (iskele, seyyar platform, merdiven, yaşam hattı) belirlenir; periyodik muayene/kontrol etiketinin güncel olduğu kontrol edilir."], c:3},

    {q:"EMB3SOP5 prosedüründe 9. adımda ne yapılır?", o:["Yükseklikte çalışma planlanır; düşme riskinin ortadan kaldırılıp kaldırılamayacağı (örn. yerden yapılabilecek alternatif yöntem) değerlendirilir.", "Çalışma sırasında alet/malzeme düşmesini önlemek için alet kayışı/torbası kullanılır; aşağıda çalışan/geçen personel olmadığı teyit edilir.", "Düşmeyi önleyici sistem (korkuluk) yoksa, düşmeyi durduran sistem (tam vücut emniyet kemeri + enerji sönümleyici halat + sabit ankraj noktası) kullanılır.", "İskele/platform kurulumu, yetkili ve eğitimli personel tarafından yapılır; kurulum sonrası stabilite, korkuluk, toe-board (eteklik) kontrolü yapılır."], c:1},

/* ---------------- Storage helpers ----------------
   claude.ai artifact ortamında window.storage kullanılır (ortak/paylaşılan).
   Bağımsız barındırmada (GitHub Pages vb.) window.storage yoktur; bu durumda
   localStorage'a otomatik düşülür. NOT: localStorage yalnızca o cihaz/tarayıcıya
   özeldir - farklı telefonlar birbirinin verisini göremez. Cihazlar arası ortak
   sonuç takibi için Google Sheets webhook desteği aşağıda ayrıca eklenmiştir. */
const HAS_ARTIFACT_STORAGE = (typeof window.storage !== 'undefined');

async function storGet(key){
  try{
    if(HAS_ARTIFACT_STORAGE){
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : null;
    }else{
      const v = localStorage.getItem('sop-sinav:'+key);
      return v ? JSON.parse(v) : null;
    }
  }catch(e){ return null; }
}
async function storSet(key, val){
  try{
    if(HAS_ARTIFACT_STORAGE){
      await window.storage.set(key, JSON.stringify(val), true);
    }else{
      localStorage.setItem('sop-sinav:'+key, JSON.stringify(val));
    }
    return true;
  }catch(e){ return false; }
}

/* ---------------- Aylık SOP sınav görevi (quota) ----------------
   Her personele, bulunduğu departmanla ilgili SOP havuzundan, ay başına 5 adet
   olacak şekilde kademeli görev eklenir: bu ay 5, gelecek ay 5 daha (kümülatif).
   Başlangıç tarihinden itibaren geçen ay sayısına göre her sayfa yüklemesinde
   hesaplanır; bir kez eklenen parti bir daha yeniden yazılmaz (admin'in elle
   yaptığı sonraki değişiklikleri bozmaz), yalnızca YENİ vadesi gelen partiler eklenir. */
const MONTHLY_QUOTA_START = '2026-09-05';
const MONTHLY_QUOTA_SIZE = 5;

function naturalCodeCompare(a, b){
  // Kod önekleri de rakam içerebildiği için (YT1SOP, EB2SOP, MB3SOP, EMB3SOP gibi),
  // ayraç harf/rakam sınırında değil, EN SONDAKİ rakam bloğunun başında yapılır.
  const ma = a.match(/^(.*?)(\d+)$/), mb = b.match(/^(.*?)(\d+)$/);
  if(ma && mb && ma[1]===mb[1]) return parseInt(ma[2],10) - parseInt(mb[2],10);
  return a.localeCompare(b);
}
function monthlyPool(prefixes, excludeIds){
  excludeIds = excludeIds || [];
  return SOP_SEED
    .filter(s => prefixes.some(p => s.id.startsWith(p)) && !excludeIds.includes(s.id))
    .map(s => s.id)
    .sort(naturalCodeCompare);
}
function addMonthsYmd(ymd, n){
  const [y,m,d] = ymd.split('-').map(Number);
  const dt = new Date(y, (m-1)+n, d);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function monthsElapsedSince(ymd){
  const [y,m,d] = ymd.split('-').map(Number);
  const start = new Date(y, m-1, d);
  const now = new Date();
  let months = (now.getFullYear()-start.getFullYear())*12 + (now.getMonth()-start.getMonth());
  if(now.getDate() < start.getDate()) months -= 1;
  return Math.max(0, months);
}
async function applyMonthlyQuota(sopAssignments){
  const pools = {
    YT: monthlyPool(['YT1SOP']),
    INS: monthlyPool(['I1SOP']),
    // Kendi branşının SOP'ları önce, ortak (hem elektrik hem mekanik) SOP'lar sonra gelecek
    // şekilde sıralanır - aksi halde alfabetik sıralamada "EMB3SOP" harfleri "MB3SOP"tan önce
    // geldiği için mekanik personelin kotası tamamen ortak SOP'larla dolabiliyordu.
    ELK: monthlyPool(['EB2SOP','EB3SOP']).concat(monthlyPool(['EMB3SOP'])),
    MEK: monthlyPool(['MB3SOP'], ['MB3SOP11']).concat(monthlyPool(['EMB3SOP'])),
  };
  const groupPersonnel = { YT, INS, ELK, MEK };
  const currentBatches = monthsElapsedSince(MONTHLY_QUOTA_START) + 1; // bu ay dahil en az 1 parti
  let appliedBatches = await storGet('monthly-quota-batches'); if(!appliedBatches) appliedBatches = 0;
  if(currentBatches <= appliedBatches) return sopAssignments;

  Object.keys(pools).forEach(grp => {
    const pool = pools[grp];
    const personnelIds = groupPersonnel[grp];
    const fromIdx = appliedBatches * MONTHLY_QUOTA_SIZE;
    const toIdx = Math.min(pool.length, currentBatches * MONTHLY_QUOTA_SIZE);
    for(let i = fromIdx; i < toIdx; i++){
      const sopId = pool[i];
      const batchIdx = Math.floor(i / MONTHLY_QUOTA_SIZE);
      const deadline = addMonthsYmd(MONTHLY_QUOTA_START, batchIdx + 1);
      const existing = sopAssignments[sopId];
      if(!existing){
        sopAssignments[sopId] = { deadline, personnelIds: [...personnelIds] };
      }else{
        const merged = new Set(existing.personnelIds);
        personnelIds.forEach(id => merged.add(id));
        sopAssignments[sopId] = { deadline: existing.deadline, personnelIds: Array.from(merged) };
      }
    }
  });
  await storSet('sop-assignments', sopAssignments);
  await storSet('monthly-quota-batches', currentBatches);
  return sopAssignments;
}

async function boot(){
  state.loading = true; render();
  let sops = await storGet('sop-library');
  let libVersion = await storGet('sop-library-version'); if(!libVersion) libVersion = 0;
  if(!sops || !sops.length){
    sops = SOP_SEED;
    await storSet('sop-library', sops);
    await storSet('sop-library-version', LIBRARY_SEED_VERSION);
  }else if(libVersion < LIBRARY_SEED_VERSION){
    // Kütüphane sürümü yükseltildi: eski SOP kataloğu tamamen yeni SOP_SEED ile
    // değiştirilir (eski/kod atanmamış SOP'lar silinir). Bu, admin'in bu noktadan
    // SONRA ekleyeceği yeni özel SOP'ları etkilemez - yalnızca bu geçiş anında yapılır.
    sops = SOP_SEED;
    await storSet('sop-library', sops);
    await storSet('sop-library-version', LIBRARY_SEED_VERSION);
  }else{
    // Sürüm güncel: kullanıcının eklediği özel SOP'lar korunur; SOP_SEED'e sonradan
    // eklenen yeni yerleşik SOP'lar da (id eşleşmesiyle) otomatik olarak eklenir.
    const existingIds = new Set(sops.map(s=>s.id));
    const newOnes = SOP_SEED.filter(s=>!existingIds.has(s.id));
    if(newOnes.length){
      sops = sops.concat(newOnes);
      await storSet('sop-library', sops);
    }
  }
  let exams = await storGet('exams'); if(!exams) exams = []; // legacy, kullanılmıyor
  let results = await storGet('results'); if(!results) results = [];
  let deletedResultIds = await storGet('deleted-result-ids'); if(!deletedResultIds) deletedResultIds = [];
  state.deletedResultIds = new Set(deletedResultIds);

  let personnel = await storGet('personnel');
  if(!personnel || !personnel.length){
    personnel = PERSONNEL_SEED;
    await storSet('personnel', personnel);
  }else{
    const existingPIds = new Set(personnel.map(p=>p.id));
    const newP = PERSONNEL_SEED.filter(p=>!existingPIds.has(p.id));
    if(newP.length){ personnel = personnel.concat(newP); }
    if(personnel.some(p=>REMOVED_PERSONNEL_IDS.includes(p.id))){
      personnel = personnel.filter(p=>!REMOVED_PERSONNEL_IDS.includes(p.id));
    }
    await storSet('personnel', personnel);
  }
  let sopAssignments = await storGet('sop-assignments'); if(!sopAssignments) sopAssignments = {};
  // Atama şablonu (departman bazlı) versiyonlanır: önceki bir sürümden düşükse, buradaki
  // doğru eşleştirme mevcut atamaların üzerine yazılır. Bu, admin'in bu noktadan SONRA
  // elle yapacağı değişiklikleri etkilemez - yalnızca geçmiş hatalı/varsayılan atamaları düzeltir.
  let seedVersion = await storGet('assignment-seed-version'); if(!seedVersion) seedVersion = 0;
  if(seedVersion < ASSIGNMENT_SEED_VERSION){
    // v13'ten itibaren genel atamalar artık toplu/tek seferlik değil, aylık kota
    // mekanizmasıyla (applyMonthlyQuota) kademeli yapılıyor. Bu yüzden sürüm
    // yükseltmesinde eski toplu atamalar tamamen temizlenip yalnızca SOP_ASSIGNMENT_SEED'teki
    // özel (örn. MB3SOP11 -> metal işleri teknisyeni) atamalarla başlanır; aylık kota bundan
    // sonraki adımda üstüne ekleme yapar. Admin'in bundan SONRA elle yapacağı değişiklikleri etkilemez.
    sopAssignments = {};
    Object.entries(SOP_ASSIGNMENT_SEED).forEach(([sopId, seedAssign]) => {
      sopAssignments[sopId] = seedAssign;
    });
    await storSet('sop-assignments', sopAssignments);
    await storSet('assignment-seed-version', ASSIGNMENT_SEED_VERSION);
    await storSet('monthly-quota-batches', 0); // atamalar sıfırlandı, kota partileri baştan uygulansın
  }
  sopAssignments = await applyMonthlyQuota(sopAssignments);

  state.sops = sops; state.exams = exams; state.results = results;
  state.personnel = personnel; state.sopAssignments = sopAssignments;
  state.loading = false; state.loaded = true;
  render();
}

/* ---------------- Local question generation (API gerektirmez) ---------------- */
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function pickExamQuestions(sop){
  const bank = QUESTION_BANKS[sop.id];
  if(!bank || bank.length < 5){
    throw new Error('Bu SOP için henüz soru havuzu hazırlanmadı. Sorularınızı ileterek eklememi isteyebilirsiniz.');
  }
  const chosen = shuffleArr(bank).slice(0, Math.min(10, bank.length));
  return chosen.map(item => {
    const optOrder = shuffleArr(item.o.map((text, idx) => ({text, idx})));
    const newCorrect = optOrder.findIndex(o => o.idx === item.c);
    return {
      question: item.q,
      options: optOrder.map(o => o.text),
      correctIndex: newCorrect,
    };
  });
}

        <div class="qcounter">SORU ${state.currentQ+1} / ${total} &middot; ${escapeHtml(sop.title)}</div>

        <div class="qcard">
          <div class="qtext">${escapeHtml(q.question)}</div>
          ${q.options.map((opt, i) => `
            <div class="opt ${answered===i?'selected':''}" data-select-opt="${i}">

            </div>
          `).join('')}
        </div>
        <div class="exam-nav">
          <button class="btn ghost" data-prev-q ${state.currentQ===0?'disabled':''}>Önceki</button>
          ${state.currentQ < total-1
            ? `<button class="btn primary" data-next-q ${answered===undefined?'disabled':''}>Sonraki Soru</button>`
            : `<button class="btn primary" data-finish-quiz ${answered===undefined?'disabled':''}>Sınavı Bitir</button>`}
        </div>
      </div>
    `;
  }

  if(state.takeStage === 'done'){
    const r = state.lastResult;
    const pct = r.pct;
    const needleDeg = -135 + (pct/100)*270;
    const r1 = 270*0.70, r2 = 270*0.85;
    return `
      <div class="exam-wrap" style="text-align:center;">
        <div class="panel">
          <div class="panel-title">Sınav Tamamlandı</div>
          <div class="panel-sub">${escapeHtml(r.sopTitle)} &middot; ${escapeHtml(r.name)}</div>
          <div class="gauge-wrap">
            <div class="gauge">
              <div class="ring" style="background:conic-gradient(from -135deg, var(--red) 0deg, var(--red) ${r1}deg, var(--amber) ${r1}deg, var(--amber) ${r2}deg, var(--green) ${r2}deg, var(--green) 270deg, transparent 270deg, transparent 360deg);"></div>
              <div class="needle" style="transform:translate(-50%,-100%) rotate(${needleDeg}deg);"></div>
              <div class="hub"></div>
              <div class="inner">
                <div class="pct">%${pct}</div>
                <div class="lbl">${r.score}/${r.total} DOĞRU</div>
              </div>
            </div>
            <div class="verdict ${pct>=70?'pass':'fail'}">${pct>=70?'BAŞARILI':'BAŞARISIZ'}</div>
          </div>
          <div style="margin-top:22px; display:flex; gap:10px; justify-content:center;">
            <button class="btn primary" data-back-take-list>SOP Listesine Dön</button>
          </div>
        </div>
      </div>
    `;
  }
  return '';
}

function normalizeName(s){
  // ÖNEMLİ: Türkçe karakterler küçük harfe çevrilmeden ÖNCE ASCII'ye indirgenir.
  // Aksi halde tarayıcının varsayılan toLowerCase() işlemi "İ" harfini görünmez
  // bir noktalı-i dizisine çevirebiliyor ve bu da aynı ismin eşleşmemesine yol açıyordu.
  return (s||'').trim()
    .replace(/İ/g,'I').replace(/ı/g,'i')
    .replace(/Ş/g,'S').replace(/ş/g,'s')
    .replace(/Ğ/g,'G').replace(/ğ/g,'g')
    .replace(/Ü/g,'U').replace(/ü/g,'u')
    .replace(/Ö/g,'O').replace(/ö/g,'o')
    .replace(/Ç/g,'C').replace(/ç/g,'c')
    .toLowerCase()
    .replace(/\s+/g,' ');
}

function isSopAssignedToPersonnel(sopId, personnelId){
  const a = state.sopAssignments[sopId];

}

function getComplianceRows(){
  const rows = [];
  Object.entries(state.sopAssignments).forEach(([sopId, assign]) => {
    if(!assign || !assign.personnelIds || !assign.personnelIds.length) return;
    const sop = state.sops.find(s=>s.id===sopId);
    if(!sop) return;
    const deadlineTs = assign.deadline ? new Date(assign.deadline+'T23:59:59').getTime() : null;
    assign.personnelIds.forEach(pid => {
      const person = state.personnel.find(p=>p.id===pid);
      if(!person) return;
      // Önce sicil no (personnelId) ile kesin eşleştirme denenir; personel girişi yapmadan
      // (misafir olarak) alınan eski sonuçlar için isim eşleştirmesine geri dönülür.
      const attempts = state.results.filter(r => r.sopId===sopId && (
        r.personnelId ? r.personnelId===pid : normalizeName(r.name)===normalizeName(person.name)
      ));
      attempts.sort((a,b)=>a.submittedAt-b.submittedAt);
      const first = attempts[0];
      let status, deviationDays;
      if(first){
        if(deadlineTs!=null){
          const diffDays = Math.round((deadlineTs - first.submittedAt)/86400000);
          status = diffDays >= 0 ? 'zamaninda' : 'gec';
          deviationDays = diffDays;
        }else{ status = 'tamamlandi'; deviationDays = null; }
      }else{
        if(deadlineTs!=null && Date.now() > deadlineTs){
          status = 'gecikti'; deviationDays = -Math.round((Date.now()-deadlineTs)/86400000);
        }else{ status = 'bekliyor'; deviationDays = null; }
      }
      rows.push({
        sopId, sopTitle: sop.title, personId: pid, personName: person.name, dept: person.dept,
        deadline: assign.deadline, completedAt: first?first.submittedAt:null,
        pct: first?first.pct:null, status, deviationDays
      });
    });
  });
  return rows;
}

/* ---------------- Uyum grafikleri (haftalık aktivite / aylık uyum oranı) ---------------- */
function startOfWeekTs(d){
  const dt = new Date(d); const day = (dt.getDay()+6)%7; // Pazartesi=0
  dt.setHours(0,0,0,0); dt.setDate(dt.getDate()-day);
  return dt;
}
function buildWeeklyActivityData(rows, weeks){
  weeks = weeks || 8;
  const now = new Date();
  const buckets = [];
  for(let i = weeks-1; i >= 0; i--){
    const start = startOfWeekTs(now); start.setDate(start.getDate() - 7*i);
    const end = new Date(start); end.setDate(end.getDate()+7);
    const count = rows.filter(r => r.completedAt && r.completedAt >= start.getTime() && r.completedAt < end.getTime()).length;
    buckets.push({ label: String(start.getDate()).padStart(2,'0')+'.'+String(start.getMonth()+1).padStart(2,'0'), count });
  }
  return buckets;
}
const TR_MONTHS_SHORT = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function buildMonthlyComplianceData(rows, months){
  months = months || 6;
  const now = new Date();
  const buckets = [];
  for(let i = months-1; i >= 0; i--){
    const y = now.getFullYear(), m = now.getMonth() - i;
    const start = new Date(y, m, 1).getTime();
    const end = new Date(y, m+1, 1).getTime();
    const inMonth = rows.filter(r => {
      if(!r.deadline) return false;
      const dts = new Date(r.deadline+'T23:59:59').getTime();
      return dts >= start && dts < end;
    });
    const total = inMonth.length;
    const onTime = inMonth.filter(r => r.status==='zamaninda' || r.status==='tamamlandi').length;
    const pct = total ? Math.round(onTime/total*100) : null;
    const label = TR_MONTHS_SHORT[((m%12)+12)%12] + ' ' + String(new Date(y,m,1).getFullYear()).slice(2);
    buckets.push({ label, pct, total });
  }
  return buckets;
}
function renderBarChartSVG(buckets, opts){
  const w = 640, h = 170, padL = 8, padR = 8, padT = 22, padB = 26;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const values = buckets.map(b => (opts.value(b)==null ? 0 : opts.value(b)));
  const maxV = opts.maxValue!=null ? opts.maxValue : Math.max(1, ...values);
  const bw = innerW / buckets.length;
  const bars = buckets.map((b,i) => {
    const v = opts.value(b);
    const vv = v==null ? 0 : v;
    const bh = maxV ? (vv/maxV)*innerH : 0;
    const x = padL + i*bw + bw*0.18;
    const bwid = bw*0.64;
    const y = padT + innerH - bh;
    const color = opts.color ? opts.color(b) : 'var(--blue)';
    const valueLabel = v==null ? '—' : (opts.suffix ? v+opts.suffix : String(v));
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwid.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" rx="3" fill="${color}"/>
      <text x="${(x+bwid/2).toFixed(1)}" y="${(y-5).toFixed(1)}" font-size="10.5" fill="var(--text-1)" text-anchor="middle" font-family="var(--font-mono)">${valueLabel}</text>
      <text x="${(x+bwid/2).toFixed(1)}" y="${h-9}" font-size="10" fill="var(--text-2)" text-anchor="middle">${escapeHtml(b.label)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">${bars}</svg>`;
}
function renderComplianceCharts(filtered){
  const weekly = buildWeeklyActivityData(filtered, 8);
  const monthly = buildMonthlyComplianceData(filtered, 6);
  const weeklySvg = renderBarChartSVG(weekly, { value:b=>b.count, color:()=>'var(--blue)' });
  const monthlySvg = renderBarChartSVG(monthly, {
    value:b=>b.pct, suffix:'%', maxValue:100,
    color:b=> b.pct==null ? 'var(--line)' : (b.pct>=80 ? 'var(--green)' : (b.pct>=50 ? 'var(--amber)' : 'var(--red)'))
  });
  return `
    <div style="display:grid; grid-template-columns:1fr; gap:14px; margin-bottom:18px;">
      <div class="panel" style="padding:16px;">
        <div style="font-family:var(--font-display); font-size:14px; letter-spacing:.02em; margin-bottom:8px; color:var(--text-1);">Haftalık Sınav Aktivitesi <span style="color:var(--text-2); font-family:var(--font-body); font-size:11.5px;">(tamamlanan sınav sayısı, son 8 hafta)</span></div>
        ${weeklySvg}

        <div style="font-family:var(--font-display); font-size:14px; letter-spacing:.02em; margin-bottom:8px; color:var(--text-1);">Aylık Uyum Oranı <span style="color:var(--text-2); font-family:var(--font-body); font-size:11.5px;">(vadesi o ay olan atamalardan zamanında tamamlanma yüzdesi, son 6 ay)</span></div>
        ${monthlySvg}
      </div>
    </div>`;
}

          <div>
            <div style="display:flex; justify-content:space-between; gap:10px; font-size:12px; margin-bottom:4px;">
              <span><b>${escapeHtml(r.personName)}</b> <span style="color:var(--text-2);">— ${escapeHtml(r.sopTitle)}</span></span>
              <span style="color:${meta.color}; font-weight:600; white-space:nowrap;">${meta.label}${r.deviationDays!=null?` (${r.deviationDays>=0?'+':''}${r.deviationDays} gün)`:''}</span>
            </div>
            <div style="height:8px; background:var(--bg-0); border-radius:100px; overflow:hidden; border:1px solid var(--line-soft);">
              <div style="height:100%; width:${barPct}%; background:${meta.color}; border-radius:100px;"></div>
            </div>
            <div style="font-size:10.5px; color:var(--text-2); margin-top:3px;">
              Son tarih: ${r.deadline?new Date(r.deadline).toLocaleDateString('tr-TR'):'—'}
              ${r.completedAt?` &middot; Tamamlama: ${new Date(r.completedAt).toLocaleDateString('tr-TR')} (%${r.pct})`:''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`}
  `;
}

/* ---------------- utils ---------------- */
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

async function autoSyncCloudResults(){
  state.cloudSyncing = true; render();
  const cloud = await fetchCloudResults();
  state.cloudSyncing = false;
  if(cloud !== null){
    const localIds = new Set(state.results.map(r=>r.id));
    let added = 0;
    cloud.forEach(r => { if(!localIds.has(r.id) && !state.deletedResultIds.has(r.id)){ state.results.push(r); added++; } });
    if(added>0){
      state.results.sort((a,b)=>a.submittedAt-b.submittedAt);
      await storSet('results', state.results);
    }
  }
  render();
  return cloud;
}

/* ---------------- Events ---------------- */
function bindEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = () => {
      state.view = el.getAttribute('data-nav'); state.openSopId=null; render();
      if((state.view==='results' || state.view==='compliance') && CONFIG.sheetsWebhookUrl && !state.cloudSyncing){
        autoSyncCloudResults();
      }
    };
  });

  // library
  const toggleAdd = document.querySelector('[data-toggle-add]');
  if(toggleAdd) toggleAdd.onclick = () => { state.showAddForm = !state.showAddForm; render(); };
  const cancelAdd = document.querySelector('[data-cancel-add]');
  if(cancelAdd) cancelAdd.onclick = () => { state.showAddForm=false; render(); };
  const saveSop = document.querySelector('[data-save-sop]');
  if(saveSop) saveSop.onclick = async () => {
    const title = document.getElementById('new-sop-title').value.trim();
    const cat = document.getElementById('new-sop-cat').value.trim();
    const content = document.getElementById('new-sop-content').value.trim();
    if(!title || !content){ showToast('Başlık ve içerik zorunlu.', 'err'); return; }
    const sop = { id: 'sop-'+uid(8), title, category: cat||'Genel', content };
    state.sops.push(sop);
    await storSet('sop-library', state.sops);
    state.showAddForm=false; state.newSop={title:'',category:'',content:''};
    showToast('SOP eklendi.');
  };
  document.querySelectorAll('[data-open-sop]').forEach(el=>{
    el.onclick = () => { state.openSopId = el.getAttribute('data-open-sop'); render(); };
  });
  const backLib = document.querySelector('[data-back-library]');
  if(backLib) backLib.onclick = () => { state.openSopId=null; render(); };
  document.querySelectorAll('[data-goto-generate]').forEach(el=>{
    el.onclick = () => { state.genSopId = el.getAttribute('data-goto-generate'); state.view='generate'; state.openSopId=null; render(); };
  });

  // generate (admin önizleme - doğrudan take akışına yönlendirir)
  const genSelect = document.getElementById('gen-sop-select');
  if(genSelect) genSelect.onchange = (e) => { state.genSopId = e.target.value || null; render(); };
  const genStart = document.querySelector('[data-gen-start]');
  if(genStart) genStart.onclick = () => {
    const sop = state.sops.find(s=>s.id===state.genSopId);
    if(!sop) return;
    if(!QUESTION_BANKS[sop.id] || QUESTION_BANKS[sop.id].length < 5){
      state.genError = 'Bu SOP için henüz soru havuzu hazırlanmadı.'; render(); return;
    }
    state.takeSopId = sop.id; state.takerName=''; state.takerDept='';
    state.view='take'; state.takeStage='name';
    render();
  };

  // take flow
  document.querySelectorAll('[data-start-exam]').forEach(el=>{
    el.onclick = () => {
      state.takeSopId = el.getAttribute('data-start-exam');
      const currentPersonnel = getCurrentPersonnel();
      if(!state.isAdmin && currentPersonnel){
        // Personel girişliyse isim adımı atlanır, doğrudan sınav başlar.
        const sop = state.sops.find(s=>s.id===state.takeSopId);
        let questions;
        try{ questions = pickExamQuestions(sop); }
        catch(err){ showToast(err.message, 'err'); return; }
        state.takerName = currentPersonnel.name;
        state.takerDept = currentPersonnel.dept || '';
        state.currentQuizQuestions = questions;
        state.answers = []; state.currentQ = 0;
        state.takeStage='quiz'; render();
      }else{
        state.takerName=''; state.takerDept='';
        state.takeStage='name'; render();
      }
    };
  });
  const backTakeList = document.querySelector('[data-back-take-list]');
  if(backTakeList) backTakeList.onclick = () => {
    state.takeStage='list'; state.takeSopId=null; state.answers=[]; state.currentQ=0; state.takerName=''; state.takerDept=''; state.currentQuizQuestions=[];
    render();
  };
  const beginQuiz = document.querySelector('[data-begin-quiz]');
  if(beginQuiz) beginQuiz.onclick = () => {
    const name = document.getElementById('taker-name').value.trim();
    const dept = document.getElementById('taker-dept').value.trim();
    if(!name){ showToast('Lütfen ad soyad girin.', 'err'); return; }
    const sop = state.sops.find(s=>s.id===state.takeSopId);
    let questions;
    try{ questions = pickExamQuestions(sop); }
    catch(err){ showToast(err.message, 'err'); return; }
    state.takerName = name; state.takerDept = dept;
    state.currentQuizQuestions = questions;
    state.answers = []; state.currentQ = 0;
    state.takeStage='quiz'; render();
  };
  document.querySelectorAll('[data-select-opt]').forEach(el=>{
    el.onclick = () => {
      state.answers[state.currentQ] = parseInt(el.getAttribute('data-select-opt'),10);
      render();
    };
  });
  const prevQ = document.querySelector('[data-prev-q]');
  if(prevQ) prevQ.onclick = () => { if(state.currentQ>0){ state.currentQ--; render(); } };
  const nextQ = document.querySelector('[data-next-q]');
  if(nextQ) nextQ.onclick = () => { state.currentQ++; render(); };
  const finishQuiz = document.querySelector('[data-finish-quiz]');
  if(finishQuiz) finishQuiz.onclick = async () => {
    const sop = state.sops.find(s=>s.id===state.takeSopId);
    const qs = state.currentQuizQuestions;
    let score = 0;
    qs.forEach((q,i)=>{ if(state.answers[i]===q.correctIndex) score++; });
    const total = qs.length;
    const pct = Math.round((score/total)*100);
    const currentPersonnel = getCurrentPersonnel();
    const result = {
      id:'res-'+uid(10), sopId: sop.id, sopTitle: sop.title,
      name: state.takerName, dept: state.takerDept,
      personnelId: (!state.isAdmin && currentPersonnel) ? currentPersonnel.id : null,
      score, total, pct, answers: state.answers.slice(),
      submittedAt: Date.now()
    };
    state.results.push(result);
    await storSet('results', state.results);
    syncResultToSheets(result); // yapılandırılmışsa Google E-Tablo'ya da gönderir (fire-and-forget)
    state.lastResult = result;
    state.takeStage='done';
    render();
  };

  // results
  const resFilter = document.getElementById('results-filter');
  if(resFilter) resFilter.onchange = (e) => { state.resultsFilter = e.target.value; render(); };
  const refreshCloud = document.querySelector('[data-refresh-cloud]');
  if(refreshCloud) refreshCloud.onclick = async () => {
    const before = state.results.length;
    const cloud = await autoSyncCloudResults();
    if(cloud === null){
      showToast('Bulut sonuçları alınamadı. Google E-Tablo\'yu doğrudan açabilirsiniz.', 'err');
    }else{
      const added = state.results.length - before;
      showToast(added>0 ? `${added} yeni sonuç eklendi.` : 'Yeni sonuç yok, liste güncel.');
    }
  };
  const exportCsv = document.querySelector('[data-export-csv]');
  if(exportCsv) exportCsv.onclick = () => {
    const filtered = state.resultsFilter==='all' ? state.results : state.results.filter(r=>r.sopId===state.resultsFilter);
    let csv = 'Ad Soyad,Departman,SOP,Skor,Yuzde,Tarih\n';
    filtered.forEach(r=>{
      csv += `"${(r.name||'').replace(/"/g,'""')}","${(r.dept||'').replace(/"/g,'""')}","${r.sopTitle.replace(/"/g,'""')}",${r.score}/${r.total},${r.pct}%,"${new Date(r.submittedAt).toLocaleString('tr-TR')}"\n`;
    });
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'sop-sinav-sonuclari.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  // admin: giriş/çıkış
  // yönetici: giriş/çıkış
  const adminLoginOpen = document.querySelector('[data-admin-login-open]');
  if(adminLoginOpen) adminLoginOpen.onclick = (e) => { e.preventDefault(); state.showAdminLogin=true; state.adminLoginError=null; render(); };
  const adminLoginCancel = document.querySelector('[data-admin-login-cancel]');
  if(adminLoginCancel) adminLoginCancel.onclick = () => { state.showAdminLogin=false; render(); };
  const adminModalBackdrop = document.querySelector('[data-admin-modal-backdrop]');
  if(adminModalBackdrop) adminModalBackdrop.onclick = () => { state.showAdminLogin=false; render(); };
  const adminLoginSubmit = document.querySelector('[data-admin-login-submit]');
  const doAdminLogin = async () => {
    const pw = document.getElementById('admin-password-input').value;
    if(!pw){ state.adminLoginError='Şifre girin.'; render(); return; }
    state.pendingLoginBusy = true; render();
    const enteredHash = await sha256Hex(pw);
    const cred = await findCredential('admin');
    state.pendingLoginBusy = false;
    if(cred){
      if(cred.hash === enteredHash){
        state.isAdmin = true; state.adminPasswordHash = enteredHash; state.showAdminLogin=false; state.adminLoginError=null;
        try{ sessionStorage.setItem('sop-sinav-admin','1'); sessionStorage.setItem('sop-sinav-admin-hash', enteredHash); }catch(e){}
        showToast('Yönetici girişi yapıldı.');
      }else{
        state.adminLoginError = 'Şifre yanlış.';
      }
    }else{
      // Henüz özel şifre belirlenmemiş - varsayılan (kurulum) şifreyle kontrol edilir.
      if(pw === CONFIG.adminPassword){
        state.showAdminLogin=false; state.adminLoginError=null;
        const defaultHash = await sha256Hex(CONFIG.adminPassword);
        state.pendingLogin = { type:'admin', username:'admin', oldHash: defaultHash };
        state.pendingLoginError = null;
      }else{
        state.adminLoginError = 'Şifre yanlış.';
      }
    }
    render();
  };
  if(adminLoginSubmit) adminLoginSubmit.onclick = doAdminLogin;
  const adminPwInput = document.getElementById('admin-password-input');
  if(adminPwInput) adminPwInput.onkeydown = (e) => { if(e.key==='Enter') doAdminLogin(); };
  const adminLogout = document.querySelector('[data-admin-logout]');
  if(adminLogout) adminLogout.onclick = (e) => {
    e.preventDefault();
    state.isAdmin = false; state.adminPasswordHash = null;
    try{ sessionStorage.removeItem('sop-sinav-admin'); sessionStorage.removeItem('sop-sinav-admin-hash'); }catch(err){}
    render();
  };

  // personel: giriş/çıkış
  const personnelLoginOpen = document.querySelector('[data-personnel-login-open]');
  if(personnelLoginOpen) personnelLoginOpen.onclick = (e) => { e.preventDefault(); state.showPersonnelLogin=true; state.personnelLoginError=null; render(); };
  const personnelLoginOpenFromTake = document.querySelector('[data-personnel-login-open-from-take]');
  if(personnelLoginOpenFromTake) personnelLoginOpenFromTake.onclick = (e) => { e.preventDefault(); state.showPersonnelLogin=true; state.personnelLoginError=null; render(); };
  const personnelLoginCancel = document.querySelector('[data-personnel-login-cancel]');
  if(personnelLoginCancel) personnelLoginCancel.onclick = () => { state.showPersonnelLogin=false; render(); };
  const personnelModalBackdrop = document.querySelector('[data-personnel-modal-backdrop]');
  if(personnelModalBackdrop) personnelModalBackdrop.onclick = () => { state.showPersonnelLogin=false; render(); };
  const personnelLoginSubmit = document.querySelector('[data-personnel-login-submit]');
  const doPersonnelLogin = async () => {
    const usernameInput = document.getElementById('personnel-id-input').value.trim();
    const pwInput = document.getElementById('personnel-password-input').value;
    if(!usernameInput || !pwInput){ state.personnelLoginError='Kullanıcı adı ve şifre girin.'; render(); return; }
    const person = state.personnel.find(p => sicilToUsername(p.id) === usernameInput);
    if(!person){ state.personnelLoginError = 'Kullanıcı adı veya şifre hatalı.'; render(); return; }
    state.pendingLoginBusy = true; render();
    const enteredHash = await sha256Hex(pwInput);
    const cred = await findCredential(usernameInput);
    state.pendingLoginBusy = false;
    if(cred){
      if(cred.hash === enteredHash){
        state.currentPersonnelId = person.id; state.showPersonnelLogin=false; state.personnelLoginError=null;
        try{ sessionStorage.setItem('sop-sinav-personnel-id', person.id); }catch(e){}
        showToast(`Hoş geldiniz, ${person.name}.`);
      }else{
        state.personnelLoginError = 'Kullanıcı adı veya şifre hatalı.';
      }
    }else{
      // Henüz hiç şifre belirlenmemiş - yalnızca varsayılan şifreyle ilk girişe izin verilir.
      if(pwInput === DEFAULT_PERSONNEL_PASSWORD){
        state.showPersonnelLogin=false; state.personnelLoginError=null;
        const defaultHash = await sha256Hex(DEFAULT_PERSONNEL_PASSWORD);
        state.pendingLogin = { type:'personnel', username: usernameInput, personnelId: person.id, oldHash: defaultHash };
        state.pendingLoginError = null;
      }else{
        state.personnelLoginError = 'Kullanıcı adı veya şifre hatalı.';
      }
    }
    render();
  };
  if(personnelLoginSubmit) personnelLoginSubmit.onclick = doPersonnelLogin;
  const personnelPwInput = document.getElementById('personnel-password-input');
  if(personnelPwInput) personnelPwInput.onkeydown = (e) => { if(e.key==='Enter') doPersonnelLogin(); };
  const personnelLogout = document.querySelector('[data-personnel-logout]');
  if(personnelLogout) personnelLogout.onclick = (e) => {
    e.preventDefault();
    state.currentPersonnelId = null;
    try{ sessionStorage.removeItem('sop-sinav-personnel-id'); }catch(err){}
    if(state.view==='generate' || state.view==='personnel' || state.view==='compliance') state.view='library';
    render();
  };

  // ilk kullanım - zorunlu şifre belirleme (varsayılan şifreyle giriş sonrası)
  const forcePasswordSubmit = document.querySelector('[data-force-password-submit]');
  if(forcePasswordSubmit) forcePasswordSubmit.onclick = async () => {
    const p1 = document.getElementById('force-new-password-input').value;
    const p2 = document.getElementById('force-new-password-confirm-input').value;
    if(!p1 || p1.length < 4){ state.pendingLoginError = 'Şifre en az 4 karakter olmalı.'; render(); return; }
    if(p1 !== p2){ state.pendingLoginError = 'Şifreler eşleşmiyor.'; render(); return; }
    state.pendingLoginBusy = true; state.pendingLoginError = null; render();
    const newHash = await sha256Hex(p1);
    const ok = await saveCredential(state.pendingLogin.username, state.pendingLogin.oldHash, newHash);
    state.pendingLoginBusy = false;
    if(!ok){ state.pendingLoginError = 'Şifre güncellenemedi, tekrar deneyin.'; render(); return; }
    if(state.pendingLogin.type === 'admin'){
      state.isAdmin = true; state.adminPasswordHash = newHash;
      try{ sessionStorage.setItem('sop-sinav-admin','1'); sessionStorage.setItem('sop-sinav-admin-hash', newHash); }catch(e){}
      showToast('Şifreniz belirlendi, yönetici girişi yapıldı.');
    }else{
      state.currentPersonnelId = state.pendingLogin.personnelId;
      try{ sessionStorage.setItem('sop-sinav-personnel-id', state.pendingLogin.personnelId); }catch(e){}
      const person = state.personnel.find(p=>p.id===state.pendingLogin.personnelId);
      showToast(`Şifreniz belirlendi. Hoş geldiniz, ${person?person.name:''}.`);
    }
    state.pendingLogin = null;
    render();
  };

  // giriş yapmış kullanıcının kendi isteğiyle şifre değiştirmesi
  const openChangePassword = document.querySelector('[data-open-change-password]');
  if(openChangePassword) openChangePassword.onclick = () => { state.showChangePassword = true; state.changePasswordError = null; render(); };
  const changePasswordCancel = document.querySelector('[data-change-password-cancel]');
  if(changePasswordCancel) changePasswordCancel.onclick = () => { state.showChangePassword = false; render(); };
  const changePasswordBackdrop = document.querySelector('[data-change-password-backdrop]');
  if(changePasswordBackdrop) changePasswordBackdrop.onclick = () => { state.showChangePassword = false; render(); };
  const changePasswordSubmit = document.querySelector('[data-change-password-submit]');
  if(changePasswordSubmit) changePasswordSubmit.onclick = async () => {
    const oldPw = document.getElementById('change-old-password-input').value;
    const p1 = document.getElementById('change-new-password-input').value;
    const p2 = document.getElementById('change-new-password-confirm-input').value;
    if(!oldPw){ state.changePasswordError = 'Mevcut şifrenizi girin.'; render(); return; }
    if(!p1 || p1.length < 4){ state.changePasswordError = 'Yeni şifre en az 4 karakter olmalı.'; render(); return; }
    if(p1 !== p2){ state.changePasswordError = 'Yeni şifreler eşleşmiyor.'; render(); return; }
    const cp = getCurrentPersonnel();
    const username = state.isAdmin ? 'admin' : sicilToUsername(cp.id);
    state.changePasswordBusy = true; state.changePasswordError = null; render();
    const oldHash = await sha256Hex(oldPw);
    const cred = await findCredential(username);
    const currentKnownHash = cred ? cred.hash : await sha256Hex(state.isAdmin ? CONFIG.adminPassword : DEFAULT_PERSONNEL_PASSWORD);
    if(oldHash !== currentKnownHash){
      state.changePasswordBusy = false;
      state.changePasswordError = 'Mevcut şifre hatalı.';
      render(); return;
    }
    const newHash = await sha256Hex(p1);
    const ok = await saveCredential(username, oldHash, newHash);
    state.changePasswordBusy = false;
    if(!ok){ state.changePasswordError = 'Şifre güncellenemedi, tekrar deneyin.'; render(); return; }
    if(state.isAdmin){
      state.adminPasswordHash = newHash;
      try{ sessionStorage.setItem('sop-sinav-admin-hash', newHash); }catch(e){}
    }
    state.showChangePassword = false;
    showToast('Şifreniz güncellendi.');
    render();
  };

  // SOP kütüphanesi arama (her render tüm DOM'u yenilediği için odağı elle geri veriyoruz)
  const librarySearchInput = document.getElementById('library-search-input');
  if(librarySearchInput) librarySearchInput.oninput = (e) => {
    state.librarySearch = e.target.value;
    const cursorPos = e.target.selectionStart;
    render();
    const newInput = document.getElementById('library-search-input');
    if(newInput){ newInput.focus(); newInput.setSelectionRange(cursorPos, cursorPos); }
  };

  // admin: sonuç silme
  document.querySelectorAll('[data-delete-result]').forEach(el=>{
    el.onclick = async () => {
      const id = el.getAttribute('data-delete-result');
      const r = state.results.find(x=>x.id===id);
      if(!r) return;
      if(!confirm(`${r.name} - ${r.sopTitle} sonucunu silmek istediğinize emin misiniz?`)) return;
      state.results = state.results.filter(x=>x.id!==id);
      state.deletedResultIds.add(id);
      await storSet('results', state.results);
      await storSet('deleted-result-ids', Array.from(state.deletedResultIds));
      syncDeleteToSheets(id);
      showToast('Sonuç silindi.');
      render();
    };
  });

  // personnel
  const toggleAddP = document.querySelector('[data-toggle-add-personnel]');
  if(toggleAddP) toggleAddP.onclick = () => { state.showAddPersonnel = !state.showAddPersonnel; render(); };
  const cancelAddP = document.querySelector('[data-cancel-add-personnel]');
  if(cancelAddP) cancelAddP.onclick = () => { state.showAddPersonnel=false; render(); };
  const savePersonnel = document.querySelector('[data-save-personnel]');
  if(savePersonnel) savePersonnel.onclick = async () => {
    const id = document.getElementById('new-p-id').value.trim();
    const name = document.getElementById('new-p-name').value.trim();
    const dept = document.getElementById('new-p-dept').value.trim();
    const title = document.getElementById('new-p-title').value.trim();
    if(!id || !name){ showToast('Sicil no ve ad soyad zorunlu.', 'err'); return; }
    if(state.personnel.some(p=>p.id===id)){ showToast('Bu sicil no zaten kayıtlı.', 'err'); return; }
    state.personnel.push({id, name, dept, title});
    await storSet('personnel', state.personnel);
    state.showAddPersonnel=false; state.newPersonnel={id:'',name:'',dept:'',title:''};
    showToast('Personel eklendi.');
    render();
  };
  document.querySelectorAll('[data-delete-personnel]').forEach(el=>{
    el.onclick = async () => {
      const id = el.getAttribute('data-delete-personnel');
      const p = state.personnel.find(x=>x.id===id);
      if(!p) return;
      if(!confirm(`${p.name} personelini silmek istediğinize emin misiniz?`)) return;
      state.personnel = state.personnel.filter(x=>x.id!==id);
      await storSet('personnel', state.personnel);
      // atamalardan da temizle
      Object.values(state.sopAssignments).forEach(a=>{ if(a.personnelIds) a.personnelIds = a.personnelIds.filter(pid=>pid!==id); });
      await storSet('sop-assignments', state.sopAssignments);
      showToast('Personel silindi.');
      render();
    };
  });

  // SOP ataması
  const assignSopSelect = document.getElementById('assign-sop-select');
  if(assignSopSelect) assignSopSelect.onchange = (e) => {
    const sopId = e.target.value || null;
    state.assignSopId = sopId;
    const existing = sopId ? state.sopAssignments[sopId] : null;
    state.assignDeadlineDraft = existing && existing.deadline ? existing.deadline : '';
    state.assignSelectedIds = new Set(existing && existing.personnelIds ? existing.personnelIds : []);
    render();
  };
  const assignDeadlineInput = document.getElementById('assign-deadline-input');
  if(assignDeadlineInput) assignDeadlineInput.onchange = (e) => { state.assignDeadlineDraft = e.target.value; };
  document.querySelectorAll('[data-assign-check]').forEach(el=>{
    el.onchange = (e) => {
      const pid = el.getAttribute('data-assign-check');
      if(e.target.checked) state.assignSelectedIds.add(pid); else state.assignSelectedIds.delete(pid);
      render();
    };
  });
  const saveAssignment = document.querySelector('[data-save-assignment]');
  if(saveAssignment) saveAssignment.onclick = async () => {
    if(!state.assignSopId) return;
    const deadlineVal = document.getElementById('assign-deadline-input') ? document.getElementById('assign-deadline-input').value : state.assignDeadlineDraft;
    state.sopAssignments[state.assignSopId] = {
      deadline: deadlineVal || null,
      personnelIds: Array.from(state.assignSelectedIds),
    };
    await storSet('sop-assignments', state.sopAssignments);
    showToast('Atama kaydedildi.');
    render();
  };
  document.querySelectorAll('[data-view-compliance]').forEach(el=>{
    el.onclick = () => {
      state.complianceFilter = el.getAttribute('data-view-compliance');
      state.view = 'compliance'; render();
    };
  });

  // uyum takibi
  const complianceFilter = document.getElementById('compliance-filter');
  if(complianceFilter) complianceFilter.onchange = (e) => { state.complianceFilter = e.target.value; render(); };
  const compliancePersonFilter = document.getElementById('compliance-person-filter');
  if(compliancePersonFilter) compliancePersonFilter.onchange = (e) => { state.compliancePersonFilter = e.target.value; render(); };
  const refreshCloudCompliance = document.querySelector('[data-refresh-cloud-compliance]');
  if(refreshCloudCompliance) refreshCloudCompliance.onclick = async () => {
    const cloud = await autoSyncCloudResults();
    if(cloud === null){ showToast('Bulut sonuçları alınamadı.', 'err'); }
    else{ showToast('Uyum verileri güncellendi.'); }
  };
}

boot();
</script>
</body>
</html>
