<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SOP Eğitim &amp; Sınav Sistemi</title>
<meta name="theme-color" content="#101316" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SOP Sınav" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#101316;
    --bg-1:#181c20;
    --bg-2:#20252a;
    --bg-3:#282e34;
    --line:#343b42;
    --line-soft:#2a3037;
    --text-0:#eef1f4;
    --text-1:#b8c0c9;
    --text-2:#7c8792;
    --amber:#f5a623;
    --amber-dim:#8a5f16;
    --amber-glow: rgba(245,166,35,0.35);
    --green:#3ecf8e;
    --red:#ff5c5c;
    --blue:#4ea1ff;
    --font-display:'Oswald', 'Arial Narrow', sans-serif;
    --font-body:'Inter', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', 'Consolas', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg-0);color:var(--text-0);font-family:var(--font-body);}
  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(245,166,35,0.06), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(78,161,255,0.05), transparent 40%);
  }
  ::selection{background:var(--amber);color:#1a1200;}
  a{color:inherit;}
  button{font-family:inherit;}

  #app{ min-height:100vh; display:flex; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:230px; flex:0 0 230px; background:var(--bg-1); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:22px 16px; gap:4px;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:26px; padding:0 6px;}
  .brand .mark{
    width:34px;height:34px;border-radius:6px;background:linear-gradient(160deg,var(--amber),#c97e0f);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
    font-weight:700;color:#181200;font-size:16px; flex:0 0 auto;
    box-shadow:0 0 0 1px rgba(0,0,0,0.3), 0 0 18px var(--amber-glow);
  }
  .brand .txt{ line-height:1.15; }
  .brand .txt .l1{font-family:var(--font-display);font-weight:600;font-size:14.5px;letter-spacing:.3px;}
  .brand .txt .l2{font-size:10.5px;color:var(--text-2);letter-spacing:1.2px;text-transform:uppercase;}

  .navgroup-label{ font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--text-2); margin:16px 10px 6px; }
  .navitem{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer;
    color:var(--text-1); font-size:13.5px; font-weight:500; border:1px solid transparent; transition:.15s;
    user-select:none;
  }
  .navitem svg{ width:16px;height:16px;flex:0 0 auto; opacity:.85;}
  .navitem:hover{ background:var(--bg-2); color:var(--text-0); }
  .navitem.active{ background:rgba(245,166,35,0.10); border-color:rgba(245,166,35,0.35); color:var(--amber); }
  .navitem.active svg{ opacity:1; }

  .sidebar-foot{ margin-top:auto; padding:12px 10px; border-top:1px solid var(--line-soft); font-size:10.5px; color:var(--text-2); line-height:1.5;}

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    height:60px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent);
  }
  .topbar h1{ font-family:var(--font-display); font-size:18px; font-weight:600; margin:0; letter-spacing:.3px;}
  .topbar .sub{ font-size:11.5px; color:var(--text-2); margin-top:2px;}
  .topbar-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .topbar-actions .btn.sm{ padding:6px 10px; font-size:11.5px; white-space:nowrap; }
  .content{ flex:1; overflow-y:auto; padding:26px; }

  .pill{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:600; letter-spacing:.6px; text-transform:uppercase;
         padding:4px 10px; border-radius:100px; border:1px solid var(--line); color:var(--text-2);}
  .pill.live{ color:var(--green); border-color:rgba(62,207,142,.35); background:rgba(62,207,142,.08);}
  .pill.closed{ color:var(--text-2); }

  /* ---------- cards / grid ---------- */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .card{
    background:var(--bg-1); border:1px solid var(--line); border-radius:10px; padding:16px;
    display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden;
  }
  .card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--line-soft);}
  .card.tag-amber::before{ background:var(--amber); }
  .card.tag-green::before{ background:var(--green); }
  .card h3{ margin:0; font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:.2px; line-height:1.3;}
  .card p{ margin:0; font-size:12.5px; color:var(--text-1); line-height:1.5; }
  .card .meta{ display:flex; gap:14px; font-size:11px; color:var(--text-2); font-family:var(--font-mono);}
  .card .row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
    border-radius:7px; border:1px solid var(--line); background:var(--bg-2); color:var(--text-0);
    padding:9px 14px; font-size:12.5px; font-weight:600; transition:.15s; letter-spacing:.2px;
  }
  .btn:hover{ background:var(--bg-3); border-color:#454d55; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.primary{ background:linear-gradient(160deg,var(--amber),#c97e0f); border-color:#c97e0f; color:#181200; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.ghost{ background:transparent; }
  .btn.danger{ border-color:rgba(255,92,92,.4); color:var(--red); background:rgba(255,92,92,.06);}
  .btn.sm{ padding:6px 10px; font-size:11.5px; }
  .btn.block{ width:100%; }

  .empty{
    border:1px dashed var(--line); border-radius:10px; padding:40px 20px; text-align:center; color:var(--text-2);
  }
  .empty svg{ width:30px;height:30px; margin-bottom:10px; opacity:.5;}
  .empty .t{ color:var(--text-1); font-weight:600; font-size:13.5px; margin-bottom:4px;}

  input[type=text], input[type=password], textarea, select{
    width:100%; background:var(--bg-0); border:1px solid var(--line); color:var(--text-0);
    padding:10px 12px; border-radius:7px; font-size:13px; font-family:inherit; outline:none;
  }
  input[type=text]:focus, input[type=password]:focus, textarea:focus, select:focus{ border-color:var(--amber); box-shadow:0 0 0 3px rgba(245,166,35,.12); }
  label.field-label{ font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-2); margin-bottom:6px; display:block; font-weight:600;}
  .field{ margin-bottom:16px; }

  .panel{ background:var(--bg-1); border:1px solid var(--line); border-radius:12px; padding:22px; }
  .panel-title{ font-family:var(--font-display); font-size:16px; font-weight:600; margin:0 0 4px; }
  .panel-sub{ font-size:12px; color:var(--text-2); margin:0 0 18px; }

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--bg-3); border:1px solid var(--line);
    padding:12px 16px; border-radius:8px; font-size:12.5px; color:var(--text-0); box-shadow:0 8px 30px rgba(0,0,0,.4);
    z-index:999; max-width:320px;
  }
  .toast.err{ border-color:rgba(255,92,92,.5); color:#ffb3b3; }
  .toast.ok{ border-color:rgba(62,207,142,.5); color:#bdf5da; }

  /* ---------- SOP detail steps ---------- */
  .steplist{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .step{ display:flex; gap:10px; padding:10px 12px; background:var(--bg-0); border:1px solid var(--line-soft); border-radius:8px; }
  .step .no{ font-family:var(--font-mono); color:var(--amber); font-weight:700; font-size:12px; flex:0 0 22px; }
  .step .txt{ font-size:12.5px; color:var(--text-1); line-height:1.5; }
  .step .txt b{ color:var(--text-0); }

  /* ---------- Exam taking ---------- */
  .exam-wrap{ max-width:720px; margin:0 auto; }
  .qcounter{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-2); letter-spacing:1px; margin-bottom:10px; }
  .progressbar{ height:5px; background:var(--bg-2); border-radius:100px; overflow:hidden; margin-bottom:22px; border:1px solid var(--line-soft);}
  .progressbar .fill{ height:100%; background:linear-gradient(90deg,var(--amber),#ffd27a); transition:width .25s; }
  .qcard{ background:var(--bg-1); border:1px solid var(--line); border-radius:12px; padding:22px; }
  .qcard .qtext{ font-size:15.5px; font-weight:600; line-height:1.5; margin-bottom:18px; }
  .opt{
    display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border:1px solid var(--line); border-radius:8px;
    margin-bottom:9px; cursor:pointer; font-size:13px; color:var(--text-1); transition:.12s;
  }
  .opt:hover{ border-color:#454d55; background:var(--bg-2); }
  .opt.selected{ border-color:var(--amber); background:rgba(245,166,35,0.09); color:var(--text-0); }
  .opt .dot{ width:16px;height:16px;border-radius:50%; border:1.5px solid var(--line); flex:0 0 auto; margin-top:1px; position:relative; }
  .opt.selected .dot{ border-color:var(--amber); }
  .opt.selected .dot::after{ content:""; position:absolute; inset:3px; border-radius:50%; background:var(--amber); }

  .exam-nav{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; }

  /* ---------- gauge ---------- */
  .gauge-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:20px 0 6px; }
  .gauge{ width:210px; height:210px; border-radius:50%; position:relative; }
  .gauge .ring{
    position:absolute; inset:0; border-radius:50%;
  }
  .gauge .inner{
    position:absolute; inset:20px; border-radius:50%; background:var(--bg-1); border:1px solid var(--line-soft);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow: inset 0 2px 14px rgba(0,0,0,.5);
  }
  .gauge .needle{
    position:absolute; left:50%; top:50%; width:3px; height:74px; background:var(--text-0);
    transform-origin:50% 100%; border-radius:2px; box-shadow:0 0 6px rgba(255,255,255,.5);
  }
  .gauge .hub{ position:absolute; left:50%; top:50%; width:10px;height:10px; margin:-5px; border-radius:50%; background:var(--text-0); }
  .gauge .pct{ font-family:var(--font-display); font-size:34px; font-weight:700; line-height:1; }
  .gauge .lbl{ font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--text-2); margin-top:6px; }
  .verdict{ font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:.6px; padding:6px 16px; border-radius:100px; }
  .verdict.pass{ background:rgba(62,207,142,.12); color:var(--green); border:1px solid rgba(62,207,142,.4); }
  .verdict.fail{ background:rgba(255,92,92,.12); color:var(--red); border:1px solid rgba(255,92,92,.4); }

  /* ---------- table ---------- */
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-2); padding:9px 10px; border-bottom:1px solid var(--line); }
  td{ padding:10px; border-bottom:1px solid var(--line-soft); color:var(--text-1); }
  tr:hover td{ background:rgba(255,255,255,0.015); }
  td.num{ font-family:var(--font-mono); }
  .score-chip{ font-family:var(--font-mono); font-weight:700; padding:2px 8px; border-radius:5px; font-size:11.5px; }
  .score-chip.good{ background:rgba(62,207,142,.12); color:var(--green); }
  .score-chip.bad{ background:rgba(255,92,92,.12); color:var(--red); }

  .stat-row{ display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .stat{ background:var(--bg-1); border:1px solid var(--line); border-radius:10px; padding:14px 18px; min-width:140px; }
  .stat .v{ font-family:var(--font-display); font-size:24px; font-weight:700; }
  .stat .k{ font-size:10.5px; color:var(--text-2); text-transform:uppercase; letter-spacing:.8px; margin-top:2px;}

  .spinner{ width:16px;height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.25); border-top-color:#181200; animation:spin .7s linear infinite; }
  .spinner.light{ border:2px solid rgba(255,255,255,.15); border-top-color:var(--amber); }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .loading-block{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:60px 20px; color:var(--text-2); }
  .loading-block .needle-spin{ width:60px;height:60px;border-radius:50%; border:3px solid var(--line); border-top-color:var(--amber); animation:spin 1s linear infinite;}

  code.k{ font-family:var(--font-mono); background:var(--bg-0); border:1px solid var(--line-soft); padding:1px 6px; border-radius:4px; font-size:11.5px; color:var(--amber); }

  .backlink{ display:inline-flex; align-items:center; gap:6px; color:var(--text-2); font-size:12px; cursor:pointer; margin-bottom:14px; }
  .backlink:hover{ color:var(--text-0); }

  /* ---------- mobile bottom nav ---------- */
  .bottomnav{
    display:none; position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--bg-1); border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    grid-template-columns:repeat(6,1fr); gap:1px;
  }
  .bottomnav .bnitem{
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px;
    color:var(--text-2); font-size:9.5px; font-weight:600; letter-spacing:.2px; border-radius:8px;
  }
  .bottomnav .bnitem svg{ width:17px;height:17px; }
  .bottomnav .bnitem span{ font-size:8.8px; white-space:nowrap; }
  .bottomnav .bnitem.active{ color:var(--amber); background:rgba(245,166,35,0.08); }

  @media (max-width: 820px){
    .sidebar{ display:none; }
    .content{ padding:14px 14px 76px; }
    .bottomnav{ display:grid; }
    .topbar{ padding:0 14px; height:auto; min-height:54px; flex-wrap:wrap; gap:6px; padding-top:8px; padding-bottom:8px; }
    .topbar h1{ font-size:15.5px; }
    .topbar .sub{ display:none; }
    .topbar .pill{ display:none; }
    .topbar-actions{ width:100%; justify-content:flex-start; }
    .topbar-actions .pill{ display:inline-flex; }
    .topbar-actions .btn.sm{ padding:5px 8px; font-size:10.5px; }
    .grid{ grid-template-columns:1fr; }
    .stat-row{ gap:8px; }
    .stat{ min-width:0; flex:1 1 100px; padding:10px 12px; }
    .stat .v{ font-size:19px; }
    .gauge{ width:180px; height:180px; }
  }
  @media (max-width: 420px){
    .qcard{ padding:16px; }
    .panel{ padding:16px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   SOP EĞİTİM & SINAV SİSTEMİ
   Tek dosyalık uygulama: SOP kütüphanesi + yerleşik soru havuzundan rastgele
   sınav üretimi (API gerektirmez) + online sınav + sonuç kaydı.
   ========================================================================= */

/* Cihazlar arası ORTAK sonuç kaydı için (opsiyonel):
   Bağımsız barındırmada (GitHub Pages vb.) window.storage çalışmadığından
   sonuçlar varsayılan olarak yalnızca o cihazda (localStorage) tutulur.
   Farklı telefonlardaki sonuçları TEK bir yerde toplamak isterseniz, aşağıya
   bir Google Apps Script Web App URL'si yapıştırın - tüm cihazlar sonucu
   otomatik olarak o Google E-Tablo'ya da gönderir. Boş bırakılırsa bu adım
   sessizce atlanır. (Kurulum talimatı sohbette paylaşıldı.) */
const CONFIG = {
  sheetsWebhookUrl: 'https://script.google.com/macros/s/AKfycbzqPm1B8ey8Nd87Pf21WLBw9MoKYIK7TxuPMWVwe4nk44Go1NTAtiZ_AgCa52nMo-I8Ew/exec',
  // Yönetici şifresi - yalnızca istemci tarafı bir engel (gerçek güvenlik değil, bkz. sohbet).
  // Google Apps Script'teki ADMIN_PASSWORD sabitiyle AYNI olmalı (sunucu tarafı gerçek kontrol orada).
  adminPassword: 'Bakim2026',
};

function syncDeleteToSheets(id){
  if(!CONFIG.sheetsWebhookUrl) return;
  try{
    fetch(CONFIG.sheetsWebhookUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'delete', id, passwordHash: state.adminPasswordHash }),
    }).catch(()=>{});
  }catch(e){}
}

function syncResultToSheets(result){
  if(!CONFIG.sheetsWebhookUrl) return;
  try{
    fetch(CONFIG.sheetsWebhookUrl, {
      method: 'POST',
      mode: 'no-cors', // Apps Script web app için gerekli; yanıt okunamaz ama gönderim çalışır
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(result),
    }).catch(()=>{ /* sessiz geç - yerel kayıt zaten yapıldı */ });
  }catch(e){ /* sessiz geç */ }
}

function jsonpRequest(url, timeoutMs){
  return new Promise((resolve, reject) => {
    const cbName = '__sopSinavCb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    const script = document.createElement('script');
    let done = false;
    const cleanup = () => { try{ delete window[cbName]; }catch(e){} if(script.parentNode) script.parentNode.removeChild(script); };
    const timer = setTimeout(() => { if(done) return; done=true; cleanup(); reject(new Error('timeout')); }, timeoutMs || 10000);
    window[cbName] = (data) => { if(done) return; done=true; clearTimeout(timer); cleanup(); resolve(data); };
    script.src = url + (url.indexOf('?')>=0 ? '&' : '?') + 'callback=' + cbName;
    script.onerror = () => { if(done) return; done=true; clearTimeout(timer); cleanup(); reject(new Error('script load error')); };
    document.head.appendChild(script);
  });
}

/* ---------------- Şifre / kimlik doğrulama altyapısı ----------------
   Şifreler SHA-256 ile hashlenip Google E-Tablo'daki ayrı bir "Kimlik
   Bilgileri" sayfasında saklanır - düz metin hiçbir yerde tutulmaz.
   Kullanıcı adı: personel için sicil no'nun başındaki sıfırlar atılmış
   hali (00006752 -> 6752), yönetici için sabit 'admin'. */
const DEFAULT_PERSONNEL_PASSWORD = '123456';

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function sicilToUsername(sicilNo){
  const n = parseInt(String(sicilNo||'').replace(/\D/g,''), 10);
  return isNaN(n) ? String(sicilNo||'') : String(n);
}

async function fetchCredentials(){
  if(!CONFIG.sheetsWebhookUrl) return null;
  try{
    const url = CONFIG.sheetsWebhookUrl + (CONFIG.sheetsWebhookUrl.indexOf('?')>=0?'&':'?') + 'type=credentials';
    const data = await jsonpRequest(url, 10000);
    if(!Array.isArray(data)) return null;
    return data; // [{username, hash, mustChange}]
  }catch(e){ return null; }
}

// Cihaz içi yedek (bulut olmadan da tek cihazda çalışsın diye)
async function getLocalCredentials(){
  const c = await storGet('credentials');
  return Array.isArray(c) ? c : [];
}
async function setLocalCredential(username, hash){
  const list = await getLocalCredentials();
  const i = list.findIndex(c=>c.username===username);
  if(i>=0) list[i].hash = hash; else list.push({username, hash});
  await storSet('credentials', list);
}

async function findCredential(username){
  let cloudList = null;
  if(CONFIG.sheetsWebhookUrl) cloudList = await fetchCredentials();
  if(Array.isArray(cloudList)){
    const found = cloudList.find(c=>String(c.username)===String(username));
    if(found) return found;
  }
  const localList = await getLocalCredentials();
  return localList.find(c=>String(c.username)===String(username)) || null;
}

// Şifre günceller: bulut varsa gönderir (fire-and-forget), sonra doğrulamak için
// kısa bir süre sonra tekrar okuyup gerçekten değiştiğini teyit eder.
async function saveCredential(username, oldHash, newHash){
  await setLocalCredential(username, newHash);
  if(!CONFIG.sheetsWebhookUrl) return true;
  try{
    fetch(CONFIG.sheetsWebhookUrl, {
      method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action:'set-password', username, oldPasswordHash: oldHash, newPasswordHash: newHash }),
    }).catch(()=>{});
  }catch(e){}
  await new Promise(r=>setTimeout(r, 1500));
  const check = await fetchCredentials();
  if(Array.isArray(check)){
    const row = check.find(c=>String(c.username)===String(username));
    if(row && row.hash === newHash) return true;
    if(row && row.hash !== newHash) return false; // sunucu reddetti (eski şifre hatalı)
  }
  return true; // bulutta doğrulanamadıysa da (ör. offline) yerel değişikliği kabul et
}

async function fetchCloudResults(){
  if(!CONFIG.sheetsWebhookUrl) return null;
  try{
    // JSONP kullanılır: Apps Script Web App'lerin GET yanıtları cross-origin fetch()
    // ile her zaman güvenilir okunamıyor (CORS); <script> ile yükleme bu sınırı aşar.
    const data = await jsonpRequest(CONFIG.sheetsWebhookUrl, 10000);
    if(!Array.isArray(data)) return null;
    return data.map(r => ({
      id: r.id || ('cloud-'+r.name+'-'+r.submittedAt),
      sopId: r.sopId || '',
      sopTitle: r.sopTitle || '',
      name: r.name || '',
      dept: r.dept || '',
      personnelId: r.personnelId || null,
      score: Number(r.score)||0,
      total: Number(r.total)||0,
      pct: Number(r.pct)||0,
      submittedAt: typeof r.submittedAt === 'number' ? r.submittedAt : Date.parse(r.submittedAt) || Date.now(),
    }));
  }catch(e){ return null; }
}

Adımlar: 1) Kazan dairesi içindeki dağıtım panosu üzerindeki pompa anahtarları açılarak pompalar çalıştırılır 2) Isıtma kazanları girişindeki doğalgaz vanaları açılır 3) Basınç göstergesi butonuna basılarak doğalgaz basıncının 80 mbar olduğu gözlemlenir. (Dikkat: Basınç yoksa kazan dairesi girişindeki shot-off valf ve deprem sensörü kontrol valfi kontrol edilir.Düşen var ise kurulur.) 4) Kollektör basıncı kontrol edilir. 3 bar olması gerekli. Kollektör basıncı normale ise pompalar bina otomasyonu üzerinden "on" konuma alınır. (Dikkat: Eğer kollektör basıncı 3 bar altına düştü ise kazan üzerindeki basınç prosestatları resetlemek gerekecektir.) 5) Kazan Brülor ekranları, Kazan kontrol panelleri, Kazan kaskad paneli kontrol edilir. Arıza varsa resetlenir. 6) Bina Otomasyonundan Kazan Dairesi sekmesinden Isıtma kazanları "on" konuma alınır.` },

  { id:"YT1SOP11", title:"CHILLER UZUN SÜRELİ DURUŞ ÖNCESİ KAPAMA SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Soğutma sistemi chiller ünitesinin uzun süreli duruş öncesinde güvenli şekilde kapatılması işlemlerini kapsar.
Adımlar: 1) Chiller genel görsel kontrolü yapılır (sızıntı, anormal ses/titreşim). 2) Su/glikol devresi basıncı ve akışı kontrol edilir. 3) Kapatma: kompresör önce durdurulur, su sirkülasyonu bir süre daha devam ettirilir. 4) Su sirkülasyonu da durdurulduktan sonra ana enerji/kumanda devre kesici kapatılır. (Dikkat: Kompresör tam durmadan ana enerji kesilmemelidir.) 5) Uzun süreli duruşta donma riski varsa sistemdeki su/glikol devresi tahliye edilir veya ilgili ısıtıcı bantlar/önlemler devrede tutulur. (Dikkat: Donma kaynaklı boru/eşanjör hasarına karşı önlem alınmalıdır.) 6) Kapatma işlemi, tarih ve yapan kişi bilgisi kayıt formuna işlenir.` },

  { id:"YT1SOP12", title:"CHILLER UZUN SÜRELİ KAPANMA SONRASI AÇMA SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Soğutma sistemi chiller ünitesinin uzun süreli kapanma sonrasında güvenli şekilde devreye alınması işlemlerini kapsar.
Adımlar: 1) Chiller genel görsel kontrolü yapılır (sızıntı, anormal ses/titreşim). 2) Soğutucu akışkan (refrigerant) basıncı göstergeden kontrol edilir, referans aralıkta olduğu teyit edilir. 3) Kondenser/evaporatör yüzeyleri kirlenme yönünden kontrol edilir, gerekiyorsa temizlenir. (Dikkat: Kirli yüzey verim kaybına yol açar.) 4) Su/glikol devresi basıncı ve akışı kontrol edilir, gerekiyorsa tamamlanır. 5) Kompresör yağ seviyesi (varsa) kontrol edilir. 6) Elektrik panosu ve kontrol devresi genel kontrolden geçirilir. 7) Devreye alma: su pompaları önce çalıştırılır, akış sağlandıktan sonra kompresör devreye alınır. (Dikkat: Susuz kompresör çalıştırma ciddi hasara yol açar.) 8) Çalışma basınç/sıcaklık değerleri referansla karşılaştırılır. 9) Kontrol sonuçları kayıt formuna işlenir, anormallikte bakım talebi açılır.` },

  { id:"YT1SOP13", title:"HAVALANDIRMA SANTRALİ UZUN SÜRELİ DURUŞ ÖNCESİ KAPAMA SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Havalandırma santrallerinin (taze hava santralleri) uzun süreli duruş öncesinde kapatılması işlemlerini kapsar.
Adımlar: 1) Bina yönetim sistemi üzerinden taze hava santralleri kapatılır. 2) Dispensing ,Destilasyon alanındaki egzos motorları çalışır halde bırakılır. (Dikkat: Bu bölgeler Exproof alanlardır ve fabrika dursa bile içeride çok çeşitli yanıcı kimyasal bulunur. Bu alanların egzoz santralleri her zaman çalışır durumda olmalıdır.) 3) Kış döneminde ise dış sahada bulunan taze hava santrallerinin ısıtma üç yollu vanaları bina yönetim sistemi üzerinden %10 oranda açık bırakılarak su akışı sağlanarak donmanın önüne geçilir. (Dikkat: Dış ortamda dönen sular Kış döneminde donma riski bulunmaktadır. Su donmasının önüne geçmek için bu hatlardan ve ısıtma bataryalarından belrli miktarlarda su çevirmek önemlidir.)` },

  { id:"YT1SOP14", title:"HAVALANDIRMA SANTRALİ UZUN SÜRELİ DURUŞ SONRASI AÇMA SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Havalandırma santrallerinin (taze hava santralleri) uzun süreli duruş sonrasında devreye alınması (açılması) işlemlerini kapsar.
Adımlar: 1) Kış döneminde ise dış sahada bulunan taze hava santrallerinin ısıtma üç yollu vanaları bina yönetim sistemi üzerinden otomatik moda alınır. 2) Bina yönetim sistemi üzerinden taze hava santralleri ON modunda çalıştırılır.` },

  { id:"YT1SOP21", title:"SOLVENT GERİ KAZANIM TESİSİ KULLANIM SOP (C3Y31)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Solvent Geri Kazanım Tesisi'nin günlük kontrolleri ve işletmesini kapsar.
Adımlar: 1) Tank kapasiteleri ve haftalık tüketim oranları sürekli önceki hafta ile karşılaştırılır; sıkıntılı durumlar kayıt altına alınıp yöneticiye bildirilir, prosesi durdurmayacak şekilde minimum 1 haftalık stokla çalışılması sağlanır. 2) Anlaşılamayan konularda D65-002.R00.696 SRP nolu tesis kullanım kılavuzundan destek alınır, yine anlaşılamıyorsa yöneticiden destek alınır. 3) Tesis sarfları (nitrojen, kuru hava, analiz kalibrasyon tüpleri, su şartlandırma kimyasalları) sürekli kontrol edilip eksik bırakılmaz. 4) Destilasyon kolon üretim hızları takip edilip standart dışı durumlar kayıt altına alınarak yöneticiye bildirilir. 5) Her hafta başında etil alkol, etil asetat ve high boiling çıktıları hem Nira Analizör'de analiz edilir, hem de birer numune laboratuvara yönlendirilerek çapraz kontrol sağlanır. 6) Bölüm içindeki cihazların günlük gözle kontrolleri (kaçak, sesli çalışma) gerçekleştirilir. 7) Her gün bölüm içi temizlik kontrolleri gerçekleştirilir.` },

  { id:"YT1SOP23", title:"SICAK SU KAZANLARI PERİYODİK BAKIM SOP (C3Y02)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Sıcak su kazanlarının periyodik (yıllık) bakımının yapılması işlemini kapsar.
Adımlar: 1) Pompaların kir tutucu filtrelerinin temizliği yapılır. (Dikkat: Tıkalı filtre debiyi düşürür ve pompaya aşırı yük bindirir.) 2) Gaz filtresi değiştirilir. (Dikkat: Değişim öncesi gaz beslemesi kesilip LOTO-Elektrik/Mekanik prosedürüne uyulur.) 3) Elektrik panosu enstrüman bağlantılarının sıkılık kontrolü yapılır. (Dikkat: Gevşek bağlantı ısınma ve yangın riski taşır.) 4) Pompa ve blower vibrasyon ve akım kontrolü yapılır. 5) Kazan basınç testi yapılır. (Dikkat: Test öncesi alan çevresi boşaltılır; test, üretici/yönetmelik limitlerine göre yapılır.) 6) Kazan çıkışı 3 yollu valfin kalibrasyon kontrolü yapılır. 7) Brülör ayarı yapılır. (Dikkat: Ayar sonrası CO/CO2 ölçümü ile yanma verimliliği teyit edilmelidir - hatalı ayar CO birikimi riski taşır.) 8) Giriş-çıkış pompalarının yatakları yağlanır (6 aylık bakımda). 9) Çıkış kolektörü sıcaklık sensörleri ve 2 yollu valfin kalibrasyon kontrolleri yapılır.` },

  { id:"YT1SOP24", title:"SOLVENT GERİ KAZANIM TESİSİ PERİYODİK BAKIM VE ANALİZ SOP (C3Y03)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Solvent geri kazanım tesisinin periyodik bakımı ve emisyon/kalite analizlerinin yapılması işlemini kapsar.
Adımlar: 1) Emisyon analiz (CO/CO2) cihazlarının kalibrasyonu yapılır (3 aylık bakımda). (Dikkat: Bkz. CO/CO2 Analizör Kalibrasyon SOP - hatalı kalibre cihaz yanlış emisyon okumasına yol açar.) 2) Saha pompaları kontrol edilir, yatakları yağlanır (6 aylık bakımda). 3) Blower filtreleri kontrol edilir, kirliyse değiştirilir (aylık bakımda). (Dikkat: Tıkalı filtre blower verimini düşürür ve motora aşırı yük bindirir.) 4) Soğutma kulesi fanları yağlanır (6 aylık bakımda). 5) Alkol ve asetat analizleri yapılır (haftalık bakımda). (Dikkat: Numune alımı sırasında solvent buharına maruziyet riski vardır; iyi havalandırılan alanda ve uygun KKD ile çalışılmalıdır.) 6) Tesis genel görsel kontrolü yapılır; sızıntı, anormal koku, yanıcı buhar birikimi olmadığı teyit edilir. (Dikkat: Solvent buharı patlayıcı ortam oluşturabilir, iyi havalandırma şarttır.) 7) Bulgular ve analiz sonuçları kayıt formuna işlenir, anormallikte bakım talebi açılır.` },

  { id:"YT1SOP26", title:"CHILLER PERİYODİK YILLIK BAKIM SOP (C3Y05)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Chiller ünitesinin yıllık periyodik bakımının yapılması işlemini kapsar.
Adımlar: 1) Chiller serpantin temizliği yapılır (6 aylık bakımda). 2) Giriş-çıkış fark basınç kontrolleri yapılır. 3) Giriş-çıkış sıcaklık kontrolleri yapılır. 4) Pompa vibrasyon ve akım kontrolleri yapılır. 5) Antifriz seviyesi ve yoğunluk ölçümleri yapılır. 6) Elektrik enstrüman sıkılık kontrolleri yapılır. (Dikkat: Gevşek bağlantı ısınma/yangın riski taşır.) 7) Free cooling fanlarının vibrasyon ve akım kontrolleri yapılır. 8) Giriş-çıkış pompalarının yatakları yağlanır (6 aylık bakımda). 9) Genel kurulum kontrolü yapılır. 10) Sistem teşhisleri (diagnostics) doğrulanır. 11) Ünite durdurulur. 12) Ünite LOTO-Elektrik SOP'una göre izole edilir. (Dikkat: Soğutucu akışkan devresinde bakım öncesi enerji tamamen kesilmelidir.) 13) Kondenser serpantin kontrolü yapılır. 14) Evaporatör akış anahtarı (flow switch) testi yapılır. 15) Starter paneli kontrol edilir. 16) Motor izolasyon kontrolü yapılır. 17) Yağ seviyesi kontrol edilir. 18) Kondenser fan kontrolü yapılır. 19) Ünite güç kaynağı açılır (LOTO kaldırılarak). 20) Yağ ısıtıcıları kontrol edilir. 21) Soğutucu akışkan kaçak kontrolü yapılır. (Dikkat: Kaçak tespitinde derhal servis çağrılmalı, alan havalandırılmalıdır.) 22) Ünite çalıştırılır. 23) Ünite verileri (log) devreye alınır. 24) Sub-cooling (aşırı soğutma) kontrolü yapılır. 25) İş alanı temizlenir.` },

  { id:"YT1SOP27", title:"ABS (ABSORBSİYONLU) CHILLER YILLIK BAKIM SOP (C3Y06)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Absorbsiyonlu (ABS) chiller ünitesinin yıllık bakımının yapılması ve yetkili servis eşliğinde yürütülmesi işlemini kapsar.
Adımlar: 1) Kule temizliği ve pislik tutucu temizliği yapılır (6 aylık bakımda). 2) Kule fanı yağlanır. 3) Kule fanı ve chiller pompalarının vibrasyon kontrolleri yapılır. 4) Kule fanı ve chiller pompaları yağlanır. 5) Sistem vakum kontrolü yapılır. (Dikkat: ABS chiller düşük vakumda çalışır; vakum kaybı verim düşüklüğüne ve hasara yol açabilir.) 6) Vakum değeri uygun değilse vakum pompası çalıştırılır. 7) Bakım periyodu geldiğinde yetkili servis firması çağrılır. 8) Servis ekibi tesise güvenli bir şekilde (ziyaretçi/emniyet kuralları uygulanarak) alınır. 9) Servis ekibinin talep ettiği ekipmanlar temin edilir. 10) Bakım süreci boyunca servis ekibine refakat edilir. (Dikkat: LiBr (lityum bromür) çözeltisi ve düşük basınç sistemine sadece yetkili servis müdahale eder.) 11) Bakım sonrası ünite servis firmasından güvenli şekilde teslim alınır.` },

  { id:"YT1SOP28", title:"HAVALANDIRMA SANTRALLERİ (KLİMA SANTRALLERİ-AHU) PERİYODİK BAKIM SOP (C3Y07)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Havalandırma santralleri ve klima santrallerinin (AHU) periyodik bakımının yapılması işlemini kapsar.
Adımlar: 1) Filtrelerin kirlilik kontrolü yapılır, kirliyse değiştirilir (aylık bakımda). (Dikkat: Tıkalı filtre debiyi düşürür, enerji tüketimini artırır.) 2) Sıcak su vanalarının kaçak kontrolü yapılır (yıllık bakımda). 3) Fark basınç sensörleri kontrol edilir (yıllık bakımda). 4) Isı geri kazanım damper kontrolleri yapılır (yıllık bakımda). 5) Sıcaklık sensörleri kontrol edilir (yıllık bakımda). 6) Motor vibrasyonları kontrol edilir (yıllık bakımda). 7) Fan motor yatakları yağlanır (6 aylık bakımda). 8) Sistem üzerinde çalışma öncesi AHU LOTO-Elektrik SOP'una göre enerjisiz hale getirilir (bakım gerektiren müdahalelerde). 9) Fan/motor bağlantıları ve tahrik kayışı (varsa) aşınma yönünden kontrol edilir. 10) Isıtıcı/soğutucu batarya yüzeyleri kirlenme yönünden kontrol edilir. 11) Damper mekanizmalarının (taze hava/egzoz) çalışır durumda olduğu kontrol edilir. 12) Kondens tavası ve drenaj hattının tıkanıklık olmadığı kontrol edilir. (Dikkat: Tıkanma su taşmasına yol açar.) 13) Nem alma/nemlendirme ünitesi (varsa) kontrol edilir. 14) LOTO kaldırılır, sistem devreye alınır; hava debisi/sıcaklığı kontrol edilerek sonuçlar kayıt formuna işlenir.` },

  { id:"YT1SOP29", title:"KOMPRESÖR-KURUTUCU PERİYODİK BAKIM VE HAVA TANKI KONTROL SOP (C3Y08)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Kompresör-kurutucu ünitesinin periyodik (8000 saatlik dahil) bakımı ile kurutucu ve hava tankının periyodik kontrolünün yapılması işlemini kapsar.
Adımlar: 1) Hava giriş bölmesi kontrol edilir. 2) Emniyet valfi (safety valve) switchi kontrol edilir. (Dikkat: Arızalı emniyet valfi aşırı basınç riski oluşturur.) 3) Sensör civata bağlantıları kontrol edilir. 4) Elektrik motoru temizlenir. (Dikkat: LOTO-Elektrik SOP'una göre enerjisiz hale getirilerek yapılır.) 5) Ana motor gres ile yağlanır. 6) Yağ sensör kartuşu değiştirilir. 7) Soğutucu bloklar temizlenir. 8) Yağ doldurma valfi kontrol edilir. 9) Soğutma fanı kontrol edilir. 10) Hava, su ve yağ kaçakları kontrol edilir. 11) Yağ ve son soğutucu (aftercooler) temizliği kontrol edilir. 12) Gaz ballastı temizlenir, rotor balansı kontrol edilir. 13) Hava filtresi kontrol edilir. 14) Hava, yağ, su ve sıcaklık servis değerleri kaydedilir. 15) Kompresör yağı değiştirilir. 16) Kompresör yağ filtresi değiştirilir. 17) Kayış gerginliği (varsa, pistonlu tiplerde) kontrol edilir. 18) Basınç şalteri ayarları kontrol edilir. 19) Kondens tahliye sistemi (otomatik/manuel) kontrol edilir. 20) Kurutucu genel görsel kontrolü yapılır (sızıntı, anormal ses). 21) Çiy noktası (dew point) göstergesi kontrol edilir, referans değerde olduğu teyit edilir. (Dikkat: Yüksek çiy noktası hatlarda yoğuşmaya yol açar.) 22) Kurutucu tipi soğutmalı ise soğutucu akışkan basıncı kontrol edilir; adsorbsiyonlu ise kartuş/desikan durumu kontrol edilir. 23) Kurutucu ön/son filtreleri kontrol edilir, kirli olanlar değiştirilir. 24) Hava tankı gövdesi korozyon/hasar yönünden kontrol edilir. 25) Tank emniyet valfi fonksiyonu kontrol edilir. 26) Tank otomatik kondens tahliye valfi çalışması kontrol edilir. (Dikkat: Tıkalı tahliye tankta su birikimine yol açar.) 27) Tank üzerindeki basınç göstergesi doğruluğu kontrol edilir.` },

  { id:"YT1SOP31", title:"JENERATÖR PERİYODİK (6 AYLIK) BAKIM SOP (C3Y10)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Jeneratörün 6 aylık periyodik bakımının yapılması işlemini kapsar.
Adımlar: 1) Radyatör temizliği yapılır. 2) Akü değişimi yapılır (gerekiyorsa). (Dikkat: Akü sökülürken önce eksi (-) kutup, takılırken önce artı (+) kutup bağlanır - kısa devre riskini önler.) 3) Radyatör su seviyesi ve antifriz yoğunluk kontrolleri yapılır. 4) Motor yağ seviyesi kontrolü yapılır. 5) Akü asit bomesi ile akü asit seviyesi kontrol edilir. (Dikkat: Akü asidi cilt/göz tahrişine yol açar, uygun KKD kullanılmalıdır.) 6) Akü voltaj kontrolü yapılır. 7) Mazot seviyesi kontrol edilir (haftalık kontrolde). 8) Mazot filtresi değiştirilir. 9) Yağ filtresi değiştirilir.` },

  { id:"YT1SOP32", title:"DUMAN-ISI DEDEKTÖRÜ FİZİKSEL TEMİZLİK VE TEST SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Yangın alarm sistemi duman/ısı dedektörlerinin fiziksel temizliği ve fonksiyon testi işlemlerini kapsar.
Adımlar: 1) Test öncesi ilgili bölge/panelin test modunda olduğu (yanlış alarm önleme) panele bildirilir. 2) Dedektör dış yüzeyi toz/kir yönünden kontrol edilir, gerekiyorsa yumuşak fırça/hava ile temizlenir. (Dikkat: Kirli dedektör hatalı algılamaya yol açabilir.) 3) Dedektör kapağı (varsa) açılarak iç kısım kontrol edilir. 4) Test spreyi (duman simülasyonu) veya ısı kaynağı ile fonksiyon testi yapılır. 5) Panelde ilgili bölgenin alarm sinyali verdiği teyit edilir. 6) Test sonrası dedektör resetlenir, panel normal moda alınır. 7) Arızalı/hatalı çalışan dedektör tespit edilirse değiştirilir veya servis çağrılır. 8) Test sonuçları kayıt formuna işlenir.` },

  { id:"YT1SOP33", title:"GAZ TÜPÜ (LPG-OKSİJEN-ASETİLEN) DEPOLAMA VE GÜVENLİ DEĞİŞİM SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Kaynak/kesme işlerinde kullanılan gaz tüplerinin (oksijen, asetilen, LPG) güvenli depolanması ve değişimi işlemlerini kapsar.
Adımlar: 1) Tüpler dik konumda, sabitlenmiş (zincir/kelepçe ile) ve birbirinden ayrı (oksijen-yanıcı gaz) depolanır. (Dikkat: Oksijen ve yanıcı gaz tüplerinin birlikte depolanması yangın/patlama riskini artırır.) 2) Depolama alanı iyi havalandırılan, ateş kaynağından uzak bir yer olmalıdır. 3) Boş tüp değişiminde önce vana kapatılır, hat basıncı tahliye edilir. 4) Regülatör eski tüpten sökülür, tüp valfi/regülatör bağlantı yüzeyi temizlenir. 5) Yeni tüp güvenlik kontrolünden geçirilir (hasar, son test tarihi). 6) Regülatör yeni tüpe takılır, bağlantı sızdırmazlığı sabunlu su ile kontrol edilir. 7) Tüp taşıma sırasında uygun tüp arabası kullanılır. (Dikkat: Tüpler yuvarlanarak/sürüklenerek taşınmaz.) 8) Değişim kayıt formuna işlenir. 9) Boş tüpler "BOŞ" olarak işaretlenip ayrı alanda depolanır.` },

  { id:"YT1SOP34", title:"HİDROFOR SİSTEMİ PERİYODİK KONTROL SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Hidrofor (basınçlandırma) sisteminin periyodik kontrolünü kapsar.
Adımlar: 1) Hidrofor genel görsel kontrolü yapılır (sızıntı, anormal ses). 2) Sistem basıncı (start/stop basınç değerleri) manometreden kontrol edilir. 3) Hidrofor tankı (varsa) hava yastığı basıncı kontrol edilir. (Dikkat: Yetersiz hava yastığı pompanın sık devreye girmesine yol açar.) 4) Pompaların otomatik start/stop döngüsü gözlemlenir. 5) Kuru çalışma koruma (su baskını) sensörünün çalıştığı kontrol edilir. 6) Motor akım değerleri kontrol edilir. 7) Vana pozisyonları (emme/basma) kontrol edilir. 8) Kontrol sonuçları kayıt formuna işlenir, anormallikte bakım talebi açılır.` },

  { id:"YT1SOP35", title:"CO-CO2 ANALİZ CİHAZI KALİBRASYON SOP (C3Y21)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Solvent Geri Kazanım tesisi içerisindeki CO/CO2 analiz cihazının kalibrasyon işlemini kapsar.
Adımlar: 1) CO/CO2 kalibrasyon gazı tüp vanası yaklaşık 1 bar olacak şekilde açılır. 2) SPAN/SAMPLE vanası SPAN yönüne çevrilir. 3) Span vanası yardımıyla cam manometredeki değer 1-2 bar arasında tutulacak şekilde ayarlanır. 4) Cihaz ekran tuşlarından Enter'a basılıp Calibration menüsüne girilir. 5) IR Channels menüsüne girilerek üst/alt yön tuşlarıyla CO veya CO2 kanalı seçilir. 6) Set Span Gas Values menüsüne girilip Span 1-2 seçeneklerinden birine kalibrasyon tüpü üzerindeki sertifika değerleri girilir (her iki gaz için tekrarlanır). (Dikkat: Tüp sertifikasındaki değerin yanlış girilmesi tüm kalibrasyonu hatalı hale getirir.) 7) Calibration menüsüne dönülüp Calibr. IR-Channels'a girilir; ilgili gaz seçilip Start cal. MR1+2'ye basılır. 8) Okunan değer sabitlendiğinde ekrandaki talimata göre Enter'a basılarak numune gaz değeri ile eşitlenir (her iki gaz için tekrarlanır). 9) İşlem bittiğinde vanalar eski (SAMPLE) pozisyonuna getirilir ve tüp vanası kapatılır.` },

  { id:"YT1SOP36", title:"DEMİNERALİZE SİSTEMİ KULLANIM SOP (C3Y19)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Demineralize (iyon değiştirici) su sisteminin sertlik/kalite testi ve rejenerasyon işlemlerinin nasıl yapılacağını kapsar.
Adımlar: 1) Sistem üzerindeki etiketli "numune vanası"ndan 50 cl numune alınır. 2) Numuneye 1 paket buffer-indikatör toz çözeltisi ilave edilip çalkalanır. 3) Renk yeşil-maviye dönene kadar B (titrasyon) çözeltisinden damla damla ilave edilir; damlalar sayılır. (Dikkat: Her damla 1 Alman sertlik derecesine eşittir. Demineralize su için hedef sertlik değeri 1 Alman sertlik derecesidir.) 4) Ölçüm sonucu hedef değerin üzerindeyse (su sert çıkarsa) tuz seviyesi kontrol edilir, eksikse tamamlanır. 5) Kontrol paneli üzerinden "R" tuşuna basılı tutularak rejenerasyon işlemi başlatılır. 6) Rejenerasyon tamamlandıktan sonra sertlik ölçümü tekrarlanır. (Dikkat: Rejenerasyon sonrası hâlâ hedefin üzerinde sertlik tespit edilirse ilgili amire bildirilir - reçine ömrünü tamamlamış olabilir.) 7) Günlük tuz seviyesi kontrol edilir, eksildikçe tamamlanır.` },

  { id:"YT1SOP37", title:"DİZEL JENERATÖR HAFTALIK ÇALIŞTIRMA VE PERİYODİK TEST SOP (C3Y29)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Dizel jeneratörün ihtiyaç anında sorunsuz çalışabilmesi için haftalık rutin çalıştırma kontrolünü ve periyodik yük/ATS testini kapsar. Jeneratör, jeneratör radyatörü, ısıtıcılar, aküler ve mazot tankını kapsar.
Adımlar: 1) Çalıştırma öncesi jeneratör gövdesinde yağ, su ve mazot kaçağı gözle kontrol edilir. 2) Yağ seviyesi çubuktan (dipstick) kontrol edilir; seviye MIN-MAX aralığının altındaysa tamamlanır. (Dikkat: Motor sıcakken kontrol edilmez, yanık riski taşır.) 3) Akü voltajları multimetre ile kontrol edilir; akü şarj cihazının şarj ettiği gösterge üzerinden teyit edilir. 4) Rezistans ısıtmaları kontrol edilir. 5) Radyatör temizliği ve V kayışı gerginliği/çatlak durumu kontrol edilir. 6) Hava filtresi kirlilik göstergesi (varsa) kontrol edilir. 7) Mazot seviyesi (tank göstergesinden) ve su seviyesi (çalıştırmadan önce radyatör kapağı açılarak) kontrol edilir. (Dikkat: Radyatör kapağı sıcak motorda açılmamalı, yanık riski taşır.) 8) Yakıt filtresi/su ayırıcısından periyodik su tahliyesi yapılır (aylık bakım planında belirtilen haftalarda). 9) Egzoz susturucusu ve boru bağlantılarında sızıntı/hasar kontrolü yapılır. 10) Jeneratöre start verilip 15 dakika boşta çalıştırılır; çalışma sırasında yağ basıncı, su sıcaklığı, gerilim (V) ve frekans (Hz) göstergeleri ile panel üzerindeki alarm/arıza kodları kontrol edilir. (Dikkat: Anormal ses, titreşim veya duman görülmesi halinde jeneratör derhal durdurulup ilk amirine bilgi verilir.) 11) Çalıştırma işlemi bitince AUTO moda alınır. (Dikkat: AUTO moda alınmazsa gerçek bir kesintide jeneratör otomatik devreye girmez.) 12) Çalışma saati sayacı (hour meter) okunarak kayıt formuna işlenir. 13) Etraf tekrar kontrol edilip kaçak kontrolü yapılır; jeneratör odası havalandırma menfezlerinin açık, yangın söndürücünün yerinde ve dolu olduğu teyit edilir. 14) Bu talimat her hafta Cumartesi günleri tekrarlanır. 15) Otomatik transfer switch (ATS) fonksiyonu (varsa) şebeke kesintisi simülasyonu ile test edilir. (Dikkat: Şebeke kesintisinde otomatik devreye girme kontrol edilmelidir.) 16) Mümkünse yük altında (yük bankası veya gerçek yük transferi ile) test edilir. 17) Test süresi boyunca egzoz/gürültü seviyesi ve sızıntı kontrolü yapılır.` },

  { id:"YT1SOP38", title:"KİMYASAL ARITMA İŞLETME SOP (C3Y17)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Kimyasal arıtma tesisinin işletilmesi (kimyasal hazırlama, sistem çalıştırma, çamur bertarafı) işlemlerini kapsar.
Adımlar: 1) Sistem tankları doluluk oranı arıtmaya uygun olduğunda Touch panel üzerinde "START" izni gelir. 2) Baryum klorür tankına 50 kg baryum klorür eklenip üzerine su eklenerek varil doldurulur. (Dikkat: Baryum klorür toksiktir; karıştırma sırasında kimyasal eldiven, gözlük ve maske kullanılmalıdır.) 3) Kireç-kostik tankına 100 lt sıvı kostik, 100 lt su eklenerek hazırlanır. (Dikkat: Kostik (sodyum hidroksit) ciltte ciddi yanığa yol açar; sıçrama riskine karşı yüz siperi kullanılmalıdır.) 4) Anyonik poli tankına 1 su bardağı anyonik poli tozu eklenip üzerine su eklenerek varil doldurulur. 5) Katyonik poli tankına 1 su bardağı katyonik poli tozu eklenip üzerine su eklenerek varil doldurulur. 6) Demir(III) klorür tankında yeterli (50 kg) kimyasal olup olmadığı kontrol edilir. 7) Touch panel üzerindeki "START" butonuna basılır (Şifre: 1234). 8) Sistem otomatik olarak çalışır; süreç takip edilir. 9) Arıtma süreci bittikten sonra, dengeleme havuzundaki suyun reaksiyon havuzuna aktarılması için "START" butonuna basılır. 10) Çamur tankındaki çamuru filtrelemek için havalı pompa çalıştırılır. 11) Çamur basma işlemi bittikten sonra, filtrelerdeki çamur çamur arabasına boşaltılır. 12) Çamur arabası, çamur atık alanında palet üzerindeki torbalara boşaltılır; torba ağızları bağlanarak Tehlikeli Atık Formu ile Geri Dönüşüm Bölümü'ne iletilir.` },

  { id:"YT1SOP39", title:"KİMYASAL ARITMA PERİYODİK KONTROL SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Proses/atık suyu kimyasal arıtma sisteminin periyodik kontrolünü kapsar.
Adımlar: 1) Arıtma ünitesi genel görsel kontrolü yapılır (sızıntı, kimyasal depolama durumu). 2) Kimyasal dozaj pompalarının çalıştığı ve dozaj oranlarının ayarlara uygun olduğu kontrol edilir. 3) pH, iletkenlik gibi proses parametreleri ölçülür, referans aralıkla karşılaştırılır. 4) Kimyasal tank seviyeleri kontrol edilir, gerekiyorsa ikmal yapılır. (Dikkat: Kimyasal aktarımında ilgili Güvenlik Bilgi Formu (SDS) talimatlarına uyulmalıdır.) 5) Karıştırıcı/havalandırıcı ekipmanların çalıştığı kontrol edilir. 6) Çamur/arıtma atığı tahliye sistemi kontrol edilir. 7) Numune alınarak laboratuvar analizi (gerekiyorsa) yapılır. 8) Kontrol sonuçları kayıt formuna işlenir, anormallikte bakım talebi açılır.` },

  { id:"YT1SOP40", title:"KIZGIN YAĞ KAZANLARI YILLIK BAKIM SOP (C3Y12)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Kızgın yağ kazanlarının yıllık bakımının yapılması işlemini kapsar.
Adımlar: 1) Pompaların kir tutucu filtrelerinin temizliği yapılır. 2) Gaz filtresi değiştirilir. (Dikkat: Değişim öncesi gaz beslemesi kesilmelidir.) 3) Elektrik panosu enstrüman sıkılık kontrolü yapılır. (Dikkat: Gevşek bağlantı ısınma/yangın riski taşır.) 4) Pompa ve blower vibrasyon ve akım kontrolü yapılır. 5) Kazan basınç testi yapılır. (Dikkat: Test öncesi alan çevresi boşaltılır.) 6) Kazan çıkışı 3 yollu valf kalibrasyon kontrolü yapılır. 7) Brülör ayarı yapılır. (Dikkat: Ayar sonrası CO/CO2 ölçümü ile yanma verimliliği teyit edilmelidir.) 8) Giriş-çıkış pompalarının yatakları yağlanır.` },

  { id:"YT1SOP41", title:"KOMPRESÖR ÇALIŞTIRMA SOP (C3Y30)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Kompresör ve kompresör gruplarının sağlıklı çalışacak şekilde devreye alınmasını kapsar. Kompresörler, kurutucular, hava tankları, hat filtreleri ve tahliye vanalarını kapsar.
Adımlar: 1) Çalıştırmadan önce yağ ve hava kaçağı kontrolü yapılır. 2) Kompresör dış kaset filtresi kirliliği kontrol edilir, gerekiyorsa temizlenir. 3) Kompresör üzerinden set edilen hava basınç değeri kontrol edilir. 4) Kumanda panelindeki alarm ve arıza kontrolü yapılır. 5) Kompresör çalışma saatleri kontrol edilir; 4000 saatte bir kompresör eş yaşlandırma yapılır ve her değişimde kontrol formuna işlenir. 6) Kompresördeki su tahliye valfinin çalışma durumu kontrol edilir. 7) Hava kurutucu çiğlenme sıcaklığının 5 derecenin altında olduğu kontrol edilir. (Dikkat: Problem çözülemeyecek durumdaysa ilgili kurutucu durdurulup diğeri devreye alınmalı; durdurulan kurutucunun vanaları kapatılıp çalıştırılanın açık olması çok önemlidir.) 8) Hava kurutucunun su tahliye selenoid valfleri kontrol edilir. 9) Hat filtre kirlilik durumu kontrol edilir. 10) Genel hat vana kontrolleri yapılır.` },

  { id:"YT1SOP42", title:"HİJYEN (B FABRİKA) KIZGIN YAĞ SİSTEMİ DEVREYE ALMA SOP (C3Y22)", category:"Yardımcı Tesisler",
    content:`KAPSAM: B Fabrika Kızgın Yağ Mekanik Dairesi'ndeki hijyen kızgın yağ sisteminin güvenli şekilde devreye alınması işlemini kapsar.
Adımlar: 1) Acil stop butonunun basılı olmadığı, sistem basıncı ve pompa vana pozisyonları kontrol edilir. 2) Panel alarm sayfasında aktif alarm olmadığı kontrol edilir. (Dikkat: Aktif alarm varken sistem devreye alınmaz.) 3) Pompalar ve ana sistem pako şalterlerinin OTO (otomatik) konumda olduğu kontrol edilir. 4) Panel üzerinden Local moda geçilir (Kullanıcı Adı: trigen / Şifre: trigen59). 5) Basınç seti 2 bar olarak ayarlanır. 6) Sıcaklık seti 150°C olarak ayarlanır. (Dikkat: Set sıcaklığı üretim reçetesine göre değişebilir; yetkisiz set değişikliği yapılmamalıdır.) 7) Herhangi bir pompa sekmesine girilip oransal vana PID sayfasında referans seçiminin yağ gidiş sıcaklığına göre olduğu kontrol edilir. 8) Alarm sayfası tekrar kontrol edilerek alarm olmadığı teyit edilir. 9) Ana sayfadan power simgesine dokunularak sisteme start verilir.` },

  { id:"YT1SOP43", title:"KOMPANZASYON ATIK SİGORTA KONTROL VE DEĞİŞİM SOP (C3Y23)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Tüm AG (alçak gerilim) odalarındaki kompanzasyon panolarındaki sigortaların kontrolü ve değişimini kapsar.
Adımlar: 1) Pano kapağı açılarak sigorta pimleri üzerinde atma göstergesi olup olmadığına bakılır. (Dikkat: Pano açılmadan önce dış yüzeyde ısınma/deformasyon belirtisi olup olmadığı da kontrol edilmelidir.) 2) Atmış sigorta varsa, sigortanın beslemesi kesilir. (Dikkat: Beslemesi kesilmeden sigortaya müdahale edilmez.) 3) Atmış sigorta uygun aparat yardımıyla çıkarılır. 4) Çıkarılan atmış sigortanın yerine aynı değerde (amper) yeni sigorta takılır. (Dikkat: Yanlış amperde sigorta kullanımı yangın riski oluşturur.) 5) Beslemesi açılarak devreye alınır. 6) Açık olan pano kapağı kapatılır.` },

  { id:"YT1SOP44", title:"KOMPANZASYON SİSTEMİ AYLIK KONTROL SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Güç faktörü düzeltme (kompanzasyon) panosunun aylık periyodik kontrolünü kapsar.
Adımlar: 1) Pano genel görsel kontrolü yapılır (sızıntı, ısınma izi, anormal ses/koku). (Dikkat: Şişmiş/deforme kondansatör tehlike işaretidir, derhal devre dışı bırakılmalıdır.) 2) Güç faktörü (cos φ) değeri röle/ölçüm cihazından okunur, hedef aralıkta olduğu kontrol edilir. 3) Kademe (basamak) kontaktörlerinin devreye girip çıkma sırası gözlemlenir. 4) Kondansatör gövdelerinde şişme/deformasyon olup olmadığı kontrol edilir. (Dikkat: Şişmiş kondansatör derhal devre dışı bırakılıp değiştirilmelidir.) 5) Bağlantı noktalarının sıkılığı ve ısınma izi (varsa termal kamera ile) kontrol edilir. 6) Harmonik filtre (varsa) sigortaları ve göstergeleri kontrol edilir. 7) Havalandırma fanlarının çalıştığı ve filtrelerin temiz olduğu kontrol edilir. 8) Kontrol sonuçları (cos φ değeri, gözlemler) kayıt formuna işlenir; anormallikte bakım talebi açılır.` },

  { id:"YT1SOP45", title:"NİRA ANALİZ CİHAZI MANUEL KULLANIM SOP (C3Y24)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Nira marka kalıntı solvent analiz cihazının manuel (şırınga ile numune enjeksiyonu) kullanım işlemini kapsar.
Adımlar: 1) Analiz edilecek numune temiz bir kapla alınır; hat biraz tahliye edildikten sonra kap çalkalanıp boşaltılır, ardından tekrar doldurulur. 2) Cihaz klavyesinden Esc tuşuna basılıp mevcut analizin sonlanması beklenir. 3) Numune girişi kapağı Open yönünde açılır, özel şırınga için delikli aparat monte edilip sıkılır. 4) Klavyeden F4 (Single Front) tuşuna, ardından F5 tuşuna basılarak işlem başlatılır. 5) Cam şırınga ile numuneden 3-4 kez alınıp boşaltılarak şırınga içi temizlenir; ardından 5 mg numune şırıngaya çekilir. (Dikkat: Solvent numunesiyle cilt teması riski taşır; kimyasal eldiven kullanılmalıdır.) 6) Cam şırınga hazneye takılıp beklenir. 7) Ekranda "Introduce mixture" yazısı çıktığında numune şırınga ile yavaşça enjekte edilir. 8) Cihaz numuneyi yaklaşık 8 dakika analiz eder; işlem bitince F6 (Print) tuşu ile sonuç çıktısı alınır, Esc ile çıkış yapılır. 9) Şırınga ve aparat çıkarılır, orijinal kapak takılıp Closed yönünde sıkılır. 10) F5 tuşu ile sistem tekrar başlatılarak bekleme (idle) moduna alınır.` },

  { id:"YT1SOP46", title:"NIRA NEPTUNE 801 HİDROJEN GAZ TÜPÜ DEĞİŞİMİ VE GÜVENLİĞİ SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Nira Neptune 801 cihazının FID dedektörü için gerekli 4,5 saflık hidrojen gaz tüpünün güvenli değişimi ve depolanması işlemlerini kapsar.
Adımlar: 1) Hidrojen tüpü dik konumda, sabitlenmiş ve iyi havalandırılan, ateş kaynağından uzak bir alanda depolanır. (Dikkat: Hidrojen son derece yanıcı ve geniş patlama aralığına (%4-75) sahip bir gazdır.) 2) Tüp değişimi öncesi cihazın hidrojen beslemesi cihaz üzerinden veya ana vanadan kapatılır. 3) Boşalan/basıncı düşen tüpün vanası kapatılır, regülatör sökülür. 4) Yeni tüpün saflık derecesi (4,5 grade) ve basıncı (3 bar besleme için uygun) kontrol edilir. 5) Regülatör yeni tüpe takılır, bağlantı sızdırmazlığı sabunlu su ile kontrol edilir. (Dikkat: Hidrojen kaçağı görünmez ve kokusuzdur; sabunlu su testi bu nedenle zorunludur.) 6) Tüp vanası yavaşça açılır, besleme basıncı cihaz gereksinimine (3 bar) göre ayarlanır. 7) Cihazın otomatik hidrojen kapama sisteminin (anomali durumunda basınç/akış anomalisinde beslemeyi otomatik kesen) aktif olduğu bilinerek çalışmaya devam edilir. 8) Cihaz açılışında alev sensörü/ateşleme durumu ekrandan kontrol edilir. 9) Boş tüp "BOŞ" olarak işaretlenip diğer tüplerden ayrı bir alanda depolanır. 10) Değişim kayıt formuna işlenir.` },

  { id:"YT1SOP47", title:"NIRA NEPTUNE 801 KALİBRASYON SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Nira Neptune 801 kalıntı solvent analiz cihazının periyodik kalibrasyonu (standart kalibrasyon karışımı ile) işlemlerini kapsar.
Adımlar: 1) Sertifikalı standart kalibrasyon karışımı (bilinen solvent konsantrasyonlarında) hazırlanır/temin edilir. 2) Cihaz üzerindeki doğrudan sıvı enjeksiyonuna ayrılmış ek sızdırmazlık noktası (seal) kullanılarak standart karışım cihaza enjekte edilir. 3) Dokunmatik ekrandan kalibrasyon modu seçilir. 4) Cihaz standardı analiz eder; ölçülen değerler referans sertifika değerleriyle karşılaştırılır. 5) Sapma toleransın dışındaysa cihazın kalibrasyon eğrisi (response factor) güncellenir. 6) Farklı konsantrasyonda ikinci bir standartla doğrulama yapılır (çok noktalı kalibrasyon). 7) Kalibrasyon sonucu (tarih, standart bilgisi, sapma) kayıt formuna işlenir. 8) Kalibrasyon tarihi sisteme not edilir, bir sonraki kalibrasyon tarihi planlanır.` },

  { id:"YT1SOP48", title:"NIRA NEPTUNE 801 KALINTI SOLVENT NUMUNE ANALİZİ SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Nira Neptune 801 hızlı kalıntı solvent analiz cihazı ile baskılı/laminasyonlu esnek ambalaj filmlerinde kalıntı solvent ölçümü işlemlerini kapsar.
Adımlar: 1) Cihazın basınçlı hava (3 bar) ve hidrojen (4,5 saflık, 3 bar) beslemelerinin açık ve stabil olduğu kontrol edilir. (Dikkat: FID dedektörü hidrojen olmadan çalışmaz; besleme kesikse cihaz analiz başlatmaz.) 2) Cihaz açılır, endüstriyel PC ve dokunmatik ekran arayüzünün hazır hale geldiği teyit edilir. 3) Analiz edilecek film numunesi bilinen bir alan/ağırlıkta, üretici talimatına uygun boyutta kesilir. 4) Numune, açık uçlu numune şişesine (vial, ~20 ml iç hacim) yerleştirilir ve cihazın ön yüzündeki entegre headspace bölmesine takılır. 5) Headspace kapağı, yüksek sıcaklığa dayanıklı sızdırmazlık contasıyla hermetik olarak kapatılır. (Dikkat: Kapağın tam kapanmadığı durumlarda hatalı/düşük sonuç alınabilir.) 6) Dokunmatik ekrandan analiz başlatılır; cihaz desorpsiyon çevrimi sırasında numune iç basıncını otomatik izler. 7) Otomatik valf, birkaç mikrolitre numuneyi doğrudan kapiler kolona enjekte eder. 8) Analiz tamamlandığında (ürüne göre yaklaşık 7-12 dakika) sonuç raporu (tarih/saat, tekil solvent konsantrasyonları, toplam kalıntı solvent mg/m²) ekranda görüntülenir ve kurumsal ağa PDF olarak kaydedilir. 9) Bir sonraki analizden önce sistem, önceki analizden kalan kirliliği temizlemek için basınçlı hava ile otomatik olarak temizlenir. 10) Numune şişesi (vial) çıkarılır, kullanılan numune ve atıklar uygun şekilde bertaraf edilir. 11) Sonuç değerleri ilgili limit/şartname değerleriyle karşılaştırılır; sapma varsa ilgili proses ekibine (baskı/laminasyon) bildirilir.` },

  { id:"YT1SOP49", title:"NIRA TAURUS ANALİZÖR CİHAZI KALİBRASYON SOP (C3Y25)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Solvent Geri Kazanım Tesisi power room'daki Nira Taurus analizörün kalibrasyon işlemini kapsar.
Adımlar: 1) ESC tuşuna basılarak cihaz Standby moduna alınır; tüm gaz değerlerinin yeşil aralıkta olduğu kontrol edilir. 2) F2 tuşuna basılıp şifre (123) girilerek Calibration moduna geçilir. 3) Doğru kalibrasyon gaz vanası açılır, akış olduğu teyit edilip Enter'a basılır. 4) Analiz sonunda Enter'a basılır; bu işlem her 3 konsantrasyondaki gaz için tekrarlanır. (Dikkat: Yanlış konsantrasyon sırası kalibrasyonu hatalı hale getirir, tüplerin sırası dikkatle takip edilmelidir.) 5) İşlem sonunda gaz vanaları kapatılır. 6) ESC ile standby moduna, ardından F5 ile analiz moduna geri alınıp cihaz bu şekilde bırakılır.` },

  { id:"YT1SOP50", title:"PARATONER (YILDIRIMLIK) PERİYODİK KONTROLÜ SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Fabrika paratoner sisteminin periyodik kontrolü işlemlerini kapsar.
Adımlar: 1) Paratoner ucu (air terminal) genel görsel kontrolü (hasar, korozyon) yapılır. (Dikkat: Yükseklik gerektiriyorsa Yüksekte Çalışma SOP'una uyulmalıdır.) 2) İniş iletkenleri (down conductor) süreklilik ve bağlantı sağlamlığı kontrol edilir. 3) Topraklama bağlantı noktaları görsel kontrol edilir. 4) Topraklama direnci ölçülür, referans değerin altında olduğu teyit edilir. 5) Bağlantı klemensleri korozyon/gevşeklik yönünden kontrol edilir. 6) Sistem süreklilik testi (varsa) yapılır. 7) Anormallik tespit edilirse (kopukluk, yüksek direnç) derhal bakım/onarım talebi açılır. 8) Kontrol sonuçları kayıt formuna işlenir.` },

  { id:"YT1SOP51", title:"SOLVENT GERİ KAZANIM TESİSİ PERİYODİK KONTROL-DEVREYE ALMA-KAPAMA SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Solvent geri kazanım (recovery) tesisinin periyodik kontrolü ile devreye alma/kapatma işlemlerini kapsar.
Adımlar: 1) Tesis dairesi genel görsel kontrolü yapılır; sızıntı, anormal koku, yanıcı buhar birikimi olmadığı teyit edilir. (Dikkat: Solvent buharı patlayıcı ortam oluşturabilir, iyi havalandırma şarttır.) 2) Gaz algılama sensörlerinin (LEL) çalışır durumda ve kalibreli olduğu kontrol edilir. 3) Solvent tank seviyeleri (besleme/toplama) kontrol edilir, taşma/boşalma riski değerlendirilir. 4) Buhar yoğuşturucu (kondenser) soğutma suyu akışı ve sıcaklığı kontrol edilir. 5) Aktif karbon adsorbsiyon üniteleri (varsa) doygunluk durumu kontrol edilir. (Dikkat: Doymuş karbon verim düşüklüğüne yol açar.) 6) Devreye alma: sistem sırasıyla (fan/vantilatör, kondenser, pompa) üretici prosedürüne göre başlatılır. 7) Çalışma basınç/sıcaklık/debi değerleri referans aralıkla karşılaştırılır. 8) Kapatma: proses durdurulur, sistem soğuma/boşaltma sırasına göre kapatılır. (Dikkat: Ani kapatma sistem içinde solvent birikimine yol açabilir.) 9) Acil durdurma (emergency stop) butonlarının çalışır durumda olduğu kontrol edilir. 10) Kontrol sonuçları kayıt formuna işlenir, anormallikte bakım talebi açılır.` },

  { id:"YT1SOP52", title:"SOLVENT AKTARIM TALİMATI (TANKERDEN TANKA) SOP (C3Y14)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Tankerden depolama tanklarına solvent aktarım işlemini kapsar.
Adımlar: 1) Gelen tırın ADR (tehlikeli madde taşımacılığı) evrak ve ekipman kontrolleri yapılır. (Dikkat: Eksik/geçersiz ADR belgesi olan araca aktarım yapılmaz.) 2) Gelen tırdan numune alınır. (Dikkat: Numune alımı sırasında solvent buharına maruziyet riski vardır; uygun KKD ile yapılır.) 3) Tır ile birlikte gelen şahit numune ve analiz raporu teslim alınır. 4) Tırdan alınan numune analiz için, şahit numune ve analiz raporu ise arşivlenmek üzere laboratuvara teslim edilir. 5) Laboratuvardan numune analiz sonucunun uygunluk bilgisi gelmesi beklenir. (Dikkat: Uygunluk onayı gelmeden aktarıma kesinlikle başlanmaz.) 6) Aktarım öncesi kimyasal eldiven, gözlük ve elektrostatik (antistatik) ayakkabı giyilir. (Dikkat: Statik elektrik solvent buharını tutuşturabilir; elektrostatik ayakkabı zorunludur.) 7) Topraklama ünitesinin maşası tırın şasesine bağlanarak topraklama yapılır. (Dikkat: Ünite üzerindeki yeşil uyarı ışığı yanmadan aktarıma başlanmaz - topraklama statik kıvılcım/patlama riskini önler.) 8) Aktarım yapılacak tank ile hortum bağlantıları yapılır. 9) Aktarım yapılacak tank vanası, kumanda panosu üzerindeki anahtar ON konumuna getirilerek açılır ve aktarıma başlanır. 10) Aktarım bittiğinde anahtar OFF konumuna alınarak vana kapatılır. 11) Topraklama maşası ve hortum bağlantıları sökülür. 12) İrsaliye, ADR vb. evraklar Teknik Depo Sorumlusu'na iletilir.` },

  { id:"YT1SOP53", title:"SOLVENT GERİ KAZANIM TESİSİ SARF TÜP DEĞİŞİM SOP (C3Y26)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Tesis içindeki sarf tüplerin (kalibrasyon/proses gazı vb.) güvenli şekilde değişim işlemini kapsar.
Adımlar: 1) Tüpler üzerindeki manometre ile basınçları kontrol edilir. 2) 1. tüp boşsa 3 yönlü vana valfi dolu tüp istikametine çevrilir. (Dikkat: Vana yönü yanlış çevrilirse proses gaz akışı kesintiye uğrayabilir.) 3) Biten tüplerin üzerindeki vanalar kapatılır. 4) Biten tüpler sökülerek yerine dolu tüpler takılır. 5) Vanalar açılarak hava/gaz kaçağı olup olmadığı kontrol edilir.` },

  { id:"YT1SOP54", title:"SU YUMUŞATMA SİSTEMİ KULLANIM SOP (C3Y16)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Su yumuşatma sisteminin sertlik testi, tuz kontrolü ve rejenerasyon işlemlerinin nasıl yapılacağını kapsar.
Adımlar: 1) Yumuşatma cihazı üzerindeki etiketli "numune vanası"ndan 50 cl numune alınır. 2) Numuneye 1 paket buffer-indikatör toz çözeltisi ilave edilip çalkalanır. 3) Renk yeşil-maviye dönene kadar B (titrasyon) çözeltisinden damla damla ilave edilir; damlalar sayılır. (Dikkat: Her damla 1 Alman sertlik derecesine eşittir. Sistemin olması gereken sertlik değeri 1 Alman sertlik derecesidir.) 4) Su sert çıkarsa tuz seviyesi kontrol edilir, eksikse tamamlanır. 5) Kontrol panelinden "R" tuşuna basılı tutularak rejenerasyon işlemi başlatılır. 6) Rejenerasyon tamamlandıktan sonra sertlik ölçümü tekrarlanır. (Dikkat: Rejenerasyon sonrası hâlâ sertlik tespit edilirse ilgili amire bildirilir.) 7) Günlük klor seviyesi kontrol edilir, eksildikçe tamamlanır.` },

  { id:"YT1SOP55", title:"SU YUMUŞATMA SİSTEMİ PERİYODİK BAKIM-REJENERASYON SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Su yumuşatma (softener) sisteminin periyodik bakımı ve rejenerasyon işlemlerini kapsar.
Adımlar: 1) Sistem genel görsel kontrolü yapılır (sızıntı, reçine tankı durumu). 2) Çıkış suyu sertliği test kiti ile ölçülür, referans değerin altında olduğu teyit edilir. 3) Tuz (rejenerasyon) tankı seviyesi kontrol edilir, gerekiyorsa tuz ilave edilir. 4) Rejenerasyon döngüsü (otomatik/manuel) başlatılır. (Dikkat: Reçinenin sertlik giderme kapasitesini geri kazanması için gereklidir.) 5) Rejenerasyon sırasında geri yıkama, tuzlu su emme, durulama aşamalarının sırayla gerçekleştiği gözlemlenir. 6) Rejenerasyon sonrası çıkış suyu tekrar test edilir. 7) Valf pozisyonları (servis/rejenerasyon) kontrol edilir. 8) Sistem basıncı ve akışı kontrol edilir. 9) Kontrol ve rejenerasyon sonuçları kayıt formuna işlenir.` },

  { id:"YT1SOP56", title:"SOĞUK SU SİRKÜLASYON POMPALARI BAKIM-DEVREYE ALMA SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Soğuk su sistemi sirkülasyon pompalarının periyodik bakımı ve devreye alma işlemlerini kapsar.
Adımlar: 1) Pompa LOTO-Elektrik SOP'una göre enerjisi kesilir, kilitlenir. 2) Pompa gövdesi/bağlantılar sızıntı, korozyon yönünden kontrol edilir. 3) Salmastra/mekanik keçe durumu kontrol edilir, gerekirse değiştirilir. 4) Motor-pompa akuplasyonu kontrol edilir. 5) Yataklama gres/yağlama durumu kontrol edilir. 6) Motor akım değerleri referans değerlerle karşılaştırılır. 7) Bakım sonrası LOTO kaldırılır, vana konumları (proses hattına açık) teyit edilir. 8) Pompa çalıştırılır, sistemin su ile dolu olduğu teyit edilerek kuru çalıştırma önlenir. 9) Basınç/akış/titreşim kontrol edilir, sonuçlar kayıt formuna işlenir.` },

  { id:"YT1SOP57", title:"SICAK SU SİRKÜLASYON POMPALARI BAKIM-DEVREYE ALMA SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Sıcak su sistemi sirkülasyon pompalarının periyodik bakımı ve devreye alma işlemlerini kapsar.
Adımlar: 1) Pompa LOTO-Elektrik SOP'una göre enerjisi kesilir, kilitlenir. 2) Pompa gövdesi/bağlantılar sızıntı yönünden kontrol edilir. (Dikkat: Sıcak su sızıntısı yanık riski taşır.) 3) Salmastra/mekanik keçe durumu kontrol edilir. 4) Motor-pompa akuplasyonu kontrol edilir. 5) Yataklama gres/yağlama durumu kontrol edilir. 6) Motor akım değerleri kontrol edilir. 7) Bakım sonrası LOTO kaldırılır, vana konumları teyit edilir. 8) Pompa çalıştırılır, sistemin su ile dolu olduğu teyit edilerek kuru çalıştırma önlenir. (Dikkat: Sıcak su sisteminde kuru çalıştırma ciddi hasara yol açar.) 9) Basınç/akış/titreşim/sıcaklık kontrol edilir, sonuçlar kayıt formuna işlenir.` },

  { id:"YT1SOP58", title:"SOĞUTMA GRUBU KONTROL SOP (C3Y33)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Soğutma sistemlerinin günlük kontrollerini kapsar. Soğutma grupları, sirkülasyon pompaları, kolektörler, debimetre/kalorimetreler ve tortu ayırıcıları içerir.
Adımlar: 1) Kontroller öncesinde ve sonrasında mahal kapıları mutlaka master anahtar ile açılıp tekrar kilitlenir. 2) Tüm cihazların gözle ve kulakla kontrolü yapılır; anormal akıntı veya sesli çalışma durumu mutlaka amire bildirilir. 3) Pompa grubu pano ekranlarından pompaların çalışma durumu kontrol edilir. 4) Pano ekranından fark basınç seti kontrol edilip doğruluğu teyit edilir (setler pano yanındaki etikette belirtilmiştir). 5) Dönüş ve gidiş kolektöründeki normal basınç değerleri (pompa panosu üzerinde belirtilen) teyit edilir. 6) Basınç eksikliği varsa nedeni bulunup amire bildirilir; gerekli miktarda antifirizli su ile takviye yapılıp basınç düzeltilir, sağlandıktan sonra vanalar kapatılıp durum izlenir. 7) Soğutma grubu ana ekranında alarm durumu kontrol edilir. 8) Alarm varsa mutlaka amire bildirilir; resetlenerek alarmın kalıcı olup olmadığı kontrol edilir. 9) Soğutma grubu sıcaklık setleri, bir cihaz diğerinden 1 derece yüksek olacak şekilde girilir. 10) Tortu ayırıcılar 6 ayda bir kontrol edilip temizlenir; kirlilik gözlemlenirse amire bildirilir. 11) Debimetre ve kalorimetre çalışma durumları ve değerleri kontrol edilir. 12) Chiller içinde veya etrafında yağ/su kaçağı olup olmadığı kontrol edilir. 13) Chiller kompresöründe anormal sesli çalışma veya yağ kaçağı olup olmadığı kontrol edilir.` },

  { id:"YT1SOP59", title:"SOĞUTMA KULESİ PERİYODİK BAKIM SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Soğutma kulesinin periyodik bakım ve kontrolünü kapsar.
Adımlar: 1) Kule genel görsel kontrolü yapılır (yapısal hasar, su sızıntısı). 2) Su seviyesi (havuz) kontrol edilir, otomatik doldurma (make-up) valfinin çalıştığı teyit edilir. 3) Fan/motor ve kayış (varsa) kontrol edilir. 4) Dolgu malzemesi (fill) kirlenme/tıkanma yönünden kontrol edilir. (Dikkat: Kirli dolgu soğutma verimini düşürür.) 5) Su dağıtım nozulları tıkanıklık yönünden kontrol edilir. 6) Su kalitesi (kimyasal dozaj, Legionella riski açısından biyosit uygulaması) kontrol edilir. (Dikkat: Soğutma kuleleri Legionella üremesi için uygun ortam oluşturabilir, düzenli kimyasal muamele şarttır.) 7) Blöf (blowdown) sistemi çalışması kontrol edilir. 8) Kule çevresi/havuzu periyodik temizlenir. 9) Kontrol sonuçları kayıt formuna işlenir, anormallikte bakım talebi açılır.` },

  { id:"YT1SOP60", title:"SU DEPOSU PERİYODİK TEMİZLİK-KONTROL SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Fabrika su depolarının periyodik temizlik ve kontrolünü kapsar.
Adımlar: 1) Depo boşaltılmadan önce alternatif su beslemesi/stok durumu değerlendirilir. 2) Depo giriş/çıkış vanaları kapatılır, depo boşaltılır. 3) Depo içine giriş gerekiyorsa Kapalı Alanda Çalışma SOP'una göre izin alınır ve atmosfer testi yapılır. 4) Depo iç yüzeyleri (tortu, biyofilm, alg) temizlenir. 5) Yapısal hasar (çatlak, korozyon) kontrol edilir. 6) Depo durulanır, temizlik kimyasalı kalıntısı kalmadığı teyit edilir. 7) Depo tekrar doldurulur, su kalitesi (bulanıklık, klor vb.) test edilir. 8) Vanalar normal işletim konumuna getirilir. 9) Temizlik/kontrol sonuçları kayıt formuna işlenir.` },

  { id:"YT1SOP66", title:"YANGIN DİZEL POMPASI HAFTALIK ÇALIŞTIRMA SOP (C3Y18)", category:"Yardımcı Tesisler",
    content:`KAPSAM: Yangın dizel pompa grubunun haftalık rutin test çalıştırması işlemini (ön kontroller ve panel üzerinden test prosedürü dahil) kapsar.
Adımlar: 1) Pompa dairesine gidilir; dizel pompa grubunun genel görsel kontrolü yapılır (sızıntı, hasar, anormal durum). 2) Yakıt seviyesi kontrol edilir (yakıt tankı göstergesinden); minimum seviyenin altında ise ikmal talep edilir. 3) Motor yağ seviyesi ve soğutma suyu seviyesi kontrol edilir; eksikse tamamlanır. 4) Akü (batarya) voltajı ve şarj durumu kontrol edilir (genelde 2 bağımsız akü grubu bulunur). 5) Trijen ofiste, dizel pompa çalışıyor alarmını resetleyecek bir görevlinin hazır olduğu teyit edilir. (Dikkat: Test öncesi ilgili birimlere haber verilmesi yanlış alarm karmaşasını önler.) 6) Dizel pompa kendi kontrol panosu üzerinden "OFF" konumuna alınır. 7) Üzerinde "1" ve "2" etiketi bulunan dizel pompa çıkış vanaları kapatılır. 8) Kontrol panosu üzerinden pako şalter "Manuel" konuma alınır. 9) "Crank-1" veya "Crank-2" butonlarına basılarak dizel pompa çalıştırılır. 10) Pompa minimum 10 dakika, maksimum 20 dakika (haftalık rutin) çalıştırılır; bu süre boyunca motor çalışma parametreleri (RPM, sıcaklık, basınç) izlenir. 11) Kontrol panosu üzerinden "Stop" butonuna basılır ve pako "OFF" konuma alınır. 12) "1" ve "2" numaralı vanalar tekrar açılır. (Dikkat: Vanalar açık bırakılmazsa gerçek bir yangında sistem su veremez - bu adım kesinlikle atlanmamalıdır.) 13) Kontrol panosu üzerinden pako "Auto" konumuna alınır. (Dikkat: Panel Auto modda bırakılmazsa gerçek yangında pompa otomatik devreye girmez.) 14) Test sonuçları (start süresi, deşarj basıncı, çalışma süresi, gözlemler) kayıt formuna işlenir; anormallik varsa bakım talebi oluşturulur.` },

  { id:"YT1SOP67", title:"ISITMA KAZANLARI KAPAMA SOP", category:"Yardımcı Tesisler",
    content:`KAPSAM: Isıtma kazanlarının (Kazan Dairesi) uzun süreli kapanma öncesinde güvenli şekilde kapatılması işlemlerini kapsar.
Adımlar: 1) Bina Otomasyonundan Kazan Dairesi sekmesinden Isıtma kazanları "off" konuma alınır. (Dikkat: Sıcak Odalar dikkate alınmalıdır ve Kış dönemi ısıtma sistemindeki suyun kazanlar çalışmasa da sistemde döndürülmesi önemlidir. Dış alandaki taze hava santrallerinin bataryalarının donma durumunda delinmesi önlenmiş olur. Isıtma kazanları "off" konuma alındıktan sonra brülör ve pompalar otomatik duracaktır. Gözlemlenmesi gerekmektedir.) 2) Kazanın girişindeki doğalgaz vanası kapatılır 3) Bina otomasyonundan Kazan Dairesi Sekmesinden Isıtma Pompaları "off" konuma alınır. (Dikkat: Pompalar otomatik olarak duracaktır. Daha sonrasında gözlemlenmesi gerekir.)` },

  { id:"I1SOP1", title:"ALÇIPAN DUVAR MONTAJI SOP", category:"İnşaat",
    content:`KAPSAM: İç mekan bölme duvarlarının alçıpan (alçı levha) sistemiyle montajı işlemlerini kapsar.
Adımlar: 1) Duvar güzergahı proje/ölçüye göre zemine ve tavana işaretlenir. 2) Metal profil (kenar/tavan/taban) iskeleti dübel ile sabitlenir. (Dikkat: Sabitleme aralığı üretici talimatına uygun olmalıdır.) 3) Dikme profiller belirlenen aralıklarla iskelete monte edilir. 4) Duvar içi geçecek elektrik/tesisat hatları (varsa) bu aşamada yerleştirilir. 5) Yalıtım malzemesi (ses/ısı yalıtımı gerekiyorsa) profiller arasına yerleştirilir. 6) Alçıpan levhalar vidalarla profillere sabitlenir. (Dikkat: Vida aralığı ve derinliği üretici talimatına uygun olmalıdır; çok sıkılan vida levhayı yırtar.) 7) Levha birleşim derzleri file bant ve alçı macunla düzeltilir (bantlama-macunlama). 8) Yüzey zımparalanır, gerekiyorsa astar/boya öncesi son kontrol yapılır. 9) Alan temizlenir, atık malzemeler uygun şekilde bertaraf edilir. 10) Uygulama kayıt formuna işlenir.` },

  { id:"I1SOP2", title:"BOYA ATÖLYESİ-İŞLERİ ÇALIŞMA TALİMATI", category:"İnşaat",
    content:`KAPSAM: Boya atölyesi ve saha boya işlerinde uyulması gereken güvenlik kurallarını kapsar.
Adımlar: 1) Boya işlemi öncesi ortamın havalandırması sağlanır. (Dikkat: Boya buharları yanıcı ve sağlığa zararlı olabilir.) 2) Boya/tiner malzemeleri orijinal ambalajında, uygun etiketli ve güvenlik bilgi formuna (SDS) uygun saklanır. 3) Çalışma alanında ateş kaynağı/sıcak yüzey bulunmadığı kontrol edilir. (Dikkat: Boya buharları patlayıcı ortam oluşturabilir.) 4) Uygulama öncesi yüzey hazırlığı (temizlik, zımparalama) yapılır. 5) Uygun solunum maskesi (organik buhar filtresi) ve KKD giyilir. 6) Boya karışımı üretici talimatına göre (oran, inceltme) hazırlanır. 7) Uygulama (fırça/rulo/püskürtme) yapılır, çevredeki yüzeyler örtülerek korunur. 8) Kullanılan fırça/ekipman uygun solvent ile temizlenir, atık uygun şekilde bertaraf edilir. 9) Boyanan alan kuruyana kadar erişime kapatılır, uyarı levhası asılır. 10) İş bitiminde alan havalandırılır, atıklar (boyalı bez, boş kutular) uygun şekilde bertaraf edilir.` },

  { id:"I1SOP3", title:"ÇATI BAKIMI VE SU YALITIMI KONTROLÜ SOP", category:"İnşaat",
    content:`KAPSAM: Fabrika çatısının periyodik bakımı ve su yalıtımı kontrolü işlemlerini kapsar.
Adımlar: 1) Çatıya çıkış için Yüksekte Çalışma SOP'una uygun güvenlik önlemleri (yaşam hattı, emniyet kemeri) alınır. 2) Çatı yüzeyi genel görsel kontrolü yapılır (çatlak, şişme, yırtık membran). 3) Dere/oluk ve yağmur suyu tahliye ağızları tıkanıklık yönünden kontrol edilir. (Dikkat: Tıkanıklık su birikmesine ve sızıntıya yol açar.) 4) Çatı geçişleri (baca, havalandırma çıkışı vb.) etrafındaki yalıtım detayları kontrol edilir. 5) Membran/kaplamada hasar tespit edilirse onarım (yama/kaplama) yapılır. 6) Çatı üzerindeki yabancı malzeme/birikinti temizlenir. 7) İç mekanda tavan/duvar üzerinde su izi olup olmadığı ayrıca kontrol edilir. 8) Kontrol/onarım sonuçları kayıt formuna işlenir.` },

  { id:"I1SOP4", title:"KALIP-İNŞAAT İŞLERİ GENEL TALİMATI", category:"İnşaat",
    content:`KAPSAM: Betonarme kalıp kurma/söküm ve genel inşaat destek işlerinde uyulması gereken güvenlik kurallarını kapsar.
Adımlar: 1) Kalıp kurulacak alan bariyer ile çevrilir, geçiş güzergahları işaretlenir. 2) Kalıp malzemesi (ahşap/metal) hasar yönünden kontrol edilir, hasarlı malzeme kullanılmaz. 3) Kalıp iskeletinin statik olarak yeterli desteklenmiş (payanda, dikme) olduğu kontrol edilir. (Dikkat: Yetersiz destekleme çökme riski taşır.) 4) Yükseklik gerektiren kalıp işlerinde Yüksekte Çalışma SOP'una uygun ekipman kullanılır. 5) Beton dökümü sırasında kalıp basıncı/deformasyonu gözlemlenir. 6) Kalıp söküm zamanı, beton priz süresine (mühendis onayına) göre belirlenir. (Dikkat: Erken söküm çökme riski taşır.) 7) Söküm sırasında düşen parçalara karşı alt bölge boşaltılır/bariyer edilir. 8) Kullanılan malzemeler düzenli istiflenir, çivi/keskin uçlar bükülür. 9) İş bitiminde alan temizlenir, atık malzemeler bertaraf edilir.` },

  { id:"I1SOP5", title:"KAPI MONTAJI SOP", category:"İnşaat",
    content:`KAPSAM: İç/dış mekan kapı (kasa+kanat) montajı işlemlerini kapsar.
Adımlar: 1) Kapı boşluğu ölçüleri kapı kasası ölçüsüyle karşılaştırılır, gerekiyorsa boşluk düzeltilir. 2) Kapı kasası boşluğa yerleştirilir, su terazisi ile düşey/yatay hizası kontrol edilir. (Dikkat: Hizasız kasa kapının düzgün açılıp kapanmasını engeller.) 3) Kasa takoz/kama ile geçici sabitlenir, hizalama tekrar kontrol edilir. 4) Kasa duvara vida/dübel veya köpük ile kalıcı sabitlenir. 5) Kapı kanadı menteşelere takılır, açılma-kapanma hareketi kontrol edilir. 6) Kilit/kolye mekanizması monte edilir, fonksiyon testi yapılır. 7) Kasa-duvar arası boşluk (varsa) uygun malzemeyle (köpük/dolgu) doldurulur. 8) Kapı çevresi kaplama/pervaz montajı yapılır. 9) Son fonksiyon kontrolü (açma/kapama/kilit) yapılır. 10) Uygulama kayıt formuna işlenir.` },

  { id:"I1SOP6", title:"KANALİZASYON-YAĞMUR SUYU DRENAJ SİSTEMİ KONTROLÜ SOP", category:"İnşaat",
    content:`KAPSAM: Fabrika saha kanalizasyon ve yağmur suyu drenaj sisteminin periyodik kontrolü işlemlerini kapsar.
Adımlar: 1) Izgara/rögar kapakları genel görsel kontrolü yapılır (kırık, tıkanıklık). 2) Izgaralardaki yabancı madde/çöp temizlenir. 3) Rögar içi seviye ve tıkanıklık kontrol edilir. (Dikkat: Rögara girilmesi gerekiyorsa Kapalı Alanda Çalışma SOP'una uyulmalıdır.) 4) Drenaj hatlarında geriye akış/taşma belirtisi olup olmadığı kontrol edilir. 5) Yağ tutucu/kum tutucu üniteler (varsa) doluluk yönünden kontrol edilir, gerekirse boşaltılır. 6) Saha yüzey eğimleri ve su birikinti noktaları gözlemlenir. 7) Tespit edilen tıkanıklık/hasar giderilir veya bakım talebi açılır. 8) Kontrol sonuçları kayıt formuna işlenir.` },

  { id:"EB2SOP1", title:"EXTRUDER KULE KALİBRASYONU SOP", category:"Elektrik Bakım",
    content:`KAPSAM: Extruder kule kalibrasyonu talimatı SOP içerir.
Adımlar: 1) Şifreyi giriniz ("4711") 2) Encoder görüntüsü (çökme ünitesi) “burn” işlemi görünene kadar fonksiyon tuşuna basın. 3) Multinip'i hizalamak için alt çekme ünitesini alt Motorla birlikte Servis alanında çalıştırın, böylece kabartmalı boyut (Poz. 1 alt köprü (Poz. 2)) dişli köprüsü ile hizalama sistemi arasında görünür (mezura kullanılan kalıp alanları referans noktası göstergesi ile kırmızı olarak işaretlenmiştir). 4) Kabartma değeri ayarlandıktan sonra, 3. konumdaki gibi bir açılı braket takılmalıdır. Daha sonra, üst köprüdeki yuvadan (çift T'nin kenarları kırmızıyla işaretlenmiştir) geçirerek bir ağırlık kullanacaksınız. Daha sonra, ağırlığın ucu yan plakada bulunan kırmızı çizgiye gelene kadar üst motoru çalıştıracaksınız. 5) Bu noktada, aşağıdaki resimde 4. konumda gösterildiği gibi ikinci açılı braketi dişli ünitesine vidalayacaksınız. Açı braketi takıldıktan sonra, ilk döndürme çubuğu ile sapan soğutma silindiri arasındaki sol ve sağ taraftaki halkayı (sargıyı) kontrol edeceksiniz. 6) Sol ve sağ ölçü uyuşmuyorsa, ayarlama kapak plakalarının altında bulunan 4 adet vida (Poz. 5) ile yapılır (yuvarlak flanş, uzun delikler). Son vida yalnızca haul-off (çekiş ünitesi) döndürüldüğünde sıkılabilir. Aynı işlemi sapma yapan soğutma merdanesi için ikinci döndürme çubuğuna da uygulayacaksınız. 7) Tüm ayarlar tamamlandıktan sonra makineye kısa süreli start verilerek kule hizalamasının doğru yapıldığı gözle kontrol edilir.` },

  { id:"EB2SOP2", title:"EXTRUDER MDO ÜNİTESİ GAP-1 KALİBRASYONU TALİMATI", category:"Elektrik Bakım",
    content:`KAPSAM: Extruder mdo ünitesi GAP-1 kalibrasyonu talimatını içerir.
