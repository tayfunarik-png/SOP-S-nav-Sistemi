<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SOP Eğitim &amp; Sınav Sistemi</title>
<meta name="theme-color" content="#101316" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SOP Sınav" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#101316;
    --bg-1:#181c20;
    --bg-2:#20252a;
    --bg-3:#282e34;
    --line:#343b42;
    --line-soft:#2a3037;
    --text-0:#eef1f4;
    --text-1:#b8c0c9;
    --text-2:#7c8792;
    --amber:#f5a623;
    --amber-dim:#8a5f16;
    --amber-glow: rgba(245,166,35,0.35);
    --green:#3ecf8e;
    --red:#ff5c5c;
    --blue:#4ea1ff;
    --font-display:'Oswald', 'Arial Narrow', sans-serif;
    --font-body:'Inter', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', 'Consolas', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg-0);color:var(--text-0);font-family:var(--font-body);}
  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(245,166,35,0.06), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(78,161,255,0.05), transparent 40%);
  }
  ::selection{background:var(--amber);color:#1a1200;}
  a{color:inherit;}
  button{font-family:inherit;}

  #app{ min-height:100vh; display:flex; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:230px; flex:0 0 230px; background:var(--bg-1); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:22px 16px; gap:4px;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:26px; padding:0 6px;}
  .brand .mark{
    width:34px;height:34px;border-radius:6px;background:linear-gradient(160deg,var(--amber),#c97e0f);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
    font-weight:700;color:#181200;font-size:16px; flex:0 0 auto;
    box-shadow:0 0 0 1px rgba(0,0,0,0.3), 0 0 18px var(--amber-glow);
  }
  .brand .txt{ line-height:1.15; }
  .brand .txt .l1{font-family:var(--font-display);font-weight:600;font-size:14.5px;letter-spacing:.3px;}
  .brand .txt .l2{font-size:10.5px;color:var(--text-2);letter-spacing:1.2px;text-transform:uppercase;}

  .navgroup-label{ font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--text-2); margin:16px 10px 6px; }
  .navitem{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer;
    color:var(--text-1); font-size:13.5px; font-weight:500; border:1px solid transparent; transition:.15s;
    user-select:none;
  }
  .navitem svg{ width:16px;height:16px;flex:0 0 auto; opacity:.85;}
  .navitem:hover{ background:var(--bg-2); color:var(--text-0); }
  .navitem.active{ background:rgba(245,166,35,0.10); border-color:rgba(245,166,35,0.35); color:var(--amber); }
  .navitem.active svg{ opacity:1; }

  .sidebar-foot{ margin-top:auto; padding:12px 10px; border-top:1px solid var(--line-soft); font-size:10.5px; color:var(--text-2); line-height:1.5;}

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    height:60px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent);
  }
  .topbar h1{ font-family:var(--font-display); font-size:18px; font-weight:600; margin:0; letter-spacing:.3px;}
  .topbar .sub{ font-size:11.5px; color:var(--text-2); margin-top:2px;}
  .content{ flex:1; overflow-y:auto; padding:26px; }

  .pill{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:600; letter-spacing:.6px; text-transform:uppercase;
         padding:4px 10px; border-radius:100px; border:1px solid var(--line); color:var(--text-2);}
  .pill.live{ color:var(--green); border-color:rgba(62,207,142,.35); background:rgba(62,207,142,.08);}
  .pill.closed{ color:var(--text-2); }

  /* ---------- cards / grid ---------- */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .card{
    background:var(--bg-1); border:1px solid var(--line); border-radius:10px; padding:16px;
    display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden;
  }
  .card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--line-soft);}
  .card.tag-amber::before{ background:var(--amber); }
  .card.tag-green::before{ background:var(--green); }
  .card h3{ margin:0; font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:.2px; line-height:1.3;}
  .card p{ margin:0; font-size:12.5px; color:var(--text-1); line-height:1.5; }
  .card .meta{ display:flex; gap:14px; font-size:11px; color:var(--text-2); font-family:var(--font-mono);}
  .card .row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
    border-radius:7px; border:1px solid var(--line); background:var(--bg-2); color:var(--text-0);
    padding:9px 14px; font-size:12.5px; font-weight:600; transition:.15s; letter-spacing:.2px;
  }
  .btn:hover{ background:var(--bg-3); border-color:#454d55; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.primary{ background:linear-gradient(160deg,var(--amber),#c97e0f); border-color:#c97e0f; color:#181200; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.ghost{ background:transparent; }
  .btn.danger{ border-color:rgba(255,92,92,.4); color:var(--red); background:rgba(255,92,92,.06);}
  .btn.sm{ padding:6px 10px; font-size:11.5px; }
  .btn.block{ width:100%; }

  .empty{
    border:1px dashed var(--line); border-radius:10px; padding:40px 20px; text-align:center; color:var(--text-2);
  }
  .empty svg{ width:30px;height:30px; margin-bottom:10px; opacity:.5;}
  .empty .t{ color:var(--text-1); font-weight:600; font-size:13.5px; margin-bottom:4px;}

  input[type=text], input[type=password], textarea, select{
    width:100%; background:var(--bg-0); border:1px solid var(--line); color:var(--text-0);
    padding:10px 12px; border-radius:7px; font-size:13px; font-family:inherit; outline:none;
  }
  input[type=text]:focus, input[type=password]:focus, textarea:focus, select:focus{ border-color:var(--amber); box-shadow:0 0 0 3px rgba(245,166,35,.12); }
  label.field-label{ font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-2); margin-bottom:6px; display:block; font-weight:600;}
  .field{ margin-bottom:16px; }

  .panel{ background:var(--bg-1); border:1px solid var(--line); border-radius:12px; padding:22px; }
  .panel-title{ font-family:var(--font-display); font-size:16px; font-weight:600; margin:0 0 4px; }
  .panel-sub{ font-size:12px; color:var(--text-2); margin:0 0 18px; }

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--bg-3); border:1px solid var(--line);
    padding:12px 16px; border-radius:8px; font-size:12.5px; color:var(--text-0); box-shadow:0 8px 30px rgba(0,0,0,.4);
    z-index:999; max-width:320px;
  }
  .toast.err{ border-color:rgba(255,92,92,.5); color:#ffb3b3; }
  .toast.ok{ border-color:rgba(62,207,142,.5); color:#bdf5da; }

  /* ---------- SOP detail steps ---------- */
  .steplist{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .step{ display:flex; gap:10px; padding:10px 12px; background:var(--bg-0); border:1px solid var(--line-soft); border-radius:8px; }
  .step .no{ font-family:var(--font-mono); color:var(--amber); font-weight:700; font-size:12px; flex:0 0 22px; }
  .step .txt{ font-size:12.5px; color:var(--text-1); line-height:1.5; }
  .step .txt b{ color:var(--text-0); }

  /* ---------- Exam taking ---------- */
  .exam-wrap{ max-width:720px; margin:0 auto; }
  .qcounter{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-2); letter-spacing:1px; margin-bottom:10px; }
  .progressbar{ height:5px; background:var(--bg-2); border-radius:100px; overflow:hidden; margin-bottom:22px; border:1px solid var(--line-soft);}
  .progressbar .fill{ height:100%; background:linear-gradient(90deg,var(--amber),#ffd27a); transition:width .25s; }
  .qcard{ background:var(--bg-1); border:1px solid var(--line); border-radius:12px; padding:22px; }
  .qcard .qtext{ font-size:15.5px; font-weight:600; line-height:1.5; margin-bottom:18px; }
  .opt{
    display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border:1px solid var(--line); border-radius:8px;
    margin-bottom:9px; cursor:pointer; font-size:13px; color:var(--text-1); transition:.12s;
  }
  .opt:hover{ border-color:#454d55; background:var(--bg-2); }
  .opt.selected{ border-color:var(--amber); background:rgba(245,166,35,0.09); color:var(--text-0); }
  .opt .dot{ width:16px;height:16px;border-radius:50%; border:1.5px solid var(--line); flex:0 0 auto; margin-top:1px; position:relative; }
  .opt.selected .dot{ border-color:var(--amber); }
  .opt.selected .dot::after{ content:""; position:absolute; inset:3px; border-radius:50%; background:var(--amber); }

  .exam-nav{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; }

  /* ---------- gauge ---------- */
  .gauge-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:20px 0 6px; }
  .gauge{ width:210px; height:210px; border-radius:50%; position:relative; }
  .gauge .ring{
    position:absolute; inset:0; border-radius:50%;
  }
  .gauge .inner{
    position:absolute; inset:20px; border-radius:50%; background:var(--bg-1); border:1px solid var(--line-soft);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow: inset 0 2px 14px rgba(0,0,0,.5);
  }
  .gauge .needle{
    position:absolute; left:50%; top:50%; width:3px; height:74px; background:var(--text-0);
    transform-origin:50% 100%; border-radius:2px; box-shadow:0 0 6px rgba(255,255,255,.5);
  }
  .gauge .hub{ position:absolute; left:50%; top:50%; width:10px;height:10px; margin:-5px; border-radius:50%; background:var(--text-0); }
  .gauge .pct{ font-family:var(--font-display); font-size:34px; font-weight:700; line-height:1; }
  .gauge .lbl{ font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--text-2); margin-top:6px; }
  .verdict{ font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:.6px; padding:6px 16px; border-radius:100px; }
  .verdict.pass{ background:rgba(62,207,142,.12); color:var(--green); border:1px solid rgba(62,207,142,.4); }
  .verdict.fail{ background:rgba(255,92,92,.12); color:var(--red); border:1px solid rgba(255,92,92,.4); }

  /* ---------- table ---------- */
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-2); padding:9px 10px; border-bottom:1px solid var(--line); }
  td{ padding:10px; border-bottom:1px solid var(--line-soft); color:var(--text-1); }
  tr:hover td{ background:rgba(255,255,255,0.015); }
  td.num{ font-family:var(--font-mono); }
  .score-chip{ font-family:var(--font-mono); font-weight:700; padding:2px 8px; border-radius:5px; font-size:11.5px; }
  .score-chip.good{ background:rgba(62,207,142,.12); color:var(--green); }
  .score-chip.bad{ background:rgba(255,92,92,.12); color:var(--red); }

  .stat-row{ display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .stat{ background:var(--bg-1); border:1px solid var(--line); border-radius:10px; padding:14px 18px; min-width:140px; }
  .stat .v{ font-family:var(--font-display); font-size:24px; font-weight:700; }
  .stat .k{ font-size:10.5px; color:var(--text-2); text-transform:uppercase; letter-spacing:.8px; margin-top:2px;}

  .spinner{ width:16px;height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.25); border-top-color:#181200; animation:spin .7s linear infinite; }
  .spinner.light{ border:2px solid rgba(255,255,255,.15); border-top-color:var(--amber); }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .loading-block{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:60px 20px; color:var(--text-2); }
  .loading-block .needle-spin{ width:60px;height:60px;border-radius:50%; border:3px solid var(--line); border-top-color:var(--amber); animation:spin 1s linear infinite;}

  code.k{ font-family:var(--font-mono); background:var(--bg-0); border:1px solid var(--line-soft); padding:1px 6px; border-radius:4px; font-size:11.5px; color:var(--amber); }

  .backlink{ display:inline-flex; align-items:center; gap:6px; color:var(--text-2); font-size:12px; cursor:pointer; margin-bottom:14px; }
  .backlink:hover{ color:var(--text-0); }

  /* ---------- mobile bottom nav ---------- */
  .bottomnav{
    display:none; position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--bg-1); border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    grid-template-columns:repeat(6,1fr); gap:1px;
  }
  .bottomnav .bnitem{
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px;
    color:var(--text-2); font-size:9.5px; font-weight:600; letter-spacing:.2px; border-radius:8px;
  }
  .bottomnav .bnitem svg{ width:17px;height:17px; }
  .bottomnav .bnitem span{ font-size:8.8px; white-space:nowrap; }
  .bottomnav .bnitem.active{ color:var(--amber); background:rgba(245,166,35,0.08); }

  @media (max-width: 820px){
    .sidebar{ display:none; }
    .content{ padding:14px 14px 76px; }
    .bottomnav{ display:grid; }
    .topbar{ padding:0 14px; height:54px; }
    .topbar h1{ font-size:15.5px; }
    .topbar .sub{ display:none; }
    .topbar .pill{ display:none; }
    .grid{ grid-template-columns:1fr; }
    .stat-row{ gap:8px; }
    .stat{ min-width:0; flex:1 1 100px; padding:10px 12px; }
    .stat .v{ font-size:19px; }
    .gauge{ width:180px; height:180px; }
  }
  @media (max-width: 420px){
    .qcard{ padding:16px; }
    .panel{ padding:16px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   SOP EĞİTİM & SINAV SİSTEMİ
   Tek dosyalık uygulama: SOP kütüphanesi + yerleşik soru havuzundan rastgele
   sınav üretimi (API gerektirmez) + online sınav + sonuç kaydı.
   ========================================================================= */

/* Cihazlar arası ORTAK sonuç kaydı için (opsiyonel):
   Bağımsız barındırmada (GitHub Pages vb.) window.storage çalışmadığından
   sonuçlar varsayılan olarak yalnızca o cihazda (localStorage) tutulur.
   Farklı telefonlardaki sonuçları TEK bir yerde toplamak isterseniz, aşağıya
   bir Google Apps Script Web App URL'si yapıştırın - tüm cihazlar sonucu
   otomatik olarak o Google E-Tablo'ya da gönderir. Boş bırakılırsa bu adım
   sessizce atlanır. (Kurulum talimatı sohbette paylaşıldı.) */
const CONFIG = {
  sheetsWebhookUrl: 'https://script.google.com/macros/s/AKfycbzqPm1B8ey8Nd87Pf21WLBw9MoKYIK7TxuPMWVwe4nk44Go1NTAtiZ_AgCa52nMo-I8Ew/exec',
  // Yönetici şifresi - yalnızca istemci tarafı bir engel (gerçek güvenlik değil, bkz. sohbet).
  // Google Apps Script'teki ADMIN_PASSWORD sabitiyle AYNI olmalı (sunucu tarafı gerçek kontrol orada).
  adminPassword: 'KorozoSOP2026!',
};

function syncDeleteToSheets(id){
  if(!CONFIG.sheetsWebhookUrl) return;
  try{
    fetch(CONFIG.sheetsWebhookUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'delete', id, password: CONFIG.adminPassword }),
    }).catch(()=>{});
  }catch(e){}
}

function syncResultToSheets(result){
  if(!CONFIG.sheetsWebhookUrl) return;
  try{
    fetch(CONFIG.sheetsWebhookUrl, {
      method: 'POST',
      mode: 'no-cors', // Apps Script web app için gerekli; yanıt okunamaz ama gönderim çalışır
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(result),
    }).catch(()=>{ /* sessiz geç - yerel kayıt zaten yapıldı */ });
  }catch(e){ /* sessiz geç */ }
}

function jsonpRequest(url, timeoutMs){
  return new Promise((resolve, reject) => {
    const cbName = '__sopSinavCb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    const script = document.createElement('script');
    let done = false;
    const cleanup = () => { try{ delete window[cbName]; }catch(e){} if(script.parentNode) script.parentNode.removeChild(script); };
    const timer = setTimeout(() => { if(done) return; done=true; cleanup(); reject(new Error('timeout')); }, timeoutMs || 10000);
    window[cbName] = (data) => { if(done) return; done=true; clearTimeout(timer); cleanup(); resolve(data); };
    script.src = url + (url.indexOf('?')>=0 ? '&' : '?') + 'callback=' + cbName;
    script.onerror = () => { if(done) return; done=true; clearTimeout(timer); cleanup(); reject(new Error('script load error')); };
    document.head.appendChild(script);
  });
}

async function fetchCloudResults(){
  if(!CONFIG.sheetsWebhookUrl) return null;
  try{
    // JSONP kullanılır: Apps Script Web App'lerin GET yanıtları cross-origin fetch()
    // ile her zaman güvenilir okunamıyor (CORS); <script> ile yükleme bu sınırı aşar.
    const data = await jsonpRequest(CONFIG.sheetsWebhookUrl, 10000);
    if(!Array.isArray(data)) return null;
    return data.map(r => ({
      id: r.id || ('cloud-'+r.name+'-'+r.submittedAt),
      sopId: r.sopId || '',
      sopTitle: r.sopTitle || '',
      name: r.name || '',
      dept: r.dept || '',
      personnelId: r.personnelId || null,
      score: Number(r.score)||0,
      total: Number(r.total)||0,
      pct: Number(r.pct)||0,
      submittedAt: typeof r.submittedAt === 'number' ? r.submittedAt : Date.parse(r.submittedAt) || Date.now(),
    }));
  }catch(e){ return null; }
}

const ICONS = {
  library: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
  generate: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.9 2.9M16.2 16.2l2.9 2.9M2 12h4M18 12h4M4.9 19.1l2.9-2.9M16.2 7.8l2.9-2.9"/><circle cx="12" cy="12" r="3"/></svg>`,
  take: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`,
  results: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`,
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>`,

  { id:'iq8-sesli-alarm', title:'Esser IQ8Control M Sesli Alarm Susturma SOP', category:'Yangın Alarm Paneli',
    content:`KAPSAM: Esser IQ8Control M panelinde dahili buzzer ve bağlı sesli alarm cihazlarının geçici susturulması.
Adımlar: 1) Buzzer Off tuşuna basılır - bu tuş anahtar kilitliyken (Access Level 1) de çalışır, yeni olayda buzzer tekrar aktifleşir. 2) Harici sesli cihazları susturmak için anahtar açılır (Access Level 2), Audible Alarm Off/Silence tuşuna basılır - susturulan cihazlar yeni olayda otomatik tekrar aktifleşebilir. 3) Alternatif olarak Control+F4 kullanılabilir (yalnızca V03.10R000 ve üzeri sürümlerde). 4) Access Level 3'te susturma kalıcı olur, otomatik açılmaz; Level 3'ten çıkınca fonksiyon Level 2 başlangıcına döner. 5) Neden giderildikten sonra sesli cihazlar tekrar aktif edilir veya Panel Reset uygulanır - Master Box'ın susturulması itfaiye bildirimini de durdurduğundan ayrıca kontrol edilmelidir.` },

  { id:'iq8-bolge-acma-kapama', title:'Esser IQ8Control M Bölge Açma/Kapama/Reset SOP', category:'Yangın Alarm Paneli',
    content:`KAPSAM: Esser IQ8Control M panelinde bir bölgenin (zone) devreye alınması/resetlenmesi, devre dışı bırakılması ve durum sorgulanması.
Adımlar: 1) Anahtar açılır (Access Level 2). 2) Zone tuşu + bölge no + On tuşu ile bölge devreye alınır/resetlenir - kapalı bölgeyi açar veya aktif bölgedeki mesajları siler. 3) Ekranda "on in progress" görüntülenir. 4) Zone + bölge no + Off ile devre dışı bırakılır - devre dışı bölge olayda alarm vermez, yalnızca bakım/servis amacıyla ve yetkiyle yapılmalı. 5) Devre dışı durum sarı Disconnection LED ile teyit edilir. 6) Zone + bölge no + Status query ile durum sorgulanır. 7) End tuşu ile çıkılır, anahtar kilitlenir - devre dışı bırakılan bölge iş bitiminde mutlaka tekrar devreye alınmalı, unutulmamalı.` },

  { id:'iq8-lamba-testi', title:'Esser IQ8Control M Lamba Testi SOP', category:'Yangın Alarm Paneli',
    content:`KAPSAM: Esser IQ8Control M panelindeki tüm LED göstergelerin ve dahili buzzerın görsel/işitsel kontrolü (Lamp Test).
Adımlar: 1) Test (Lamp Test) tuşuna basılır - panelin normal izleme fonksiyonu etkilenmez. 2) Tüm LED'ler yaklaşık 10 saniye yanar, ekran kararır, buzzer çalar. 3) Yanmayan/arızalı LED olup olmadığı gözlemlenir - tespit edilirse arıza kaydı açılıp servis çağrılmalı. 4) Test sonunda ekranda panel yazılım versiyon numarası görüntülenir. 5) Erken sonlandırmak için Test tuşuna tekrar basılır. 6) Panelin normal duruma (yeşil in Operation LED) döndüğü teyit edilir.` },

  { id:'iq8-dedektor-acma-kapama', title:'Esser IQ8Control M Dedektör Açma/Kapama/Reset SOP', category:'Yangın Alarm Paneli',
    content:`KAPSAM: Esser IQ8Control M panelinde adreslenebilir bir dedektörün devreye alınması/resetlenmesi, devre dışı bırakılması ve durum sorgulanması.
Adımlar: 1) Anahtar açılır (Access Level 2). 2) Zone + bölge no + Detector + dedektör no + On ile devreye alınır/resetlenir - bölge no her zaman dedektör no'dan önce girilir; bu fonksiyon yalnızca adreslenebilir (9100/9200/IQ8Quad) dedektörlerde çalışır, standart 9000 serisi tekil açılıp kapatılamaz. 3) Ekranda "on in progress" görüntülenir. 4) Zone+Detector+Off ile devre dışı bırakılır - devre dışı dedektör olayda alarm vermez, yalnızca bakım amacıyla yapılmalı. 5) Devre dışı durum sarı Disconnection LED ile teyit edilir. 6) Zone+Detector+Status query ile durum sorgulanır. 7) End ile çıkılır, anahtar kilitlenir - devre dışı bırakılan dedektör iş bitiminde mutlaka tekrar devreye alınmalı.` },

  { id:'iq8-role-kontrolu', title:'Esser IQ8Control M Röle Kontrolü SOP', category:'Yangın Alarm Paneli',
    content:`KAPSAM: Esser IQ8Control M panelinde bir rölenin (kontrol çıkışı) devreye alınması, devre dışı bırakılması ve durum sorgulanması.
Adımlar: 1) Anahtar açılır (Access Level 2). 2) Relay + röle no + On ile devreye alınır - devreye alınan röle bir olayda programlanmış koşullara göre çalışır. 3) Ekranda "on in progress" görüntülenir. 4) Relay + röle no + Off ile devre dışı bırakılır - röle inverse programlanmışsa devre dışı bırakıldığında normalde aktif çıkış deaktive olur, bağlı ekipman olayda çalışmaz. 5) Devre dışı durum sarı Disconnection LED ile teyit edilir. 6) Relay + röle no + Status query ile durum (Normal/Activated/Disconnection/Trouble) sorgulanır. 7) End ile çıkılır, anahtar kilitlenir - devre dışı bırakılan röle iş bitiminde mutlaka tekrar devreye alınmalı.` },

  { id:'iq8-tarih-saat', title:'Esser IQ8Control M Tarih/Saat Girişi SOP', category:'Yangın Alarm Paneli',
    content:`KAPSAM: Esser IQ8Control M panelinde sistem tarih ve saat bilgisinin girilmesi/güncellenmesi.
Adımlar: 1) Anahtar açılır (Access Level 2). 2) Ana menüden Time funct. tuşuna basılır, Time/Date ekranına girilir. 3) İmleç tuşlarıyla değiştirilecek alan (saat, dakika, gün, ay, yıl) seçilir. 4) Numerik tuş takımı (0-9) ile değer girilir - tarih GG.AA.YY formatında girildiğinde haftanın günü sistem tarafından otomatik hesaplanır. 5) Function tuşuyla kaydedilir - kaydetmeden çıkmak için Escape tuşuna basılmalı; herhangi bir tuşa basılmadan beklenirse ekran kaydedilmeden önceki menüye otomatik döner. 6) Güncellenen tarih/saatin doğru göründüğü teyit edilir, anahtar tekrar kilitlenir.` },

  { id:'motor-degistirme', title:'Motor Değiştirme (Genel) SOP', category:'Mekanik/Elektrik Bakım',
    content:`KAPSAM: Pompa, fan, konveyör vb. ekipmanları tahrik eden elektrik motorlarının sökülüp yenisiyle değiştirilmesi.
Adımlar: 1) Motor LOTO-Elektrik'e göre enerjisi kesilir, kilitlenir, gerilim ölçerle teyit edilir. 2) Mekanik bağlantılar (kaplin, kayış, redüktör) LOTO-Mekanik'e göre izole edilir. 3) Bağlantı kabloları klemens numarası not edilerek sökülür - dizilim fotoğraflanmalı, yanlış bağlantı motoru ters yönde çalıştırabilir. 4) Motor kaldırma ekipmanıyla sökülür - ağırlığa uygun ekipman seçilmeli. 5) Yeni motorun etiket bilgileri (güç, devir, gerilim, akım) eskisiyle karşılaştırılır - uyumsuz motor ekipmana zarar verir. 6) Yeni motor yerleştirilir, hizalama yapılır - hizalama hatası titreşim ve erken arızaya yol açar. 7) Elektrik bağlantıları not edilen sıraya göre yapılır. 8) Mekanik bağlantılar takılır. 9) LOTO kaldırılır, bump test ile dönüş yönü kontrol edilir - ters yön zarar verebilir. 10) Tam yükte akım/titreşim/sıcaklık kontrol edilip kayıt formuna işlenir.` },

  { id:'rulman-degistirme', title:'Rulman Değiştirme SOP', category:'Mekanik/Elektrik Bakım',
    content:`KAPSAM: Motor, pompa, fan gibi dönen ekipmanlardaki rulmanların değiştirilmesi.
Adımlar: 1) Ekipman LOTO-Elektrik ve LOTO-Mekanik'e göre enerjisiz hale getirilir. 2) Ekipman sökülür, mil/gövde temizlenir. 3) Eski rulman bearing puller ile sökülür - çekiçle vurarak sökme mil/gövdeye zarar verir. 4) Mil ve yatak yuvası aşınma yönünden kontrol edilir. 5) Yeni rulmanın tip/ölçüsü eskisiyle karşılaştırılır - yanlış rulman erken arızaya yol açar. 6) Rulman temizlenir, gerekirse ısıtılarak montaj kolaylaştırılır - soğuk zorlama/darbe rulmana zarar verir. 7) Rulman mile/yatağa monte edilir, tolerans kontrol edilir. 8) Gres/yağlama üretici talimatına göre yapılır - aşırı/yetersiz yağlama erken arızaya sebep olur. 9) LOTO kaldırılır, çalıştırılır. 10) İlk çalıştırmada titreşim/ses/sıcaklık izlenir, sonuçlar kayıt formuna işlenir.` },

  { id:'pano-kart-degistirme', title:'Pano İçi Kart Değiştirme SOP', category:'Mekanik/Elektrik Bakım',
    content:`KAPSAM: Elektrik/otomasyon panolarındaki arızalı kontrol kartlarının (PLC modülü, sürücü kartı vb.) değiştirilmesi.
Adımlar: 1) Pano LOTO-Elektrik'e göre enerjisiz hale getirilir - mümkünse enerjisiz çalışma tercih edilir. 2) ESD (statik önleyici) bileklik takılır, topraklanır - kartlar statik elektriğe hassastır. 3) Arızalı kartın konumu, DIP switch/jumper ayarları ve bağlantı sırası fotoğraflanır/not edilir. 4) Konnektörler/kablolar sökülür. 5) Arızalı kart çıkarılır. 6) Yeni kartın model/versiyon numarası eskisiyle karşılaştırılır - uyumsuz versiyon sistem hatasına yol açar. 7) Yeni karta eski karttaki DIP switch/jumper ayarları aynen uygulanır. 8) Yeni kart takılır, konnektörler bağlanır. 9) Enerji verilir, durum LED'leri/haberleşme kontrol edilir. 10) Sistem fonksiyon testi yapılır, sonuçlar kayıt formuna işlenir.` },

  { id:'sigorta-degistirme', title:'Sigorta Değiştirme SOP', category:'Mekanik/Elektrik Bakım',
    content:`KAPSAM: Elektrik pano/devrelerindeki atmış sigortaların (fuse) güvenli değişimi.
Adımlar: 1) Devre mümkünse LOTO-Elektrik'e göre enerjisiz hale getirilir. 2) Enerjisiz yapılamıyorsa uygun arc flash KKD ile ve yalnızca yetkili personelce yapılır. 3) Sigortanın atma nedeni araştırılır - neden giderilmeden değiştirilirse tekrar atabilir veya daha büyük hasara yol açar. 4) İzoleli sigorta çekme pensesi ile atmış sigorta çıkarılır. 5) Yeni sigortanın amper/tip değeri eskisiyle birebir aynı olduğu kontrol edilir - yanlış amperaj yangın riski oluşturur. 6) Yeni sigorta takılır. 7) Enerji verilir, devrenin normal çalıştığı teyit edilir. 8) Değişim ve nedeni kayıt formuna işlenir.` },

  { id:'kompanzasyon-kontrol', title:'Kompanzasyon Sistemi Aylık Kontrol SOP', category:'Mekanik/Elektrik Bakım',
    content:`KAPSAM: Güç faktörü düzeltme (kompanzasyon) panosunun aylık periyodik kontrolü.
Adımlar: 1) Pano genel görsel kontrolü yapılır (sızıntı, ısınma izi, anormal ses/koku) - şişmiş kondansatör tehlike işaretidir. 2) Güç faktörü (cos φ) değeri okunur, hedef aralıkta olduğu kontrol edilir. 3) Kademe kontaktörlerinin devreye girip çıkma sırası gözlemlenir. 4) Kondansatör gövdelerinde şişme/deformasyon kontrol edilir - şişmiş kondansatör derhal değiştirilmelidir. 5) Bağlantı noktalarının sıkılığı ve ısınma izi (termal kamera ile) kontrol edilir. 6) Harmonik filtre (varsa) sigortaları kontrol edilir. 7) Havalandırma fanları ve filtreler kontrol edilir. 8) Sonuçlar kayıt formuna işlenir, anormallikte bakım talebi açılır.` },

  { id:'lamba-ampul-degisimi', title:'Lamba/Ampul Değişimi SOP', category:'Mekanik/Elektrik Bakım',
    content:`KAPSAM: Aydınlatma armatürlerindeki lamba/ampullerin güvenli değişimi.
Adımlar: 1) Devre mümkünse LOTO-Elektrik'e göre enerjisiz hale getirilir. 2) Yükseklik gerekiyorsa Yüksekte Çalışma SOP'una uygun ekipman kullanılır. 3) Armatür kapağı açılır, eski lamba çıkarılır - sıcak lamba direkt elle tutulmamalı. 4) Yeni lambanın tip/güç/duy uyumu kontrol edilir. 5) Yeni lamba takılır, kapak kapatılır. 6) Enerji verilir, çalıştığı teyit edilir. 7) Eski lamba (cıva içerenler) uygun atık prosedürüne göre bertaraf edilir. 8) İşlem kayıt formuna işlenir.` },

  { id:'sicaklik-sensoru-degisimi', title:'Sıcaklık Sensörü Değişimi SOP', category:'Mekanik/Elektrik Bakım',
    content:`KAPSAM: Proses hatlarındaki sıcaklık sensörlerinin (PT100, termokupl vb.) değiştirilmesi.
Adımlar: 1) Proses/ekipman durdurulur veya sensör devresi LOTO-Elektrik'e göre enerjisiz hale getirilir. 2) Hatta basınç/sıcaklık varsa hat güvenli hale getirilir (boşaltılır/soğutulur) - aksi halde yanık/yaralanma riski taşır. 3) Sensör kabloları klemens no not edilerek sökülür. 4) Sensör termowell'den sökülür. 5) Yeni sensörün tip/aralık (range) değeri karşılaştırılır - yanlış sensör hatalı okumaya yol açar. 6) Yeni sensör takılır, sızdırmazlık kontrol edilir. 7) Kablo bağlantıları yeniden yapılır. 8) Devreye alınır, okuma referans değerle doğrulanır. 9) Sonuçlar kayıt formuna işlenir.` },

  { id:'basinc-sensoru-degisimi', title:'Sıvı Akışkanlı Hatlarda Basınç Sensörü Değişimi SOP', category:'Mekanik/Elektrik Bakım',
    content:`KAPSAM: Sıvı akışkanlı (su, yağ vb.) hatlardaki basınç sensörlerinin (transmitter) değiştirilmesi.
Adımlar: 1) Sensör devresi LOTO-Elektrik'e göre enerjisiz hale getirilir. 2) Hat izolasyon vanası kapatılır - basınçlı kalırsa sökümde sıvı fışkırması riski oluşur. 3) Tahliye vanasından kalıntı basınç boşaltılır, manometreden sıfır teyit edilir. 4) Kablolar klemens no not edilerek sökülür. 5) Sensör hattan sökülür - sızıntı için toplama kabı hazır bulundurulmalı. 6) Yeni sensörün basınç aralığı ve bağlantı tipi karşılaştırılır. 7) Yeni sensör takılır, sızdırmazlık (conta/teflon bant) sağlanır. 8) Kablo bağlantıları yapılır. 9) Vana kademeli açılır - ani açma su darbesi riski oluşturur. 10) Okuma referansla karşılaştırılır, sonuçlar kayıt formuna işlenir.` },

  { id:'motor-kayis-degisimi', title:'Motor Kayış Değişimi SOP', category:'Mekanik/Elektrik Bakım',
    content:`KAPSAM: Kayış-kasnak tahrikli ekipmanlarda aşınmış/kopmuş kayışların değiştirilmesi.
Adımlar: 1) Ekipman LOTO-Elektrik ve LOTO-Mekanik'e göre enerjisiz hale getirilir. 2) Kayış koruma muhafazası sökülür. 3) Gerginlik ayar mekanizması gevşetilir. 4) Eski kayış çıkarılır - zorlayarak/aletle çıkarma kayışa/kasnağa zarar verir, gerginlik gevşetilerek çıkarılmalı. 5) Kasnaklar aşınma/hizalama yönünden kontrol edilir - hizasızlık erken aşınmaya yol açar. 6) Yeni kayışın tip/ölçüsü karşılaştırılır. 7) Yeni kayış takılır, gerginlik üretici talimatına göre ayarlanır - aşırı gergin rulman yükünü artırır, gevşek kayma yapar. 8) Muhafaza takılır. 9) LOTO kaldırılır, kayış hizası/sesi/titreşimi kontrol edilir. 10) Sonuçlar kayıt formuna işlenir.` },

  { id:'zemin-beton-imalat', title:'Zemin Beton İmalat İşlemleri SOP', category:'İnşaat',
    content:`KAPSAM: Fabrika sahasında zemin beton döküm/onarım işlemleri.
Adımlar: 1) Çalışma alanı belirlenir, bariyer ile çevrilir. 2) Zemin hazırlığı yapılır (kırım, sıkıştırma, donatı/hasır çelik). 3) Kalıp kurulur, seviye/eğim kontrol edilir. 4) Beton karışımı şartnameye uygun hazırlanır/temin edilir. 5) Döküm yapılır, mala/şap makinesiyle yüzey düzeltilir. 6) Kür (curing) için yüzey nemli tutulur/kür örtüsü uygulanır - erken kuruma çatlamaya yol açar. 7) Priz süresince alan trafiğe kapalı tutulur, uyarı levhaları asılır. 8) Priz sonrası kalıp sökülür, yüzey kalitesi kontrol edilir. 9) Alan temizlenir, bariyerler kaldırılır. 10) Uygulama detayları kayıt formuna işlenir.` },

  { id:'alcipan-duvar-montaji', title:'Alçıpan Duvar Montajı SOP', category:'İnşaat',
    content:`KAPSAM: İç mekan bölme duvarlarının alçıpan sistemiyle montajı.
Adımlar: 1) Duvar güzergahı zemine/tavana işaretlenir. 2) Metal profil iskeleti dübel ile sabitlenir - aralık üretici talimatına uygun olmalı. 3) Dikme profiller monte edilir. 4) Duvar içi elektrik/tesisat hatları (varsa) yerleştirilir. 5) Yalıtım malzemesi (gerekiyorsa) profiller arasına yerleştirilir. 6) Alçıpan levhalar vidalarla sabitlenir - çok sıkılan vida levhayı yırtar. 7) Derzler file bant ve alçı macunla düzeltilir (bantlama-macunlama). 8) Yüzey zımparalanır. 9) Alan temizlenir, atıklar bertaraf edilir. 10) Uygulama kayıt formuna işlenir.` },

  { id:'kapi-montaji', title:'Kapı Montajı SOP', category:'İnşaat',
    content:`KAPSAM: İç/dış mekan kapı (kasa+kanat) montajı.
Adımlar: 1) Kapı boşluğu ölçüsü kasa ölçüsüyle karşılaştırılır. 2) Kasa boşluğa yerleştirilir, su terazisiyle hizası kontrol edilir - hizasız kasa açılıp kapanmayı engeller. 3) Kasa takoz/kama ile geçici sabitlenir. 4) Kasa duvara vida/dübel veya köpük ile kalıcı sabitlenir. 5) Kapı kanadı menteşelere takılır, hareketi kontrol edilir. 6) Kilit/kolye mekanizması monte edilir, test edilir. 7) Kasa-duvar boşluğu doldurulur. 8) Pervaz montajı yapılır. 9) Son fonksiyon kontrolü yapılır. 10) Uygulama kayıt formuna işlenir.` },

  { id:'vana-montaji', title:'Vana Montajı SOP', category:'İnşaat',
    content:`KAPSAM: Proses hatlarına yeni vana (küresel, kelebek, sürgülü vb.) montajı.
Adımlar: 1) Hat LOTO/izolasyon prosedürüne göre devre dışı bırakılır, boşaltılır. 2) Artık basınç/sıvı tahliye edilir. 3) Vana ölçüsü (flanş/dişli) ve basınç sınıfı (PN) hatla uyumu kontrol edilir - uyumsuz vana sızıntı/patlama riski oluşturur. 4) Bağlantı yüzeyleri temizlenir. 5) Conta uygun tipte yerleştirilir. 6) Vana monte edilir, cıvatalar çapraz sırayla ve belirtilen tork değerinde sıkılır - eşit olmayan sıkma sızıntıya yol açar. 7) Akış yönü hat yönüyle uyumu kontrol edilir. 8) Hat kademeli devreye alınır, sızıntı kontrolü yapılır. 9) Açma-kapama fonksiyonu test edilir. 10) Montaj kayıt formuna işlenir.` },

  { id:'piston-degisimi', title:'Piston Değişimi SOP', category:'Mekanik/Elektrik Bakım',
    content:`KAPSAM: Kompresör, pompa veya hidrolik/pnömatik silindirlerdeki pistonların değiştirilmesi.
Adımlar: 1) Ekipman LOTO-Elektrik ve LOTO-Mekanik'e göre enerjisiz/basınçsız hale getirilir. 2) Hidrolik/pnömatik hat basıncı tahliye edilir, sıfır teyit edilir. 3) Piston erişimi için kapak/gövde sökülür. 4) Eski piston silindirden sökülür - piston kolu/pim bağlantıları dikkatli sökülmeli. 5) Silindir iç yüzeyi aşınma yönünden kontrol edilir. 6) Yeni pistonun ölçü/tip uyumu karşılaştırılır. 7) Piston segmanları doğru yönde ve sırada takılır - ters segman yağ kaçağına yol açar. 8) Piston monte edilir, tork değerleriyle sabitlenir. 9) Kapak parçaları takılır, sızdırmazlık kontrol edilir. 10) Sistem kademeli devreye alınır, performans kontrol edilip kayıt formuna işlenir.` },

  { id:'pompa-degisimi', title:'Pompa Değişimi SOP', category:'Mekanik/Elektrik Bakım',
    content:`KAPSAM: Proses/yardımcı sistemlerdeki arızalı pompaların komple değiştirilmesi.
Adımlar: 1) Pompa LOTO-Elektrik ve LOTO-Mekanik'e göre enerjisiz hale getirilir. 2) Emme/basma hattı vanaları kapatılır, hat boşaltılır - boşaltılmazsa sıvı akmasına yol açar. 3) Elektrik bağlantıları klemens no not edilerek sökülür. 4) Kaplin bağlantısı ve mesnet cıvataları sökülür. 5) Eski pompa kaldırma ekipmanıyla alınır. 6) Yeni pompanın debi/basma yüksekliği (H-Q eğrisi) ve bağlantı ölçüleri karşılaştırılır - uyumsuz pompa performansı olumsuz etkiler. 7) Yeni pompa yerleştirilir, hizalama yapılır. 8) Hat bağlantıları yapılır, contalar yenilenir. 9) Elektrik bağlanır, dönüş yönü bump test ile kontrol edilir. 10) Vanalar kademeli açılır, debi/basınç/titreşim kontrol edilip kayıt formuna işlenir.` },

  { id:'solvent-geri-kazanim', title:'Solvent Geri Kazanım Tesisi SOP', category:'Termal Sistemler',
    content:`KAPSAM: Solvent geri kazanım tesisinin periyodik bakımı ve emisyon/kalite analizlerinin yapılması (C3Y03).
Adımlar: 1) Emisyon analiz (CO/CO2) cihazlarının kalibrasyonu yapılır (3 aylık) - bkz. CO/CO2 Analizör Kalibrasyon SOP. 2) Saha pompaları kontrol edilir, yatakları yağlanır (6 aylık). 3) Blower filtreleri kontrol edilir, kirliyse değiştirilir (aylık) - tıkalı filtre blower verimini düşürür, motora aşırı yük bindirir. 4) Soğutma kulesi fanları yağlanır (6 aylık). 5) Alkol ve asetat analizleri yapılır (haftalık) - solvent buharına maruziyet riski taşır, iyi havalandırılan alanda uygun KKD ile yapılmalı. 6) Tesis genel görsel kontrolü yapılır; sızıntı, anormal koku, yanıcı buhar birikimi olmadığı teyit edilir - solvent buharı patlayıcı ortam oluşturabilir. 7) Bulgular ve analiz sonuçları kayıt formuna işlenir, anormallikte bakım talebi açılır.` },

  { id:'trafo-bakim', title:'Trafo Periyodik Bakım SOP', category:'Elektrik Altyapı',
    content:`KAPSAM: Güç trafolarının periyodik bakım ve kontrolü.
Adımlar: 1) Trafo dairesi genel görsel kontrolü (sızıntı, kirlenme, anormal ses/koku). 2) Yağ seviyesi göstergeden kontrol edilir - düşük seviye izolasyon zafiyetine yol açar. 3) Yağ sıcaklığı ve Buchholz rölesi (varsa) kontrol edilir. 4) İzolatör/buşing yüzeyleri kirlenme/çatlak yönünden kontrol edilir. 5) Topraklama bağlantıları kontrol edilir. 6) Termal kamera ile bağlantı noktalarında ısınma kontrolü yapılır. 7) Havalandırma/soğutma fanları kontrol edilir. 8) Trafo odası kapı/kilit güvenliği ve uyarı levhaları kontrol edilir. 9) Periyodik yağ analiz sonuçları (varsa) gözden geçirilir. 10) Sonuçlar kayıt formuna işlenir.` },

  { id:'jenerator-test', title:'Jeneratör Periyodik (6 Aylık) Bakım SOP', category:'Elektrik Altyapı',
    content:`KAPSAM: Jeneratörün 6 aylık periyodik bakımının yapılması (C3Y10).
Adımlar: 1) Radyatör temizliği yapılır. 2) Akü değişimi yapılır (gerekiyorsa) - sökülürken önce eksi (-) kutup, takılırken önce artı (+) kutup bağlanır, kısa devre riskini önler. 3) Radyatör su seviyesi ve antifriz yoğunluk kontrolleri yapılır. 4) Motor yağ seviyesi kontrolü yapılır. 5) Akü asit bomesi ile akü asit seviyesi kontrol edilir - akü asidi cilt/göz tahrişine yol açar, uygun KKD gerekir. 6) Akü voltaj kontrolü yapılır. 7) Mazot seviyesi kontrol edilir (haftalık). 8) Mazot filtresi değiştirilir. 9) Yağ filtresi değiştirilir.` },

  { id:'ups-test', title:'UPS Periyodik Test SOP', category:'Elektrik Altyapı',
    content:`KAPSAM: Kesintisiz güç kaynağının (UPS) periyodik test ve bakımı.
Adımlar: 1) Panel gösterge/ekranı kontrol edilir, arıza uyarısı olmadığı teyit edilir. 2) Akü grubu voltajı/şarj durumu kontrol edilir. 3) Akülerin fiziksel durumu (şişme, sızıntı, korozyon) kontrol edilir - şişmiş akü derhal değiştirilmeli. 4) Yük yüzdesi kontrol edilir, aşırı yüklenme olmadığı teyit edilir. 5) Bypass anahtarı kontrol edilir. 6) Havalandırma/soğutma fanları kontrol edilir. 7) Batarya test fonksiyonu ile yedekleme süresi kontrol edilir - test sırasında yük UPS'e bağımlı olur, dikkatli yapılmalı. 8) Alarm/olay kayıtları (log) gözden geçirilir. 9) Sonuçlar kayıt formuna işlenir.` },

  { id:'demir-kaynak-atolyesi', title:'Demir/Kaynak Atölyesi Güvenlik Talimatı', category:'Atölyeler',
    content:`KAPSAM: Demir/kaynak atölyesinde genel çalışma düzeni ve ekipman güvenlik kuralları.
Adımlar: 1) Giriş öncesi uygun KKD (kaynak maskesi, önlük, eldiven, çelik burunlu ayakkabı) giyilir. 2) Kaynak makinesi/kesme ekipmanı kablo/hortum hasarı yönünden kontrol edilir. 3) Çevredeki yanıcı malzemeler uzaklaştırılır (bkz. Sıcak Çalışma İzni SOP). 4) Havalandırma (duman aspiratörü) kontrol edilir. 5) Oksi-gaz tüpleri dik, sabitlenmiş ve geri tepme valfli olmalı. 6) Taşlama/kesme işlerinde koruyucu siperlik/gözlük kullanılır, sıçrama alanı kontrol edilir. 7) El aletleri hasar yönünden kontrol edilir. 8) İş bitiminde ekipmanlar kapatılır, tüpler kapatılır, alan temizlenir. 9) Çıkışta yangın riski (kor, sıcak parça) son kez kontrol edilir.` },

  { id:'torna-atolyesi', title:'Torna Atölyesi Güvenlik Talimatı', category:'Atölyeler',
    content:`KAPSAM: Torna atölyesinde genel çalışma düzeni ve ekipman güvenlik kuralları.
Adımlar: 1) Giriş öncesi uygun KKD (gözlük, dar/bağlı iş elbisesi) giyilir - bol kıyafet/takı dönen mile takılma riski taşır. 2) Torna tezgahı genel kontrolü yapılır (yağlama, koruma siperleri yerinde). 3) İş parçası punta/ayna ile sağlam bağlanır. 4) Kesme hızı/ilerleme parametreleri malzemeye uygun seçilir. 5) Talaş temizleme sırasında makine durdurulmadan asla elle müdahale edilmez - dönen parçaya elle temas ciddi yaralanmaya yol açar. 6) Talaş fırça/kanca ile, makine dururken temizlenir. 7) Soğutma sıvısı seviyesi/akışı kontrol edilir. 8) Koruyucu siperlik/gözlük her zaman kullanılır - fırlayan talaş göz yaralanmasına yol açabilir. 9) İş bitiminde tezgah kapatılır, talaşlar temizlenir.` },

  { id:'boya-atolyesi', title:'Boya Atölyesi/İşleri Çalışma Talimatı', category:'Atölyeler',
    content:`KAPSAM: Boya atölyesi ve saha boya işlerinde uyulması gereken güvenlik kuralları.
Adımlar: 1) Boya öncesi ortam havalandırması sağlanır - boya buharları yanıcı ve sağlığa zararlı olabilir. 2) Boya/tiner orijinal ambalajda, etiketli ve SDS'e uygun saklanır. 3) Ateş kaynağı/sıcak yüzey bulunmadığı kontrol edilir - boya buharları patlayıcı ortam oluşturabilir. 4) Yüzey hazırlığı (temizlik, zımparalama) yapılır. 5) Uygun solunum maskesi (organik buhar filtresi) ve KKD giyilir. 6) Boya karışımı üretici talimatına göre hazırlanır. 7) Uygulama yapılır, çevre yüzeyler örtülerek korunur. 8) Ekipman uygun solventle temizlenir, atık bertaraf edilir. 9) Alan kuruyana kadar erişime kapatılır. 10) İş bitiminde alan havalandırılır, atıklar bertaraf edilir.` },

  { id:'kalip-insaat-isleri', title:'Kalıp/İnşaat İşleri Genel Talimatı', category:'Atölyeler',
    content:`KAPSAM: Betonarme kalıp kurma/söküm ve genel inşaat destek işleri güvenlik kuralları.
Adımlar: 1) Alan bariyer ile çevrilir, geçiş güzergahları işaretlenir. 2) Kalıp malzemesi hasar yönünden kontrol edilir, hasarlı malzeme kullanılmaz. 3) Kalıp iskeletinin yeterli desteklenmiş (payanda, dikme) olduğu kontrol edilir - yetersiz destekleme çökme riski taşır. 4) Yükseklik gerektiren işlerde Yüksekte Çalışma SOP'una uygun ekipman kullanılır. 5) Döküm sırasında kalıp basıncı/deformasyonu gözlemlenir. 6) Kalıp söküm zamanı beton priz süresine (mühendis onayına) göre belirlenir - erken söküm çökme riski taşır. 7) Söküm sırasında alt bölge boşaltılır/bariyer edilir. 8) Malzemeler düzenli istiflenir, çivi/keskin uçlar bükülür. 9) İş bitiminde alan temizlenir.` },

  { id:'chiller-bakim', title:'Chiller Periyodik Bakım SOP', category:'Soğutma/İklimlendirme',
    content:`KAPSAM: Chiller ünitesinin yıllık periyodik bakımının yapılması (C3Y05).
Adımlar: 1) Chiller serpantin temizliği yapılır (6 aylık). 2) Giriş-çıkış fark basınç kontrolleri yapılır. 3) Giriş-çıkış sıcaklık kontrolleri yapılır. 4) Pompa vibrasyon ve akım kontrolleri yapılır. 5) Antifriz seviyesi ve yoğunluk ölçümleri yapılır. 6) Elektrik enstrüman sıkılık kontrolleri yapılır - gevşek bağlantı ısınma/yangın riski taşır. 7) Free cooling fanlarının vibrasyon/akım kontrolleri yapılır. 8) Giriş-çıkış pompalarının yatakları yağlanır (6 aylık). 9) Genel kurulum kontrolü yapılır. 10) Sistem teşhisleri doğrulanır. 11) Ünite durdurulur. 12) Ünite LOTO-Elektrik'e göre izole edilir - soğutucu akışkan devresinde bakım öncesi enerji tamamen kesilmeli. 13) Kondenser serpantin kontrolü yapılır. 14) Evaporatör akış anahtarı testi yapılır. 15) Starter paneli kontrol edilir. 16) Motor izolasyon kontrolü yapılır. 17) Yağ seviyesi kontrol edilir. 18) Kondenser fan kontrolü yapılır. 19) Ünite güç kaynağı açılır (LOTO kaldırılarak). 20) Yağ ısıtıcıları kontrol edilir. 21) Soğutucu akışkan kaçak kontrolü yapılır - kaçak tespitinde derhal servis çağrılıp alan havalandırılmalı. 22) Ünite çalıştırılır. 23) Ünite verileri (log) devreye alınır. 24) Sub-cooling kontrolü yapılır. 25) İş alanı temizlenir.` },

  { id:'klima-santralleri', title:'Havalandırma Santralleri Periyodik Bakım SOP', category:'Soğutma/İklimlendirme',
    content:`KAPSAM: Havalandırma santrallerinin (AHU) periyodik bakımının yapılması (C3Y07).
Adımlar: 1) Filtrelerin kirlilik kontrolü yapılır, kirliyse değiştirilir (aylık) - tıkalı filtre debiyi düşürür, enerji tüketimini artırır. 2) Sıcak su vanalarının kaçak kontrolü yapılır (yıllık). 3) Fark basınç sensörleri kontrol edilir (yıllık). 4) Isı geri kazanım damper kontrolleri yapılır (yıllık). 5) Sıcaklık sensörleri kontrol edilir (yıllık). 6) Motor vibrasyonları kontrol edilir (yıllık). 7) Fan motor yatakları yağlanır (6 aylık).` },

  { id:'soguk-su-pompalari', title:'Soğuk Su Sirkülasyon Pompaları SOP', category:'Soğutma/İklimlendirme',
    content:`KAPSAM: Soğuk su sistemi sirkülasyon pompalarının periyodik bakımı ve devreye alma.
Adımlar: 1) Pompa LOTO-Elektrik'e göre enerjisi kesilir, kilitlenir. 2) Gövde/bağlantılar sızıntı, korozyon yönünden kontrol edilir. 3) Salmastra/mekanik keçe kontrol edilir, gerekirse değiştirilir. 4) Motor-pompa akuplasyonu kontrol edilir. 5) Yataklama gres/yağlama durumu kontrol edilir. 6) Motor akım değerleri karşılaştırılır. 7) Bakım sonrası LOTO kaldırılır, vana konumları teyit edilir. 8) Pompa çalıştırılır, sistemin su dolu olduğu teyit edilerek kuru çalıştırma önlenir. 9) Basınç/akış/titreşim kontrol edilir, sonuçlar kayıt formuna işlenir.` },

  { id:'sogutma-kulesi', title:'Soğutma Kulesi Periyodik Bakım SOP', category:'Soğutma/İklimlendirme',
    content:`KAPSAM: Soğutma kulesinin periyodik bakım ve kontrolü.
Adımlar: 1) Genel görsel kontrol (yapısal hasar, su sızıntısı). 2) Su seviyesi (havuz) kontrol edilir, otomatik doldurma valfi çalışması teyit edilir. 3) Fan/motor ve kayış (varsa) kontrol edilir. 4) Dolgu malzemesi (fill) kirlenme/tıkanma yönünden kontrol edilir - kirli dolgu soğutma verimini düşürür. 5) Su dağıtım nozulları tıkanıklık yönünden kontrol edilir. 6) Su kalitesi (kimyasal dozaj, Legionella riski açısından biyosit) kontrol edilir - soğutma kuleleri Legionella üremesi için uygun ortam oluşturabilir, düzenli kimyasal muamele şarttır. 7) Blöf (blowdown) sistemi kontrol edilir. 8) Kule çevresi/havuzu periyodik temizlenir. 9) Sonuçlar kayıt formuna işlenir.` },

  { id:'kompresor-bakim', title:'Kompresör-Kurutucu Periyodik Bakım SOP', category:'Basınçlı Hava',
    content:`KAPSAM: Kompresör-kurutucu ünitesinin 8000 saatlik periyodik bakımının yapılması (C3Y08).
Adımlar: 1) Hava giriş bölmesi kontrol edilir. 2) Emniyet valfi (safety valve) switchi kontrol edilir - arızalı emniyet valfi aşırı basınç riski oluşturur. 3) Sensör civata bağlantıları kontrol edilir. 4) Elektrik motoru LOTO-Elektrik'e göre enerjisiz hale getirilerek temizlenir. 5) Ana motor gres ile yağlanır. 6) Yağ sensör kartuşu değiştirilir. 7) Soğutucu bloklar temizlenir. 8) Yağ doldurma valfi kontrol edilir. 9) Soğutma fanı kontrol edilir. 10) Hava, su ve yağ kaçakları kontrol edilir. 11) Yağ ve son soğutucu (aftercooler) temizliği kontrol edilir. 12) Gaz ballastı temizlenir, rotor balansı kontrol edilir. 13) Hava filtresi kontrol edilir. 14) Hava, yağ, su ve sıcaklık servis değerleri kaydedilir. 15) Kompresör yağı değiştirilir. 16) Kompresör yağ filtresi değiştirilir.` },

  { id:'kurutucu-hava-tanki', title:'Kurutucu ve Hava Tankı Periyodik Kontrol SOP', category:'Basınçlı Hava',
    content:`KAPSAM: Basınçlı hava kurutucu ve hava tankının periyodik kontrolü.
Adımlar: 1) Genel görsel kontrol (sızıntı, anormal ses). 2) Çiy noktası (dew point) göstergesi kontrol edilir - yüksek çiy noktası hatlarda yoğuşmaya yol açar. 3) Soğutmalı tiplerde soğutucu akışkan basıncı, adsorbsiyonlu tiplerde kartuş/desikan durumu kontrol edilir. 4) Ön/son filtreler kontrol edilir, kirli olanlar değiştirilir. 5) Hava tankı gövdesi korozyon/hasar yönünden kontrol edilir. 6) Tank emniyet valfi fonksiyonu kontrol edilir. 7) Otomatik kondens tahliye valfi kontrol edilir - tıkalı tahliye tankta su birikimine yol açar. 8) Tank basınç göstergesi doğruluğu kontrol edilir. 9) Sonuçlar kayıt formuna işlenir.` },

  { id:'su-yumusatma', title:'Su Yumuşatma Sistemi Kullanım SOP', category:'Su Sistemleri',
    content:`KAPSAM: Su yumuşatma sisteminin sertlik testi, tuz kontrolü ve rejenerasyon işlemleri (C3Y16).
Adımlar: 1) Yumuşatma cihazı üzerindeki etiketli "numune vanası"ndan 50 cl numune alınır. 2) Numuneye 1 paket buffer-indikatör toz çözeltisi ilave edilip çalkalanır. 3) Renk yeşil-maviye dönene kadar B (titrasyon) çözeltisinden damla damla ilave edilir; her damla 1 Alman sertlik derecesine eşittir, hedef değer 1 Alman sertlik derecesidir. 4) Su sert çıkarsa tuz seviyesi kontrol edilir, eksikse tamamlanır. 5) Kontrol panelinden "R" tuşuna basılı tutularak rejenerasyon başlatılır. 6) Rejenerasyon sonrası sertlik ölçümü tekrarlanır - hâlâ sertlik varsa ilgili amire bildirilir. 7) Günlük klor seviyesi kontrol edilir, eksildikçe tamamlanır.` },

  { id:'hidrofor-sistemi', title:'Hidrofor Sistemi Periyodik Kontrol SOP', category:'Su Sistemleri',
    content:`KAPSAM: Hidrofor (basınçlandırma) sisteminin periyodik kontrolü.
Adımlar: 1) Genel görsel kontrol (sızıntı, anormal ses). 2) Sistem basıncı (start/stop değerleri) manometreden kontrol edilir. 3) Hidrofor tankı hava yastığı basıncı kontrol edilir - yetersiz hava yastığı pompanın sık devreye girmesine yol açar. 4) Pompaların otomatik start/stop döngüsü gözlemlenir. 5) Kuru çalışma koruma (su baskını) sensörü kontrol edilir. 6) Motor akım değerleri kontrol edilir. 7) Vana pozisyonları (emme/basma) kontrol edilir. 8) Sonuçlar kayıt formuna işlenir.` },

  { id:'su-deposu-temizlik', title:'Su Deposu Periyodik Temizlik/Kontrol SOP', category:'Su Sistemleri',
    content:`KAPSAM: Fabrika su depolarının periyodik temizlik ve kontrolü.
Adımlar: 1) Depo boşaltılmadan önce alternatif su beslemesi/stok değerlendirilir. 2) Giriş/çıkış vanaları kapatılır, depo boşaltılır. 3) Depo içine giriş gerekiyorsa Kapalı Alanda Çalışma SOP'una göre izin alınır, atmosfer testi yapılır. 4) İç yüzeyler (tortu, biyofilm, alg) temizlenir. 5) Yapısal hasar (çatlak, korozyon) kontrol edilir. 6) Depo durulanır, kimyasal kalıntısı kalmadığı teyit edilir. 7) Depo doldurulur, su kalitesi (bulanıklık, klor vb.) test edilir. 8) Vanalar normal işletim konumuna getirilir. 9) Sonuçlar kayıt formuna işlenir.` },

  { id:'kimyasal-aritma', title:'Kimyasal Arıtma İşletme SOP', category:'Su Sistemleri',
    content:`KAPSAM: Kimyasal arıtma tesisinin işletilmesi - kimyasal hazırlama, sistem çalıştırma, çamur bertarafı (C3Y17).
Adımlar: 1) Sistem tankları doluluk oranı uygun olduğunda Touch panel üzerinde "START" izni gelir. 2) Baryum klorür tankına 50 kg baryum klorür + su eklenir - toksiktir, kimyasal eldiven/gözlük/maske kullanılmalı. 3) Kireç-kostik tankına 100 lt sıvı kostik + 100 lt su eklenir - kostik ciltte ciddi yanığa yol açar, yüz siperi kullanılmalı. 4) Anyonik poli tankına 1 su bardağı toz + su eklenir. 5) Katyonik poli tankına 1 su bardağı toz + su eklenir. 6) Demir(III) klorür tankında yeterli (50 kg) kimyasal olduğu kontrol edilir. 7) Touch panel "START" butonuna basılır (Şifre: 1234). 8) Sistem otomatik çalışır, süreç takip edilir. 9) Arıtma bitince dengeleme havuzu suyunu reaksiyon havuzuna aktarmak için "START" basılır. 10) Çamur tankı filtrelemek için havalı pompa çalıştırılır. 11) Çamur, çamur arabasına boşaltılır. 12) Çamur, atık alanında torbalara doldurulup Tehlikeli Atık Formu ile Geri Dönüşüm Bölümü'ne iletilir.` },

  { id:'sicak-su-pompalari', title:'Sıcak Su Sirkülasyon Pompaları SOP', category:'Termal Sistemler',
    content:`KAPSAM: Sıcak su sistemi sirkülasyon pompalarının periyodik bakımı ve devreye alma.
Adımlar: 1) Pompa LOTO-Elektrik'e göre enerjisi kesilir, kilitlenir. 2) Gövde/bağlantılar sızıntı yönünden kontrol edilir - sıcak su sızıntısı yanık riski taşır. 3) Salmastra/mekanik keçe kontrol edilir. 4) Motor-pompa akuplasyonu kontrol edilir. 5) Yataklama gres/yağlama durumu kontrol edilir. 6) Motor akım değerleri kontrol edilir. 7) Bakım sonrası LOTO kaldırılır, vana konumları teyit edilir. 8) Pompa çalıştırılır, sistemin su dolu olduğu teyit edilerek kuru çalıştırma önlenir - sıcak su sisteminde kuru çalıştırma ciddi hasara yol açar. 9) Basınç/akış/titreşim/sıcaklık kontrol edilir, sonuçlar kayıt formuna işlenir.` },

  { id:'basincli-hava-sizinti', title:'Basınçlı Hava Hattı Sızıntı Tespiti SOP', category:'Basınçlı Hava',
    content:`KAPSAM: Fabrika genelindeki basınçlı hava dağıtım hatlarında sızıntı tespiti ve onarımı.
Adımlar: 1) Sızıntı şüphesi olan bölge/hat belirlenir, saha gözlemi yapılır. 2) Ultrasonik sızıntı dedektörü (varsa) ile hat taranır. 3) Sızıntı noktası işaretlenir. 4) Hat LOTO/izolasyon prosedürüne göre devre dışı bırakılır, basıncı tahliye edilir. 5) Sızıntı kaynağı belirlenir. 6) Arızalı parça/bağlantı değiştirilir veya sızdırmazlık yenilenir. 7) Bağlantı uygun tork ile sıkılır. 8) Hat kademeli devreye alınır, sabunlu su testiyle sızıntı kalmadığı teyit edilir. 9) Onarım kayıt formuna işlenir.` },

  { id:'elektrikli-el-aleti-kontrolu', title:'Elektrikli El Aleti Kullanım Öncesi Kontrol SOP', category:'Temel Güvenlik',
    content:`KAPSAM: Matkap, taşlama, vidalama gibi elektrikli el aletlerinin kullanım öncesi güvenlik kontrolü.
Adımlar: 1) Alet gövdesi çatlak/kırık yönünden kontrol edilir. 2) Kablo ve fiş hasar yönünden kontrol edilir - hasarlı kablo elektrik çarpması riski taşır. 3) Topraklama hattının (varsa) sağlam olduğu kontrol edilir. 4) Koruma siperi/muhafazası yerinde olduğu kontrol edilir. 5) Çalıştırma/durdurma anahtarı test edilir. 6) Aksesuar (uç, disk) uyumlu ve hasarsız olduğu kontrol edilir - uyumsuz aksesuar fırlama riski taşır. 7) Kaçak akım rölesi (RCD) korumalı priz kullanılır. 8) Hasarlı alet derhal kullanım dışı bırakılıp etiketlenir. 9) Kullanım sonrası alet kapatılır, düzenli saklanır.` },

  { id:'kacis-yolu-kontrolu', title:'Kaçış Yolu ve Acil Çıkış Kapıları Kontrolü SOP', category:'Temel Güvenlik',
    content:`KAPSAM: Fabrika kaçış yolları ve acil çıkış kapılarının periyodik kontrolü.
Adımlar: 1) Kaçış yolları boyunca engel bulunmadığı kontrol edilir - engel tahliyede ciddi risk oluşturur. 2) Acil çıkış kapılarının kilitli olmadığı, panik bar mekanizmasının çalıştığı kontrol edilir. 3) Kaçış yolu acil aydınlatması çalışır durumda kontrol edilir. 4) Yönlendirme levhaları görünür ve okunaklı kontrol edilir. 5) Kapıların dışarıya doğru açıldığı kontrol edilir. 6) Toplanma alanı işaretlemesi kontrol edilir. 7) Tespit edilen engel/arıza giderilir. 8) Sonuçlar kayıt formuna işlenir.` },

  { id:'priz-anahtar-armatur', title:'Priz/Anahtar/Aydınlatma Armatürü Montaj-Değişimi SOP', category:'Elektrik Altyapı',
    content:`KAPSAM: Priz, anahtar ve aydınlatma armatürlerinin montaj/değişim işlemleri.
Adımlar: 1) İlgili devre LOTO-Elektrik'e göre enerjisiz hale getirilir. 2) Eski ekipman sökülür, kablo bağlantıları not edilir. 3) Yeni ekipmanın voltaj/akım uyumu kontrol edilir. 4) Kablo bağlantıları (faz, nötr, toprak) doğru yapılır - toprak bağlantısının atlanması ciddi güvenlik riski oluşturur. 5) Ekipman sabitlenir. 6) Bağlantılar enerji verilmeden önce görsel kontrol edilir. 7) Enerji verilir, çalıştığı test edilir. 8) Kapak/pano düzeni toparlanır. 9) İşlem kayıt formuna işlenir.` },

  { id:'kablo-cekimi-kanal', title:'Kablo Çekimi ve Kablo Kanalı Döşeme SOP', category:'Elektrik Altyapı',
    content:`KAPSAM: Yeni elektrik kablosu çekimi ve kablo kanalı/tavası döşeme işlemleri.
Adımlar: 1) Güzergah belirlenir, mevcut tesisatlarla çakışma kontrol edilir. 2) Kablo kanalı/tava güzergaha sabitlenir. 3) Kablo kesiti yük hesabına uygun seçilir - yetersiz kesit aşırı ısınma/yangın riski taşır. 4) Kablo çekimi yapılır, aşırı çekme kuvveti uygulanmaz. 5) Büküm yarıçapı üretici toleransına uygun olmalı - aşırı büküm iletkende hasara yol açar. 6) Kablo kanal içinde düzenli dizilir, etiketlenir. 7) Uçlar panoya/klemense enerjisiz ortamda bağlanır. 8) İzolasyon direnci (megger) testi yapılır. 9) Enerji verilir, fonksiyon testi yapılır. 10) Uygulama kayıt formuna işlenir.` },

  { id:'duman-isi-dedektoru', title:'Duman/Isı Dedektörü Fiziksel Temizlik ve Test SOP', category:'Yangın Alarm Paneli',
    content:`KAPSAM: Yangın alarm sistemi duman/ısı dedektörlerinin fiziksel temizliği ve fonksiyon testi.
Adımlar: 1) Test öncesi ilgili bölgenin test modunda olduğu panele bildirilir (yanlış alarm önleme). 2) Dedektör dış yüzeyi temizlenir - kirli dedektör hatalı algılamaya yol açabilir. 3) Kapak açılarak iç kısım kontrol edilir. 4) Test spreyi/ısı kaynağı ile fonksiyon testi yapılır. 5) Panelde alarm sinyali verdiği teyit edilir. 6) Test sonrası dedektör resetlenir, panel normal moda alınır. 7) Arızalı dedektör değiştirilir/servis çağrılır. 8) Sonuçlar kayıt formuna işlenir.` },

  { id:'hidrolik-unite-bakimi', title:'Hidrolik Ünite Bakımı ve Yağ Analizi SOP', category:'Hidrolik/Pnömatik',
    content:`KAPSAM: Hidrolik güç ünitelerinin periyodik bakımı ve yağ analizi.
Adımlar: 1) Ünite LOTO-Elektrik'e göre enerjisiz hale getirilir (müdahale gerektiren bakımlarda). 2) Yağ seviyesi kontrol edilir, tamamlanır. 3) Yağ filtresi kirlilik göstergesi kontrol edilir. 4) Yağ sıcaklığı çalışma aralığında kontrol edilir - aşırı sıcaklık yağ bozulmasını hızlandırır. 5) Numune alınarak periyodik yağ analizi yaptırılır - erken arıza tespiti sağlar. 6) Hortum/boru bağlantılarında sızıntı kontrol edilir. 7) Basınç ayarları (relief valve) kontrol edilir. 8) Pompa/motor titreşim ve sesi kontrol edilir. 9) Sonuçlar kayıt formuna işlenir.` },

  { id:'hidrolik-hortum-degisimi', title:'Hidrolik Hortum/Boru Değişimi SOP', category:'Hidrolik/Pnömatik',
    content:`KAPSAM: Hidrolik sistemlerdeki aşınmış/hasarlı hortum ve boruların değiştirilmesi.
Adımlar: 1) Sistem LOTO-Mekanik'e göre basınçsız hale getirilir; akümülatör (varsa) boşaltılır. 2) Basıncın sıfır olduğu manometreden teyit edilir - basınçlı hortum sökümü ciddi yaralanmaya yol açabilir. 3) Bağlantılar (fitting) sökülür. 4) Sızan yağ için toplama kabı kullanılır. 5) Yeni hortumun basınç sınıfı/ölçüsü karşılaştırılır. 6) Yeni hortum bağlanır, tork ile sıkılır. 7) Sistem kademeli basınçlandırılır, düşük basınçta sızıntı kontrolü yapılır. 8) Tam basınçta fonksiyon testi yapılır. 9) Atıklar bertaraf edilir. 10) Sonuçlar kayıt formuna işlenir.` },

  { id:'hidrolik-silindir-bakimi', title:'Hidrolik Silindir Bakımı SOP', category:'Hidrolik/Pnömatik',
    content:`KAPSAM: Hidrolik silindirlerin periyodik bakımı ve sızdırmazlık kontrolü.
Adımlar: 1) Sistem LOTO-Mekanik'e göre basınçsız hale getirilir. 2) Silindir gövdesi/mil yüzeyi hasar yönünden kontrol edilir - çizik mil yüzeyi sızıntıya yol açar. 3) Bağlantı noktalarında sızıntı kontrol edilir. 4) Keçe/conta aşınması kontrol edilir, değiştirilir. 5) Silindir sökülecekse mekanik destekle sabitlenir - kontrolsüz düşme riski taşır. 6) Keçe değişimi üretici sırasına uygun yapılır. 7) Silindir monte edilir, bağlantılar sıkılır. 8) Sistem kademeli basınçlandırılır, sızıntı/hareket testi yapılır. 9) Sonuçlar kayıt formuna işlenir.` },

  { id:'pnomatik-valf-silindir', title:'Pnömatik Valf/Silindir Bakımı SOP', category:'Hidrolik/Pnömatik',
    content:`KAPSAM: Pnömatik valf ve silindirlerin periyodik bakımı.
Adımlar: 1) Sistem LOTO-Mekanik'e göre basınçsız hale getirilir, hat tahliye edilir. 2) Valf/silindir gövdesi hasar yönünden kontrol edilir. 3) Bağlantılarda sızıntı (sabunlu su testi) kontrol edilir. 4) Silindir keçeleri aşınma yönünden kontrol edilir. 5) Yağlayıcı (varsa) yağ seviyesi kontrol edilir. 6) Filtre-regülatör kontrol edilir, kondens tahliye edilir. 7) Solenoid valf bağlantıları kontrol edilir. 8) Sistem devreye alınır, fonksiyon testi yapılır. 9) Sonuçlar kayıt formuna işlenir.` },

  { id:'topraklama-direnc-olcumu', title:'Topraklama Sistemi Periyodik Direnç Ölçümü SOP', category:'Elektrik Altyapı',
    content:`KAPSAM: Fabrika topraklama sisteminin periyodik direnç ölçümü ve kontrolü.
Adımlar: 1) Ölçüm yapılacak topraklama noktaları belirlenir. 2) Topraklama megeri ile ölçüm yapılır. 3) Sonuçlar ilgili standarda göre değerlendirilir - yüksek direnç elektrik çarpması/arıza riskini artırır. 4) Bağlantı noktaları korozyon/gevşeklik yönünden kontrol edilir. 5) Süreklilik testi (varsa) yapılır. 6) Referansın üzerinde direnç tespit edilirse elektrot/bağlantı iyileştirilir. 7) Sonuçlar kayıt formuna işlenir. 8) Anormallikte bakım talebi açılır.` },

  { id:'reduktor-yag-degisimi', title:'Redüktör (Dişli Kutusu) Yağ Değişimi/Bakımı SOP', category:'Mekanik/Elektrik Bakım',
    content:`KAPSAM: Redüktörlerin periyodik yağ değişimi ve bakımı.
Adımlar: 1) Redüktör LOTO-Elektrik ve LOTO-Mekanik'e göre enerjisiz hale getirilir. 2) Gövde sızıntı/hasar yönünden kontrol edilir. 3) Eski yağ tapasından boşaltılır - hafif ısınmışken yağ daha akışkan olur. 4) Boşaltılan yağ görsel incelenir (renk, metal parçacık) - metal parçacık iç aşınma göstergesidir. 5) İç kısım gerekiyorsa temizlenir. 6) Yeni yağ üretici talimatına uygun doldurulur. 7) Yağ seviyesi teyit edilir. 8) LOTO kaldırılır, sızıntı/ses/titreşim kontrol edilir. 9) Eski yağ bertaraf edilir. 10) Sonuçlar kayıt formuna işlenir.` },

  { id:'kaplin-degisimi', title:'Kaplin Değişimi SOP', category:'Mekanik/Elektrik Bakım',
    content:`KAPSAM: Motor-ekipman arasındaki kaplin (coupling) bağlantı elemanının değiştirilmesi.
Adımlar: 1) Ekipman LOTO-Elektrik ve LOTO-Mekanik'e göre enerjisiz hale getirilir. 2) Koruma muhafazası sökülür. 3) Eski kaplin elemanı sökülür. 4) Mil yüzeyleri/göbekler aşınma yönünden kontrol edilir. 5) Yeni kaplin tip/ölçüsü karşılaştırılır. 6) Yeni kaplin takılır. 7) Hizalama kontrol edilir/yapılır - hizalama hatası titreşime yol açar. 8) Muhafaza takılır. 9) LOTO kaldırılır, titreşim/ses kontrol edilir. 10) Sonuçlar kayıt formuna işlenir.` },

  { id:'paratoner-kontrolu', title:'Paratoner (Yıldırımlık) Periyodik Kontrolü SOP', category:'Elektrik Altyapı',
    content:`KAPSAM: Fabrika paratoner sisteminin periyodik kontrolü.
Adımlar: 1) Paratoner ucu görsel kontrolü yapılır (yükseklik gerektiriyorsa Yüksekte Çalışma SOP'una uyulur). 2) İniş iletkenleri süreklilik ve bağlantı sağlamlığı kontrol edilir. 3) Topraklama bağlantı noktaları kontrol edilir. 4) Topraklama direnci ölçülür, referansın altında olduğu teyit edilir. 5) Bağlantı klemensleri korozyon yönünden kontrol edilir. 6) Süreklilik testi (varsa) yapılır. 7) Anormallikte derhal bakım talebi açılır. 8) Sonuçlar kayıt formuna işlenir.` },

  { id:'kalinlik-olcum-kalibrasyonu', title:'Kalınlık Ölçüm Cihazı Kalibrasyonu SOP', category:'Kalite Ölçüm',
    content:`KAPSAM: Üretimde kullanılan film/levha kalınlık ölçüm cihazlarının periyodik kalibrasyonu.
Adımlar: 1) Cihaz üretici talimatındaki süre kadar ısınmaya bırakılır. 2) Sertifikalı referans kalınlık standardı temin edilir. 3) Cihaz sıfır kalibrasyonu yapılır. 4) Referans standart ölçülür, sertifika değeriyle karşılaştırılır. 5) Sapma toleransın dışındaysa cihaz ayarlanır. 6) Farklı aralıkta ikinci referansla doğrulama yapılır. 7) Sonuç (tarih, referans, sapma) kayıt formuna işlenir. 8) Kalibrasyon etiketi cihaza yapıştırılır.` },

  { id:'viskozimetre-kalibrasyonu', title:'Viskozimetre Kalibrasyonu SOP', category:'Kalite Ölçüm',
    content:`KAPSAM: Mürekkep/kaplama viskozite ölçüm cihazlarının (viskozimetre) periyodik kalibrasyonu.
Adımlar: 1) Cihaz ve referans belirtilen test sıcaklığına getirilir - sıcaklık viskoziteyi doğrudan etkiler. 2) Cihaz temizliği yapılır. 3) Sertifikalı referans viskozite sıvısı ile ölçüm yapılır. 4) Değer sertifika değeriyle karşılaştırılır. 5) Sapma toleransın dışındaysa ayarlanır/servis çağrılır. 6) Farklı aralıkta ikinci referansla doğrulama yapılır. 7) Sonuç kayıt formuna işlenir. 8) Kalibrasyon etiketi yapıştırılır.` },

  { id:'vinc-kren-yillik-muayene', title:'Vinç/Kren Yıllık Periyodik Muayene SOP', category:'Kaldırma Ekipmanları',
    content:`KAPSAM: Fabrika vinç/kren ekipmanlarının yasal zorunlu yıllık periyodik muayenesi.
Adımlar: 1) Yetkili/akredite muayene kuruluşu ile randevu planlanır. 2) Günlük kontrol kayıtları gözden geçirilir. 3) Çalışma alanı/erişim güvenli hale getirilir. 4) Statik yük testi (nominal kapasitenin ~%125'i) muayene elemanı gözetiminde yapılır. 5) Dinamik yük ve fren testi yapılır. 6) Halat/zincir, kanca, limit switch kontrol edilir. 7) Uygunluk raporu ve etiketi düzenlenir. 8) Uygun olmayan bulgularda vinç kullanım dışı bırakılır. 9) Rapor kayıt altına alınır, sonraki muayene tarihi takvime işlenir.` },

  { id:'cati-bakimi-su-yalitimi', title:'Çatı Bakımı ve Su Yalıtımı Kontrolü SOP', category:'Yapısal/Genel Bakım',
    content:`KAPSAM: Fabrika çatısının periyodik bakımı ve su yalıtımı kontrolü.
Adımlar: 1) Çatıya çıkışta Yüksekte Çalışma SOP'una uygun önlemler alınır. 2) Çatı yüzeyi görsel kontrolü yapılır (çatlak, şişme, yırtık membran). 3) Dere/oluk ve tahliye ağızları tıkanıklık yönünden kontrol edilir - tıkanıklık su birikmesine/sızıntıya yol açar. 4) Çatı geçişleri etrafındaki yalıtım detayları kontrol edilir. 5) Hasar tespit edilirse onarım yapılır. 6) Yabancı malzeme/birikinti temizlenir. 7) İç mekanda su izi ayrıca kontrol edilir. 8) Sonuçlar kayıt formuna işlenir.` },

  { id:'kanalizasyon-drenaj', title:'Kanalizasyon/Yağmur Suyu Drenaj Sistemi Kontrolü SOP', category:'Yapısal/Genel Bakım',
    content:`KAPSAM: Fabrika saha kanalizasyon ve yağmur suyu drenaj sisteminin periyodik kontrolü.
Adımlar: 1) Izgara/rögar kapakları görsel kontrolü yapılır. 2) Izgaralardaki yabancı madde temizlenir. 3) Rögar içi tıkanıklık kontrol edilir (girmek gerekiyorsa Kapalı Alanda Çalışma SOP'una uyulur). 4) Hatlarda geriye akış/taşma belirtisi kontrol edilir. 5) Yağ/kum tutucu üniteler doluluk yönünden kontrol edilir. 6) Saha yüzey eğimleri/su birikinti noktaları gözlemlenir. 7) Tıkanıklık/hasar giderilir. 8) Sonuçlar kayıt formuna işlenir.` },

  { id:'gaz-tupu-depolama', title:'Gaz Tüpü (LPG/Oksijen/Asetilen) Depolama ve Güvenli Değişim SOP', category:'Atölyeler',
    content:`KAPSAM: Kaynak/kesme işlerinde kullanılan gaz tüplerinin güvenli depolanması ve değişimi.
Adımlar: 1) Tüpler dik, sabitlenmiş ve birbirinden ayrı (oksijen-yanıcı gaz) depolanır - birlikte depolama yangın/patlama riskini artırır. 2) Depolama alanı iyi havalandırılan, ateş kaynağından uzak olmalıdır. 3) Değişimde önce vana kapatılır, hat basıncı tahliye edilir. 4) Regülatör sökülür, bağlantı yüzeyi temizlenir. 5) Yeni tüp güvenlik kontrolünden geçirilir. 6) Regülatör takılır, sızdırmazlık sabunlu su ile kontrol edilir. 7) Tüp taşımada uygun tüp arabası kullanılır - yuvarlanarak taşınmaz. 8) Değişim kayıt formuna işlenir. 9) Boş tüpler işaretlenip ayrı alanda depolanır.` },

  { id:'yangin-dolabi-hidrant', title:'Yangın Dolabı (Hidrant) Periyodik Kontrolü SOP', category:'Yangın Sistemleri',
    content:`KAPSAM: Fabrika içi/dışı yangın dolaplarının (hidrant) periyodik kontrolü.
Adımlar: 1) Dolap kapısının kolay açılabilir olduğu, önünde engel olmadığı kontrol edilir. 2) Hortum sarılı düzeninin bozulmadığı, hasar olmadığı kontrol edilir. 3) Lans (nozul) bağlantısı/fonksiyonu kontrol edilir. 4) Vananın kolayca açılıp kapandığı test edilir. 5) Hat basıncı (varsa) kontrol edilir. 6) Yılda bir su akış testi yapılır - hattın gerçekten su verdiği teyit edilmelidir. 7) Dolap işaretlemesi (kırmızı renk, tabela) net olduğu kontrol edilir. 8) Sonuçlar kayıt formuna işlenir.` },

  { id:'emniyet-kemeri-muayene', title:'Emniyet Kemeri ve Düşme Önleme Ekipmanları Periyodik Muayene SOP', category:'Temel Güvenlik',
    content:`KAPSAM: Tam vücut emniyet kemeri, halat, karabina gibi düşme önleme ekipmanlarının periyodik muayenesi.
Adımlar: 1) Ekipman kullanım öncesi ve periyodik (genelde yılda bir) muayene edilir. 2) Kemer kayışları kesik/aşınma/UV bozulması yönünden kontrol edilir. 3) Dikişlerde sökülme kontrol edilir. 4) Metal parçalar (toka, D-halka, karabina) korozyon yönünden kontrol edilir. 5) Enerji sönümleyici etiketinin aktive olmamış olduğu kontrol edilir. 6) Halat/yaşam hattı hasar yönünden kontrol edilir. 7) Hasarlı ekipman derhal kullanım dışı bırakılıp imha edilir - hasarlı ekipmanla çalışma ciddi düşme riski taşır. 8) Sonuçlar kayıt formuna işlenir, sonraki muayene takvime eklenir.` },

  { id:'nira-neptune-analiz', title:'Nira Analiz Cihazı Manuel Kullanım SOP', category:'Kalite Ölçüm',
    content:`KAPSAM: Nira marka kalıntı solvent analiz cihazının manuel (şırınga ile numune enjeksiyonu) kullanımı (C3Y24).
Adımlar: 1) Analiz edilecek numune temiz bir kapla alınır; hat biraz tahliye edilip kap çalkalanıp boşaltıldıktan sonra tekrar doldurulur. 2) Cihaz klavyesinden Esc'e basılıp mevcut analizin sonlanması beklenir. 3) Numune girişi kapağı Open yönünde açılır, delikli aparat monte edilip sıkılır. 4) Klavyeden F4 (Single Front), ardından F5 ile işlem başlatılır. 5) Cam şırınga ile numuneden 3-4 kez alınıp boşaltılarak temizlenir, 5 mg numune şırıngaya çekilir - solvent cilt temasına karşı kimyasal eldiven kullanılmalı. 6) Cam şırınga hazneye takılıp beklenir. 7) "Introduce mixture" yazısı çıkınca numune yavaşça enjekte edilir. 8) Cihaz ~8 dakika analiz eder; bitince F6 (Print) ile çıktı alınır, Esc ile çıkılır. 9) Şırınga/aparat çıkarılır, orijinal kapak Closed yönünde sıkılır. 10) F5 ile sistem tekrar başlatılır.` },

  { id:'nira-neptune-kalibrasyon', title:'Nira Neptune 801 Kalibrasyon SOP', category:'Kalite Ölçüm',
    content:`KAPSAM: Nira Neptune 801 kalıntı solvent analiz cihazının periyodik kalibrasyonu (standart kalibrasyon karışımı ile).
Adımlar: 1) Sertifikalı standart kalibrasyon karışımı hazırlanır/temin edilir. 2) Cihaz üzerindeki doğrudan sıvı enjeksiyonuna ayrılmış ek sızdırmazlık noktasından standart karışım enjekte edilir. 3) Dokunmatik ekrandan kalibrasyon modu seçilir. 4) Cihaz standardı analiz eder, ölçülen değerler referans sertifika değeriyle karşılaştırılır. 5) Sapma toleransın dışındaysa kalibrasyon eğrisi (response factor) güncellenir. 6) Farklı konsantrasyonda ikinci bir standartla doğrulama yapılır. 7) Kalibrasyon sonucu (tarih, standart bilgisi, sapma) kayıt formuna işlenir. 8) Bir sonraki kalibrasyon tarihi planlanır.` },

  { id:'nira-neptune-hidrojen', title:'Nira Neptune 801 Hidrojen Gaz Tüpü Değişimi SOP', category:'Kalite Ölçüm',
    content:`KAPSAM: Nira Neptune 801 cihazının FID dedektörü için gerekli 4,5 saflık hidrojen gaz tüpünün güvenli değişimi ve depolanması.

  { id:'solvent-aktarim', title:'Solvent Aktarım Talimatı (Tankerden Tanka) SOP', category:'Termal Sistemler',

  { id:'nira-taurus-kalibrasyon', title:'Nira Taurus Analizör Cihazı Kalibrasyon SOP', category:'Kalite Ölçüm',

/* ---------------- Storage helpers ----------------
   claude.ai artifact ortamında window.storage kullanılır (ortak/paylaşılan).
   Bağımsız barındırmada (GitHub Pages vb.) window.storage yoktur; bu durumda
   localStorage'a otomatik düşülür. NOT: localStorage yalnızca o cihaz/tarayıcıya
   özeldir - farklı telefonlar birbirinin verisini göremez. Cihazlar arası ortak
   sonuç takibi için Google Sheets webhook desteği aşağıda ayrıca eklenmiştir. */
const HAS_ARTIFACT_STORAGE = (typeof window.storage !== 'undefined');

async function storGet(key){
  try{
    if(HAS_ARTIFACT_STORAGE){
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : null;
    }else{
      const v = localStorage.getItem('sop-sinav:'+key);
      return v ? JSON.parse(v) : null;
    }
  }catch(e){ return null; }
}
async function storSet(key, val){
  try{
    if(HAS_ARTIFACT_STORAGE){
      await window.storage.set(key, JSON.stringify(val), true);
    }else{
      localStorage.setItem('sop-sinav:'+key, JSON.stringify(val));
    }
    return true;
  }catch(e){ return false; }
}
function uid(n){ n = n || 10; const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }

async function boot(){
  state.loading = true; render();
  let sops = await storGet('sop-library');
  if(!sops || !sops.length){
    sops = SOP_SEED;
    await storSet('sop-library', sops);
  }else{
    // Daha önce kaydedilmiş bir kütüphane varsa, kullanıcının eklediği özel SOP'lar
    // korunur; SOP_SEED'e sonradan eklenen yeni yerleşik SOP'lar da (id eşleşmesiyle)
    // otomatik olarak eklenir - böylece güncellemeler her cihazda görünür.
    const existingIds = new Set(sops.map(s=>s.id));
    const newOnes = SOP_SEED.filter(s=>!existingIds.has(s.id));
    if(newOnes.length){
      sops = sops.concat(newOnes);
      await storSet('sop-library', sops);
    }
  }
  let exams = await storGet('exams'); if(!exams) exams = []; // legacy, kullanılmıyor
  let results = await storGet('results'); if(!results) results = [];

  let personnel = await storGet('personnel');
  if(!personnel || !personnel.length){
    personnel = PERSONNEL_SEED;
    await storSet('personnel', personnel);
  }else{
    const existingPIds = new Set(personnel.map(p=>p.id));
    const newP = PERSONNEL_SEED.filter(p=>!existingPIds.has(p.id));
    if(newP.length){ personnel = personnel.concat(newP); await storSet('personnel', personnel); }
  }
  let sopAssignments = await storGet('sop-assignments'); if(!sopAssignments) sopAssignments = {};
  // Atama şablonu (departman bazlı) versiyonlanır: önceki bir sürümden düşükse, buradaki
  // doğru eşleştirme mevcut atamaların üzerine yazılır. Bu, admin'in bu noktadan SONRA
  // elle yapacağı değişiklikleri etkilemez - yalnızca geçmiş hatalı/varsayılan atamaları düzeltir.
  let seedVersion = await storGet('assignment-seed-version'); if(!seedVersion) seedVersion = 0;
  if(seedVersion < ASSIGNMENT_SEED_VERSION){
    Object.entries(SOP_ASSIGNMENT_SEED).forEach(([sopId, seedAssign]) => {
      sopAssignments[sopId] = seedAssign;
    });
    await storSet('sop-assignments', sopAssignments);
    await storSet('assignment-seed-version', ASSIGNMENT_SEED_VERSION);
  }

  state.sops = sops; state.exams = exams; state.results = results;
  state.personnel = personnel; state.sopAssignments = sopAssignments;
  state.loading = false; state.loaded = true;
  render();
}

/* ---------------- Local question generation (API gerektirmez) ---------------- */
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function pickExamQuestions(sop){
  const bank = QUESTION_BANKS[sop.id];
  if(!bank || bank.length < 5){
    throw new Error('Bu SOP için henüz soru havuzu hazırlanmadı. Sorularınızı ileterek eklememi isteyebilirsiniz.');
  }
  const chosen = shuffleArr(bank).slice(0, Math.min(10, bank.length));
  return chosen.map(item => {
    const optOrder = shuffleArr(item.o.map((text, idx) => ({text, idx})));
    const newCorrect = optOrder.findIndex(o => o.idx === item.c);
    return {
      question: item.q,
      options: optOrder.map(o => o.text),
      correctIndex: newCorrect,
    };
  });
}

  const restrictedNav = !state.isAdmin && currentPersonnel; // sadece personel girişliyse admin sekmeleri gizlenir
  const allItems = [
    {v:'library', label:'SOP Kütüphanesi', icon:ICONS.library},
    {v:'generate', label:'Sınav Oluştur', icon:ICONS.generate, adminOnly:true},
    {v:'take', label:'Sınava Gir', icon:ICONS.take},
    {v:'results', label:'Sonuçlar', icon:ICONS.results},
    {v:'personnel', label:'Personel', icon:ICONS.users, adminOnly:true},
    {v:'compliance', label:'Uyum Takibi', icon:ICONS.target, adminOnly:true},
  ];
  const items = restrictedNav ? allItems.filter(it=>!it.adminOnly) : allItems;
  return `
  <div class="sidebar">
    <div class="brand">
      <div class="mark">SP</div>
      <div class="txt">
        <div class="l1">SOP Sınav Sistemi</div>
        <div class="l2">Teknik Bakım Eğitimi</div>
      </div>
    </div>
    <div class="navgroup-label">Menü</div>
    ${items.map(it => `
      <div class="navitem ${state.view===it.v?'active':''}" data-nav="${it.v}">
        ${it.icon}<span>${it.label}</span>
      </div>
    `).join('')}
    <div class="sidebar-foot">
      ${state.sops.length} SOP &middot; ${state.results.length} sonuç kaydı
      <div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--line-soft); display:flex; flex-direction:column; gap:6px;">
        ${currentPersonnel ? `
          <div><span style="color:var(--blue);">&#9679;</span> Merhaba, ${escapeHtml(currentPersonnel.name)} &middot; <a href="#" data-personnel-logout style="color:var(--text-2); text-decoration:underline; cursor:pointer;">Çıkış</a></div>
        ` : `
          <a href="#" data-personnel-login-open style="color:var(--text-2); text-decoration:underline; cursor:pointer;">Personel Girişi</a>
        `}
        ${state.isAdmin
          ? `<div><span style="color:var(--green);">&#9679;</span> Yönetici modu &middot; <a href="#" data-admin-logout style="color:var(--text-2); text-decoration:underline; cursor:pointer;">Çıkış</a></div>`
          : `<a href="#" data-admin-login-open style="color:var(--text-2); text-decoration:underline; cursor:pointer;">Yönetici Girişi</a>`}
      </div>
    </div>
  </div>
  ${state.showAdminLogin ? renderAdminLoginModal() : ''}
  ${state.showPersonnelLogin ? renderPersonnelLoginModal() : ''}`;
}
